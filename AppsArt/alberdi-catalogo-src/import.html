<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<title>Importar productos a Firestore</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  body{font-family:Arial,sans-serif; max-width:560px; margin:40px auto; padding:0 16px; color:#2B2822;}
  button{padding:12px 20px; font-size:15px; border-radius:8px; border:none; background:#B5651D; color:#fff; cursor:pointer;}
  button:disabled{opacity:.5; cursor:default;}
  #log{margin-top:20px; font-family:monospace; font-size:13px; white-space:pre-wrap; background:#F2F0EA; padding:12px; border-radius:8px; max-height:400px; overflow:auto;}
</style>
</head>
<body>
<h2>Importar catálogo a Firestore</h2>
<p>Sube los productos de <code>data/productos.json</code> a la colección <code>productos</code>. Usar una sola vez (vuelve a correr = sobrescribe, es seguro repetir).</p>
<button id="btn">Importar ahora</button>
<div id="log"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBbyTSnTekMkXOZOAZEV0SQzk46NqkyaSA",
  authDomain: "de-r-13.firebaseapp.com",
  projectId: "de-r-13",
  storageBucket: "de-r-13.firebasestorage.app",
  messagingSenderId: "79165446593",
  appId: "1:79165446593:web:19719e556144c227833740"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const logEl = document.getElementById('log');
function log(msg){ logEl.textContent += msg + '\n'; logEl.scrollTop = logEl.scrollHeight; }

document.getElementById('btn').addEventListener('click', async () => {
  document.getElementById('btn').disabled = true;
  log('Leyendo data/productos.json...');
  const res = await fetch('./data/productos.json');
  const productos = await res.json();
  log('Productos a importar: ' + productos.length);

  const CHUNK = 400;
  let done = 0;
  for (let i = 0; i < productos.length; i += CHUNK) {
    const batch = db.batch();
    const slice = productos.slice(i, i + CHUNK);
    slice.forEach(p => {
      const ref = db.collection('productos').doc('p' + p.id);
      batch.set(ref, p);
    });
    await batch.commit();
    done += slice.length;
    log('Subidos ' + done + ' / ' + productos.length);
  }
  log('¡Listo! Importación completa.');
});
</script>
</body>
</html>
