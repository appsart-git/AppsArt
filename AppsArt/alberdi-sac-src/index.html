<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAC · Reclamos - Alberdi</title>
<meta name="theme-color" content="#14171A">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#14171A; --surface:#1D2126; --surface-2:#262B32; --border:#2E343C;
    --text:#ECEDEF; --text-muted:#8B92A0; --text-faint:#5C6470;
    --brand:#898A8D; --accent:#E8A33D; --accent-ink:#1A1305; --accent-soft:rgba(232,163,61,.16);
    --green:#4C8B5A; --red:#E15252;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font);
    -webkit-font-smoothing:antialiased; min-height:100vh; padding-bottom:24px;
  }
  img{max-width:100%; display:block;}
  button{font-family:inherit;}
  input{font-family:inherit;}
  ::placeholder{color:var(--text-faint);}

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--surface);
    border-bottom:1px solid var(--border); padding:12px 14px 10px;
  }
  .topbar-inner{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px;}
  .brand{display:flex; align-items:center; gap:8px;}
  .brand-logo{line-height:1;}
  .brand-logo .marca-sub{display:block; font-size:10.5px; font-weight:500; color:var(--brand); letter-spacing:.02em; margin:0 0 1px 2px;}
  .brand-logo .marca-main{font-size:21px; font-weight:800; color:var(--brand); letter-spacing:-0.01em;}
  .brand-logo .marca-main .dot{display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--brand); margin-left:3px; vertical-align:top; margin-top:3px;}
  .brand-logo small{display:block; font-size:11px; font-weight:500; color:var(--text-muted); margin-top:2px;}
  .topbar-actions{display:flex; gap:8px;}
  .icon-btn{
    display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); padding:9px 13px; border-radius:10px; font-size:13.5px; font-weight:600; cursor:pointer;
    white-space:nowrap;
  }
  .icon-btn .count{
    background:var(--accent); color:var(--accent-ink); border-radius:20px; font-size:11px; padding:1px 7px; font-weight:700;
  }
  .search-row{position:relative; margin-bottom:10px;}
  .search-row input{
    width:100%; padding:11px 14px 11px 36px; border-radius:11px; border:1px solid var(--border);
    background:var(--surface-2); font-size:14.5px; color:var(--text);
  }
  .search-row input:focus{outline:2px solid var(--accent); outline-offset:0; background:var(--surface);}
  .search-icon{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.55; font-size:15px; pointer-events:none;}

  .view-tabs, .coleccion-tabs{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none;}
  .view-tabs::-webkit-scrollbar, .coleccion-tabs::-webkit-scrollbar{display:none;}
  .tab-chip{
    flex:none; padding:8px 14px; border-radius:20px; border:1px solid var(--border); background:var(--surface);
    color:var(--text-muted); font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .tab-chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

  .active-filters{display:flex; gap:6px; flex-wrap:wrap; padding:10px 14px 0;}
  .active-filters:empty{display:none;}
  .af-chip{
    display:flex; align-items:center; gap:6px; background:var(--accent-soft); color:var(--accent);
    border-radius:20px; padding:5px 10px 5px 12px; font-size:12.5px; font-weight:600;
  }
  .af-chip button{background:none; border:none; color:var(--accent); cursor:pointer; font-size:14px; line-height:1; padding:0;}
  .clear-all{background:none; border:none; color:var(--text-muted); font-size:12.5px; text-decoration:underline; cursor:pointer; padding:5px 4px;}

  .result-count{padding:12px 14px 6px; font-size:12.5px; color:var(--text-muted); font-weight:600;}

  /* ---------- KPIs ---------- */
  .kpi-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; padding:6px 14px 4px; max-width:1200px; margin:0 auto;}
  @media (min-width:640px){ .kpi-grid{grid-template-columns:repeat(3,1fr);} }
  @media (min-width:900px){ .kpi-grid{grid-template-columns:repeat(5,1fr); gap:14px; padding:6px 24px 4px;} }
  .kpi-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 15px 12px;}
  .kpi-card .v{font-size:21px; font-weight:800; color:var(--text); line-height:1.15;}
  .kpi-card .l{font-size:11.5px; color:var(--text-muted); margin-top:5px; font-weight:600;}
  .kpi-card.warn .v{color:var(--red);}
  .kpi-card.good .v{color:var(--green);}
  .kpi-card.accent .v{color:var(--accent);}

  /* ---------- Controles del panel ---------- */
  .dash-controls{display:flex; flex-wrap:wrap; gap:16px; padding:4px 14px 4px; max-width:1200px; margin:0 auto;}
  @media (min-width:900px){ .dash-controls{padding:4px 24px 4px;} }
  .dash-control-group{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .dash-control-group span{font-size:11.5px; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:.02em;}

  /* ---------- Charts ---------- */
  .chart-grid{display:grid; grid-template-columns:1fr; gap:14px; padding:14px 14px 20px; max-width:1200px; margin:0 auto;}
  @media (min-width:900px){ .chart-grid{grid-template-columns:repeat(2,1fr); padding:14px 24px 24px;} }
  .chart-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px 12px; min-width:0;}
  .chart-card.wide{grid-column:1/-1;}
  .chart-card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px; flex-wrap:wrap;}
  .chart-card h4{margin:0; font-size:13px; font-weight:700; color:var(--text);}
  .chart-toggle{display:flex; gap:4px;}
  .chart-toggle button{
    padding:4px 10px; border-radius:14px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text-muted); font-size:11px; font-weight:700; cursor:pointer;
  }
  .chart-toggle button.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .chart-wrap{position:relative; height:230px;}
  .chart-empty{padding:60px 0; text-align:center; color:var(--text-faint); font-size:12.5px;}

  .empty-state{padding:60px 20px; text-align:center; color:var(--text-muted);}
  .empty-state .big{font-size:34px; margin-bottom:8px;}
  .empty-state .btn-primary{max-width:260px; margin:16px auto 0;}

  /* ---------- Table ---------- */
  .table-toolbar{display:flex; align-items:center; justify-content:space-between; padding:10px 14px 0; max-width:1200px; margin:0 auto; gap:10px; flex-wrap:wrap;}
  @media (min-width:900px){ .table-toolbar{padding:10px 24px 0;} }
  .table-toolbar .btn-ghost{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:8px 13px;
    border-radius:10px; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .table-wrap{padding:10px 14px 20px; max-width:1200px; margin:0 auto; overflow-x:auto;}
  @media (min-width:900px){ .table-wrap{padding:10px 24px 24px;} }
  table.data-table{width:100%; border-collapse:collapse; font-size:12.5px; min-width:820px;}
  .data-table th{
    position:sticky; top:0; background:var(--surface); text-align:left; padding:9px 10px; color:var(--text-muted);
    font-weight:700; border-bottom:1px solid var(--border); cursor:pointer; white-space:nowrap; user-select:none;
  }
  .data-table th .arrow{opacity:.6; margin-left:3px;}
  .data-table td{padding:9px 10px; border-bottom:1px solid var(--border); white-space:nowrap; color:var(--text);}
  .data-table td.desc{white-space:normal; max-width:260px; overflow:hidden; text-overflow:ellipsis;}
  .data-table tbody tr{cursor:pointer;}
  .data-table tbody tr:hover td{background:var(--surface-2);}
  .table-pager{display:flex; align-items:center; justify-content:center; gap:12px; padding:14px 0 4px;}
  .table-pager button{background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:700; font-size:12.5px;}
  .table-pager button:disabled{opacity:.4; cursor:default;}
  .table-pager span{font-size:12.5px; color:var(--text-muted);}

  .pill{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; display:inline-block; white-space:nowrap;}
  .pill.open{background:rgba(225,82,82,.15); color:var(--red);}
  .pill.closed{background:rgba(76,139,90,.15); color:var(--green);}
  .pill.neutral{background:var(--surface-2); color:var(--text-muted);}

  /* ---------- Sheet (filtros / admin) ---------- */
  .overlay{position:fixed; inset:0; background:rgba(20,23,26,.5); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s;}
  .overlay.show{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41; background:var(--surface);
    border-radius:20px 20px 0 0; max-height:86vh; display:flex; flex-direction:column;
    transform:translateY(100%); transition:transform .25s ease; box-shadow:0 -8px 30px rgba(0,0,0,.3);
  }
  .sheet.show{transform:translateY(0);}
  @media (min-width:720px){
    .sheet{ left:50%; right:auto; bottom:auto; top:50%; width:560px; max-width:92vw;
      transform:translate(-50%,-46%) scale(.96); opacity:0; border-radius:18px; max-height:82vh;}
    .sheet.show{transform:translate(-50%,-50%) scale(1); opacity:1;}
  }
  .sheet-handle{width:38px; height:4px; background:var(--border); border-radius:3px; margin:10px auto 4px; flex:none;}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; padding:8px 18px 12px; border-bottom:1px solid var(--border); flex:none;}
  .sheet-head h3{margin:0; font-size:16px;}
  .sheet-head button{background:none; border:none; font-size:13px; font-weight:700; color:var(--accent); cursor:pointer;}
  .sheet-body{overflow-y:auto; padding:6px 18px 10px; flex:1;}
  .filter-group{margin:14px 0;}
  .filter-group h4{margin:0 0 8px; font-size:12.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted);}
  .filter-group .opts{display:flex; flex-wrap:wrap; gap:7px;}
  .opt-chip{padding:7px 12px; border-radius:18px; border:1px solid var(--border); background:var(--surface);
    color:var(--text); font-size:12.5px; font-weight:600; cursor:pointer;}
  .opt-chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .date-range{display:flex; gap:8px;}
  .date-range input[type=date]{flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:13px;}
  .sheet-foot{padding:12px 18px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--border); flex:none;}
  .btn-primary{width:100%; padding:13px; border-radius:12px; border:none; background:var(--accent); color:var(--accent-ink); font-size:14.5px; font-weight:700; cursor:pointer;}
  .btn-primary:disabled{opacity:.5; cursor:default;}

  .admin-p{font-size:13px; color:var(--text-muted); line-height:1.5; margin:0 0 14px;}
  .admin-input{
    width:100%; padding:12px 14px; border-radius:11px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:15px; margin-bottom:12px;
  }
  .admin-error{background:rgba(225,82,82,.12); color:var(--red); border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:12px;}
  .admin-ok{background:rgba(76,139,90,.12); color:var(--green); border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:12px;}
  .admin-file{
    position:relative; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px;
    border:1.5px dashed var(--border); border-radius:12px; padding:28px 16px; text-align:center;
    color:var(--text-muted); font-size:13px; cursor:pointer; margin-bottom:14px;
  }
  .admin-file input[type="file"]{
    position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer;
  }
  .admin-file b{color:var(--text); font-size:14px;}
  .diff-summary{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px;}
  .diff-stat{background:var(--surface-2); border-radius:11px; padding:12px 8px; text-align:center;}
  .diff-stat .n{font-size:20px; font-weight:800; color:var(--text);}
  .diff-stat .l{font-size:11px; color:var(--text-muted); margin-top:2px;}
  .diff-list{max-height:180px; overflow-y:auto; border:1px solid var(--border); border-radius:11px; padding:4px 12px; margin-bottom:14px;}
  .diff-list p{font-size:12.5px; padding:6px 0; border-bottom:1px solid var(--border); margin:0;}
  .diff-list p:last-child{border-bottom:none;}
  .admin-note{font-size:12px; color:var(--text-faint); line-height:1.5; margin:10px 0 4px;}
  .admin-spinner{text-align:center; padding:30px 0; color:var(--text-muted); font-size:13px;}
  #adminOverlay{z-index:60;}
  #adminPanel{z-index:61;}
  .admin-tabs{display:flex; gap:8px; margin-bottom:16px;}
  .admin-tab{flex:1; padding:9px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted); font-weight:700; font-size:12.5px; cursor:pointer; text-align:center;}
  .admin-tab.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  textarea.admin-input{resize:vertical; font-family:inherit;}

  /* ---------- Detail drawer ---------- */
  .detail{
    position:fixed; inset:0; z-index:50; background:var(--surface); display:flex; flex-direction:column;
    transform:translateX(100%); transition:transform .22s ease;
  }
  .detail.show{transform:translateX(0);}
  @media (min-width:720px){
    .detail{ inset:auto; left:50%; top:50%; width:640px; max-width:92vw; max-height:86vh;
      transform:translate(-50%,-46%) scale(.97); opacity:0; border-radius:18px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.4);}
    .detail.show{transform:translate(-50%,-50%) scale(1); opacity:1;}
  }
  .detail-head{position:relative; flex:none; padding:18px 18px 14px; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .detail-head-actions{display:flex; align-items:center; gap:8px; flex:none;}
  .detail-report-btn{
    background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent); border-radius:10px;
    padding:8px 12px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .detail-close{
    width:34px; height:34px; border-radius:50%; flex:none;
    background:var(--surface-2); color:var(--text); border:1px solid var(--border); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .detail-body{overflow-y:auto; padding:6px 18px calc(20px + env(safe-area-inset-bottom));}
  .detail-title{font-size:18px; font-weight:800; margin:0 0 4px;}
  .detail-sub{color:var(--text-muted); font-size:13px; margin:0;}
  .spec-group-title{padding:16px 0 8px; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted); font-weight:700;}
  .spec-table{width:100%; border-collapse:collapse;}
  .spec-table tr{border-bottom:1px solid var(--border);}
  .spec-table tr:last-child{border-bottom:none;}
  .spec-table td{padding:9px 0; font-size:13px; vertical-align:top;}
  .spec-table td:first-child{color:var(--text-muted); width:46%; font-weight:600;}
  .spec-table td:last-child{color:var(--text); text-align:right; font-weight:600;}

  .app-footer{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    padding:22px 14px calc(26px + env(safe-area-inset-bottom)); opacity:.85;
  }
  .app-footer span{font-size:12px; color:var(--text-muted);}
  .app-footer .appsart-logo{height:34px; width:auto; display:block;}

  .hidden{display:none !important;}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><div class="brand-logo">
      <span class="marca-sub">cerámica</span>
      <span class="marca-main">Alberdi<i class="dot"></i></span>
      <small>SAC · Reclamos</small>
    </div></div>
    <div class="topbar-actions">
      <button class="icon-btn" data-action="refresh" title="Recargar datos">⟳</button>
      <button class="icon-btn" data-action="open-admin" title="Nuevo reclamo / datos">✚ Nuevo</button>
      <button class="icon-btn" data-action="open-filters">⚙ Filtros <span class="count hidden" id="filterCount">0</span></button>
    </div>
  </div>
  <div class="search-row">
    <span class="search-icon">🔎</span>
    <input id="search" placeholder="Buscar por N° de reclamo, cliente, artículo o causa…" autocomplete="off">
  </div>
  <div class="view-tabs" id="viewTabs">
    <button class="tab-chip active" data-view="dashboard">📊 Panel</button>
    <button class="tab-chip" data-view="table">📋 Listado</button>
  </div>
</header>

<div class="active-filters" id="activeFilters"></div>
<div class="result-count" id="resultCount"></div>

<main id="main">
  <div id="emptyState" class="empty-state hidden">
    <div class="big">📥</div>
    <p><b>Todavía no hay reclamos cargados.</b><br>Importá la planilla histórica o cargá el primer reclamo a mano.</p>
    <button class="btn-primary" data-action="open-admin">Cargar datos</button>
  </div>

  <div id="dashboardView">
    <div class="kpi-grid" id="kpiGrid"></div>
    <div class="dash-controls" id="dashControls"></div>
    <div class="chart-grid" id="chartGrid"></div>
  </div>

  <div id="tableView" class="hidden">
    <div class="table-toolbar">
      <span></span>
      <div style="display:flex; gap:8px;">
        <button class="btn-ghost" data-action="export-csv">⬇ CSV</button>
        <button class="btn-ghost" data-action="export-xlsx">⬇ Excel</button>
      </div>
    </div>
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr id="tableHead"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="table-pager" id="tablePager"></div>
  </div>
</main>

<footer class="app-footer">
  <span>App desarrollada por</span>
  <img src="./appsart-brand.png" alt="AppsArt" class="appsart-logo">
</footer>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="filterSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h3>Filtros</h3>
    <button data-action="reset-filters">Limpiar todo</button>
  </div>
  <div class="sheet-body" id="filterBody"></div>
  <div class="sheet-foot">
    <button class="btn-primary" data-action="apply-filters">Ver resultados</button>
  </div>
</div>

<div class="detail" id="detail">
  <div class="detail-head">
    <div>
      <h2 class="detail-title" id="detailTitle"></h2>
      <p class="detail-sub" id="detailSub"></p>
    </div>
    <div class="detail-head-actions">
      <button class="detail-report-btn" data-action="open-edit-reclamo">✎ Editar</button>
      <button class="detail-report-btn" data-action="open-informe">🖨 Informe</button>
      <button class="detail-close" data-action="close-detail">✕</button>
    </div>
  </div>
  <div class="detail-body" id="detailBody"></div>
</div>

<div class="overlay" id="adminOverlay"></div>
<div class="sheet" id="adminPanel">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h3>Actualizar datos</h3>
    <button data-action="close-admin">Cerrar</button>
  </div>
  <div class="sheet-body" id="adminBody"></div>
</div>

<script>
'use strict';

/* ===================== Config ===================== */

const firebaseConfig = {
  apiKey: "AIzaSyBbyTSnTekMkXOZOAZEV0SQzk46NqkyaSA",
  authDomain: "de-r-13.firebaseapp.com",
  projectId: "de-r-13",
  storageBucket: "de-r-13.firebasestorage.app",
  messagingSenderId: "79165446593",
  appId: "1:79165446593:web:19719e556144c227833740"
};
const COLLECTION = 'reclamos_sac';
const ADMIN_EMAIL = 'admin@catalogo-alberdi.app';

let db = null, auth = null;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  auth = firebase.auth();
} catch (e) { console.warn('Firebase no disponible.', e); }

/* ===================== Datos: mapeo de columnas ===================== */

const XLSX_KEY_MAP = {
  NRORECLAMO:'nroReclamo', ARTICULO:'articulo', NOMBRE:'nombre', MARCA:'marca', HORNO:'horno',
  TONO:'tono', CALIBRE:'calibre', METROS:'metros', CAUSA:'causa', FECHADEPROD:'fechaProd',

/* ===================== Helpers de parseo ===================== */

function stripAccents(s){ return String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function normHeaderKey(h){ return stripAccents(h).toUpperCase().replace(/[^A-Z0-9]/g,''); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function parseNumber(v){
  if (typeof v === 'number') return v;
  if (v == null) return 0;
  let s = String(v).trim();
  if (!s) return 0;
  s = s.replace(/[^0-9,.\-]/g, '');
  if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
  else if (s.includes(',')) s = s.replace(',', '.');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function parseDateVal(v){
  if (v instanceof Date) return isNaN(v) ? null : v;
  if (typeof v === 'number' && v > 0) {
    const epoch = Date.UTC(1899, 11, 30);
    return new Date(epoch + v * 86400000);
  }
  if (typeof v === 'string') {
    const s = v.trim();
    if (!s) return null;
    let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
    if (m) {
      let [, d, mo, y] = m;
      if (y.length === 2) y = '20' + y;
      const dt = new Date(+y, +mo - 1, +d);
      if (!isNaN(dt)) return dt;
    }
    const dt2 = new Date(s);
    if (!isNaN(dt2)) return dt2;
  }
  return null;
}
function fmtMoney(n){ return (n||0).toLocaleString('es-AR', { style:'currency', currency:'ARS', maximumFractionDigits:0 }); }
function fmtNum(n, dec){ return (n||0).toLocaleString('es-AR', { maximumFractionDigits: dec ?? 1 }); }
function fmtDate(d){ return d ? d.toLocaleDateString('es-AR') : '—'; }
function monthKey(d){ return d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}` : null; }
function monthLabel(k){ const [y,m] = k.split('-'); return `${MONTH_NAMES[+m-1]} '${y.slice(2)}`; }
function quarterKey(d){ return d ? `${d.getFullYear()}-T${Math.floor(d.getMonth()/3)+1}` : null; }
function quarterLabel(k){ const [y,q] = k.split('-'); return `${q} '${y.slice(2)}`; }
function yearKey(d){ return d ? String(d.getFullYear()) : null; }
function yearLabel(k){ return k; }
function periodKey(d, g){ if (g==='month') return monthKey(d); if (g==='quarter') return quarterKey(d); return yearKey(d); }
function periodLabel(k, g){ if (g==='month') return monthLabel(k); if (g==='quarter') return quarterLabel(k); return yearLabel(k); }
function isClosed(finalizado){
  const v = stripAccents(String(finalizado||'')).toUpperCase().trim();
  return v === 'SI' || v === 'S' || v === 'YES' || v === '1' || v === 'TRUE';
}

/* ===================== Estado ===================== */

const state = {

  search: '',

  dateFrom: '', dateTo: '',
  filters: {}, pendingFilters: {},
  sortKey: 'fechaReclamo', sortDir: 'desc',

/* ===================== Carga de datos ===================== */

async function loadData(){
  if (!db) return [];
  const snap = await db.collection(COLLECTION).get();
  return snap.docs.map(d => {
    const data = d.data();
    DATE_FIELDS.forEach(f => { if (data[f] && data[f].toDate) data[f] = data[f].toDate(); });
    return data;
  });
}

async function init(){
  try { ALL = await loadData(); }
  catch (e) { console.error(e); ALL = []; }
  renderFilterSheetOptions();
  renderAll();
}

/* ===================== Filtros ===================== */

function applyFilters(rows){
  let out = rows;
  const q = state.search.trim().toLowerCase();
  if (q) {
    out = out.filter(r => [r.nroReclamo, r.nombreCliente, r.nombreUsuario, r.articulo, r.nombre, r.causa]
      .some(v => String(v||'').toLowerCase().includes(q)));
  }
  FILTERABLE.forEach(f => {
    const set = state.filters[f.key];
    if (set.size) out = out.filter(r => set.has(String(r[f.key]||'—').trim() || '—'));
  });
  if (state.dateFrom) { const from = new Date(state.dateFrom); out = out.filter(r => r.fechaReclamo && r.fechaReclamo >= from); }
  if (state.dateTo) { const to = new Date(state.dateTo); to.setHours(23,59,59,999); out = out.filter(r => r.fechaReclamo && r.fechaReclamo <= to); }
  return out;
}

function getFiltered(){ return applyFilters(ALL); }

function distinctValues(key){
  const set = new Set();
  ALL.forEach(r => set.add(String(r[key]||'—').trim() || '—'));
  return [...set].sort((a,b) => a.localeCompare(b, 'es'));
}

function renderFilterSheetOptions(){

    + `<button class="clear-all" data-action="reset-filters">Limpiar</button>`;

/* ===================== Agregaciones ===================== */

function groupCount(rows, key){
  const m = {};
  rows.forEach(r => { const k = String(r[key]||'—').trim() || '—'; m[k] = (m[k]||0) + 1; });
  return m;
}
function groupSum(rows, key, valKey){
  const m = {};
  rows.forEach(r => { const k = String(r[key]||'—').trim() || '—'; m[k] = (m[k]||0) + (r[valKey]||0); });
  return m;
}
function topN(map, n){ return Object.entries(map).sort((a,b) => b[1]-a[1]).slice(0, n); }
function avgDays(rows, fromKey, toKey){
  const diffs = [];
  rows.forEach(r => {
    if (r[fromKey] instanceof Date && r[toKey] instanceof Date) {
      const d = (r[toKey] - r[fromKey]) / 86400000;
      if (d >= 0 && d < 3650) diffs.push(d);
    }
  });
  if (!diffs.length) return null;
  return diffs.reduce((a,b) => a+b, 0) / diffs.length;
}

function buildTimeSeries(rows, dateField, granularity){
  const count = {}, cost = {};
  rows.forEach(r => {
    const k = periodKey(r[dateField], granularity);
    if (!k) return;
    count[k] = (count[k]||0) + 1;
    cost[k] = (cost[k]||0) + (r.totalGastos||0);
  });
  const periods = Object.keys(count).sort();
  return { periods, count, cost };
}

// Compara el mismo mes/trimestre a través de distintos años (interanual).
function buildYoY(rows, dateField, granularity){
  const subCount = {};
  const years = new Set();
  rows.forEach(r => {
    const d = r[dateField];
    if (!(d instanceof Date)) return;
    const year = d.getFullYear();
    const sub = granularity === 'quarter' ? Math.floor(d.getMonth()/3) : d.getMonth();
    years.add(year);
    subCount[year] = subCount[year] || {};
    subCount[year][sub] = (subCount[year][sub]||0) + 1;
  });
  const subLabels = granularity === 'quarter' ? ['T1','T2','T3','T4'] : MONTH_NAMES;
  return { subLabels, years: [...years].sort(), subCount };
}

function computeStats(rows){
  const s = {};
  s.total = rows.length;
  s.totalMetros = rows.reduce((a,r) => a + (r.metros||0), 0);
  const costFields = ['manoDeObra','materialesPropios','materialesDeTerceros','viaticos','fletes'];
  s.costBreakdown = {};
  costFields.forEach(f => s.costBreakdown[f] = rows.reduce((a,r) => a + (r[f]||0), 0));
  const sumComponents = Object.values(s.costBreakdown).reduce((a,b) => a+b, 0);
  const sumTotalGastos = rows.reduce((a,r) => a + (r.totalGastos||0), 0);
  s.totalCosto = Math.max(sumComponents, sumTotalGastos);
  s.costoPromedio = s.total ? s.totalCosto / s.total : 0;

  s.estadoCounts = groupCount(rows, 'finalizado');
  s.abiertos = rows.filter(r => !isClosed(r.finalizado)).length;
  s.cerrados = s.total - s.abiertos;

  s.porCausaCount = topN(groupCount(rows, 'causa'), 8);
  s.porCausaCosto = topN(groupSum(rows, 'causa', 'totalGastos'), 8);
  s.porLinea = topN(groupCount(rows, 'lineaProd'), 10);
  s.porHorno = topN(groupCount(rows, 'horno'), 10);
  s.porTurno = topN(groupCount(rows, 'turno'), 8);
  s.porMarca = topN(groupCount(rows, 'marca'), 8);
  s.porProvincia = topN(groupCount(rows, 'provincia'), 8);
  s.porInspector = topN(groupCount(rows, 'inspector'), 8);
  s.origenCounts = groupCount(rows, 'esDeUnUsuario');

  s.trend = buildTimeSeries(rows, state.dateBasis, state.granularity);
  s.yoy = state.granularity !== 'year' ? buildYoY(rows, state.dateBasis, state.granularity) : null;

  s.lagProdReclamo = avgDays(rows, 'fechaProd', 'fechaReclamo');
  s.lagColocReclamo = avgDays(rows, 'fechaColocacion', 'fechaReclamo');

  const now = new Date();
  const buckets = { '< 7 días':0, '7-30 días':0, '30-90 días':0, '> 90 días':0 };
  rows.forEach(r => {
    if (isClosed(r.finalizado) || !(r.fechaReclamo instanceof Date)) return;
    const d = (now - r.fechaReclamo) / 86400000;
    if (d < 7) buckets['< 7 días']++;
    else if (d < 30) buckets['7-30 días']++;
    else if (d < 90) buckets['30-90 días']++;
    else buckets['> 90 días']++;
  });
  s.aging = buckets;

  return s;
}

const TABLE_COLS = [
  { key:'nroReclamo', label:'N°' },
  { key:'fechaReclamo', label:'Fecha' },
  { key:'clienteDisplay', label:'Cliente / usuario', sortKey:'nombreCliente' },
  { key:'productoDisplay', label:'Artículo', sortKey:'articulo' },
  { key:'causa', label:'Causa' },
  { key:'metros', label:'m²' },
  { key:'totalGastos', label:'Costo' },
  { key:'finalizado', label:'Estado' }
];

function rowValue(r, key){
  if (key === 'clienteDisplay') return r.nombreCliente || r.nombreUsuario || '—';
  if (key === 'productoDisplay') return [r.articulo, r.nombre].filter(Boolean).join(' · ') || '—';
  return r[key];
}

function renderTableView(rows){
  const sorted = [...rows].sort((a,b) => {
    const ka = state.sortKey, kb = state.sortKey;
    let va = rowValue(a, ka), vb = rowValue(b, kb);
    if (va instanceof Date || vb instanceof Date) { va = va ? +va : 0; vb = vb ? +vb : 0; }
    else if (typeof va === 'number' || typeof vb === 'number') { va = va||0; vb = vb||0; }
    else { va = String(va||'').toLowerCase(); vb = String(vb||'').toLowerCase(); }
    const cmp = va < vb ? -1 : va > vb ? 1 : 0;
    return state.sortDir === 'asc' ? cmp : -cmp;
  });
  const totalPages = Math.max(1, Math.ceil(sorted.length / state.pageSize));
  state.page = Math.min(state.page, totalPages);
  const pageRows = sorted.slice((state.page-1)*state.pageSize, state.page*state.pageSize);

  document.getElementById('tableHead').innerHTML = TABLE_COLS.map(c => {
    const active = state.sortKey === (c.sortKey||c.key);
    const arrow = active ? (state.sortDir==='asc'?'▲':'▼') : '';
    return `<th data-sort="${c.sortKey||c.key}">${esc(c.label)} <span class="arrow">${arrow}</span></th>`;
  }).join('');

  document.getElementById('tableBody').innerHTML = pageRows.map(r => {
    const cells = TABLE_COLS.map(c => {
      let v = rowValue(r, c.key);
      if (c.key === 'fechaReclamo') v = fmtDate(v);
      else if (c.key === 'metros') v = fmtNum(v,1);
      else if (c.key === 'totalGastos') v = fmtMoney(v || Math.max(v||0, (r.manoDeObra||0)+(r.materialesPropios||0)+(r.materialesDeTerceros||0)+(r.viaticos||0)+(r.fletes||0)));
      else if (c.key === 'finalizado') v = `<span class="pill ${isClosed(r.finalizado) ? 'closed' : 'open'}">${isClosed(r.finalizado) ? 'Cerrado' : 'Abierto'}</span>`;
      else v = esc(v ?? '—');
      const cls = c.key === 'productoDisplay' ? 'desc' : '';
      return `<td class="${cls}">${v}</td>`;
    }).join('');
    return `<tr data-id="${esc(r.nroReclamo)}">${cells}</tr>`;
  }).join('') || `<tr><td colspan="${TABLE_COLS.length}" style="text-align:center;color:var(--text-faint);padding:30px;">Sin resultados.</td></tr>`;

  document.getElementById('tablePager').innerHTML = `
    <button data-page="prev" ${state.page<=1?'disabled':''}>‹ Anterior</button>
    <span>Página ${state.page} de ${totalPages} (${sorted.length} reclamos)</span>
    <button data-page="next" ${state.page>=totalPages?'disabled':''}>Siguiente ›</button>
  `;
}

function rowsForExport(rows){
  const cols = Object.keys(FIELD_LABELS);
  return rows.map(r => {
    const obj = {};
    cols.forEach(c => {
      let v = r[c];
      if (v instanceof Date) v = fmtDate(v);
      obj[FIELD_LABELS[c]] = v ?? '';
    });
    return obj;
  });
}

function exportCsv(rows){
  const cols = Object.keys(FIELD_LABELS);
  const lines = [cols.map(c => FIELD_LABELS[c]).join(';')];
  rows.forEach(r => {
    lines.push(cols.map(c => {
      let v = r[c];
      if (v instanceof Date) v = fmtDate(v);
      return `"${String(v ?? '').replace(/"/g,'""')}"`;
    }).join(';'));
  });
  const blob = new Blob(['﻿' + lines.join('\n')], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'reclamos_alberdi.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

function exportXlsx(rows){
  const ws = XLSX.utils.json_to_sheet(rowsForExport(rows));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Reclamos');
  XLSX.writeFile(wb, 'reclamos_alberdi.xlsx');
}

function parseDateInputVal(v){
  if (!v) return null;
  const [y, m, d] = v.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function dateToInputVal(d){
  if (!(d instanceof Date) || isNaN(d)) return '';
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function fieldInputHtml(f, value){
  const id = 'nr_' + f.key;
  const val = f.type === 'date' ? dateToInputVal(value) : (value ?? '');
  let input;
  if (f.type === 'sino') input = `<select class="admin-input" id="${id}"><option value="NO" ${val==='NO'?'selected':''}>No</option><option value="SI" ${val==='SI'?'selected':''}>Sí</option></select>`;
  else if (f.type === 'textarea') input = `<textarea class="admin-input" id="${id}" rows="2">${esc(val)}</textarea>`;
  else input = `<input class="admin-input" id="${id}" type="${f.type==='number'?'number':f.type==='date'?'date':'text'}" ${f.type==='number'?'step="0.01"':''} value="${esc(val)}">`;
  return `<div class="filter-group"><h4>${esc(f.label)}</h4>${input}</div>`;
}

  const obj = { fechaReclamo: parseDateInputVal(document.getElementById('nr_fechaReclamo').value) };
  NEW_FORM_GROUPS.forEach(g => g.fields.forEach(f => {
    const el = document.getElementById('nr_' + f.key);

    if (f.type === 'number') obj[f.key] = parseNumber(raw);
    else if (f.type === 'date') obj[f.key] = parseDateInputVal(raw);
    else obj[f.key] = raw.trim();
  }));
  return obj;
}

async function getNextNroReclamo(){
  const ref = db.collection('reclamos_sac_meta').doc('counter');
  return db.runTransaction(async tx => {
    const snap = await tx.get(ref);
    const last = snap.exists ? (snap.data().last || 0) : 0;
    const next = last + 1;
    tx.set(ref, { last: next }, { merge:true });
    return next;
  });
}

    admin.diff = buildDiff(rows, ALL);
    renderAdmin();
  } catch (e) {
    console.error(e);
    statusEl.innerHTML = `<p class="admin-error">${esc(e.message || 'No pude leer el archivo.')}</p>`;
  }
}

function parseWorkbook(buf){
  const wb = XLSX.read(buf, { type:'array', cellDates:true });
  const sheetName = wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header:1, defval:'', blankrows:false, raw:true });
  const headerRowIdx = rows.findIndex(r => r.some(c => normHeaderKey(c) === 'NRORECLAMO'));
  if (headerRowIdx === -1) throw new Error('No encontré la columna "NroReclamo" en la primera hoja ("' + sheetName + '"). Revisá que sea la hoja correcta.');
  const headers = rows[headerRowIdx].map(normHeaderKey);
  const dataRows = rows.slice(headerRowIdx + 1);
  const records = [];
  for (const r of dataRows) {
    const obj = {};
    let hasData = false;
    headers.forEach((hk, i) => {
      const key = XLSX_KEY_MAP[hk];
      if (!key) return;
      let raw = r[i];
      if (raw === undefined) raw = '';
      if (raw !== '') hasData = true;
      if (NUMERIC_FIELDS.includes(key)) obj[key] = parseNumber(raw);
      else if (DATE_FIELDS.includes(key)) obj[key] = parseDateVal(raw);
      else obj[key] = String(raw).trim();
    });
    if (hasData && obj.nroReclamo) records.push(obj);
  }
  if (!records.length) throw new Error('No encontré filas de reclamos con datos debajo del encabezado.');
  return records;
}

function buildDiff(rows, existing){
  const byId = new Map(existing.map(r => [String(r.nroReclamo), r]));
  const nuevos = [], actualizados = [], sinCambios = [];
  for (const row of rows) {
    const match = byId.get(String(row.nroReclamo));
    if (!match) { nuevos.push(row); continue; }
    const changed = XLSX_FIELDS.some(f => {
      const a = row[f], b = match[f];
      if (a instanceof Date || b instanceof Date) return +(a||0) !== +(b||0);
      return String(a ?? '') !== String(b ?? '');
    });
    (changed ? actualizados : sinCambios).push(row);
  }
  return { nuevos, actualizados, sinCambios };
}

function renderAdminPreview(){
  const d = admin.diff;
  const listHtml = items => items.length
    ? items.slice(0, 60).map(r => `<p>N° ${esc(r.nroReclamo)}${r.causa ? ' · ' + esc(r.causa) : ''}</p>`).join('') + (items.length > 60 ? `<p class="admin-note">+${items.length-60} más</p>` : '')
    : `<p class="admin-note">Ninguno.</p>`;
  document.getElementById('adminBody').innerHTML = `
    <div class="diff-summary">
      <div class="diff-stat"><div class="n">${d.nuevos.length}</div><div class="l">Nuevos</div></div>
      <div class="diff-stat"><div class="n">${d.actualizados.length}</div><div class="l">Modificados</div></div>
      <div class="diff-stat"><div class="n">${d.sinCambios.length}</div><div class="l">Sin cambios</div></div>
    </div>
    <h4 style="font-size:12.5px; text-transform:uppercase; color:var(--text-muted); margin:16px 0 8px;">Nuevos (${d.nuevos.length})</h4>
    <div class="diff-list">${listHtml(d.nuevos)}</div>
    <h4 style="font-size:12.5px; text-transform:uppercase; color:var(--text-muted); margin:16px 0 8px;">Modificados (${d.actualizados.length})</h4>
    <div class="diff-list">${listHtml(d.actualizados)}</div>
    <div id="adminConfirmStatus"></div>
    <button class="btn-primary" data-action="cancel-diff" style="background:var(--surface-2); color:var(--text); margin-bottom:10px;">Cancelar</button>
    <button class="btn-primary" data-action="confirm-update" ${(d.nuevos.length + d.actualizados.length)===0 ? 'disabled' : ''}>Confirmar actualización</button>
  `;
}

async function confirmUpdate(){
  const d = admin.diff;
  const statusEl = document.getElementById('adminConfirmStatus');
  const btn = document.querySelector('[data-action="confirm-update"]');
  btn.disabled = true;
  const toWrite = [...d.nuevos, ...d.actualizados];
  const CHUNK = 400;
  try {
    for (let i = 0; i < toWrite.length; i += CHUNK) {
      const batch = db.batch();
      toWrite.slice(i, i + CHUNK).forEach(r => {
        const docId = String(r.nroReclamo).replace(/[\/\s]+/g, '-');
        batch.set(db.collection(COLLECTION).doc(docId), r);
      });
      await batch.commit();
      statusEl.innerHTML = `<p class="admin-note">Subidos ${Math.min(i+CHUNK, toWrite.length)} / ${toWrite.length}…</p>`;
    }
    const maxNro = Math.max(0, ...toWrite.map(r => parseInt(r.nroReclamo, 10) || 0), ...ALL.map(r => parseInt(r.nroReclamo, 10) || 0));
    const counterRef = db.collection('reclamos_sac_meta').doc('counter');
    await db.runTransaction(async tx => {
      const snap = await tx.get(counterRef);
      const cur = snap.exists ? (snap.data().last || 0) : 0;
      if (maxNro > cur) tx.set(counterRef, { last: maxNro }, { merge:true });
    });
    ALL = await loadData();
    renderFilterSheetOptions();
    document.getElementById('adminBody').innerHTML = `
      <p class="admin-p"><b>¡Listo!</b> Se actualizaron ${toWrite.length} reclamos (${d.nuevos.length} nuevos, ${d.actualizados.length} modificados). El panel ya se actualizó solo.</p>
      <button class="btn-primary" data-action="close-admin">Cerrar</button>
    `;
    renderAll();
  } catch (e) {
    console.error(e);
    statusEl.innerHTML = `<p class="admin-error">Hubo un error subiendo los cambios: ${esc(e.message)}</p>`;
    btn.disabled = false;
  }
}

/* ===================== Eventos ===================== */

function bindEvents(){
  document.getElementById('search').addEventListener('input', e => { state.search = e.target.value; state.page = 1; renderAll(); });

  document.getElementById('viewTabs').addEventListener('click', e => {
    const btn = e.target.closest('[data-view]');
    if (!btn) return;
    state.view = btn.dataset.view;
    document.querySelectorAll('#viewTabs .tab-chip').forEach(b => b.classList.toggle('active', b===btn));
    renderAll();
  });

  document.querySelector('[data-action="open-filters"]').addEventListener('click', openFilters);
  document.getElementById('overlay').addEventListener('click', closeFilters);
  document.querySelector('[data-action="apply-filters"]').addEventListener('click', () => {
    FILTERABLE.forEach(f => state.filters[f.key] = new Set(state.pendingFilters[f.key]));
    state.dateFrom = document.getElementById('dateFrom').value;
    state.dateTo = document.getElementById('dateTo').value;
    state.page = 1;
    closeFilters();
    renderAll();
  });
  document.getElementById('filterBody').addEventListener('click', e => {
    const chip = e.target.closest('[data-fkey]');
    if (!chip) return;
    const set = state.pendingFilters[chip.dataset.fkey];
    if (set.has(chip.dataset.fval)) set.delete(chip.dataset.fval); else set.add(chip.dataset.fval);
    chip.classList.toggle('active');
  });
  document.body.addEventListener('click', e => {
    if (e.target.closest('[data-action="reset-filters"]')) {
      FILTERABLE.forEach(f => { state.filters[f.key] = new Set(); state.pendingFilters[f.key] = new Set(); });
      state.dateFrom = ''; state.dateTo = ''; state.page = 1;
      renderFilterSheetOptions();
      renderAll();
    }
    const rm = e.target.closest('[data-rm-key]');
    if (rm) { state.filters[rm.dataset.rmKey].delete(rm.dataset.rmVal); state.page = 1; renderAll(); }
    if (e.target.closest('[data-action="refresh"]')) init();
    if (e.target.closest('[data-action="export-csv"]')) exportCsv(getFiltered());
    if (e.target.closest('[data-action="export-xlsx"]')) exportXlsx(getFiltered());
    if (e.target.closest('[data-action="open-informe"]')) openInforme();
    if (e.target.closest('[data-action="open-edit-reclamo"]')) openEditReclamo();
  });

  document.getElementById('main').addEventListener('click', e => {
    const row = e.target.closest('#tableBody tr[data-id]');
    if (row) openDetail(row.dataset.id);
    const pageBtn = e.target.closest('[data-page]');
    if (pageBtn && !pageBtn.disabled) {
      state.page += pageBtn.dataset.page === 'next' ? 1 : -1;
      renderTableView(getFiltered());
    }
    const th = e.target.closest('#tableHead th');
    if (th) {
      const key = th.dataset.sort;
      if (state.sortKey === key) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      else { state.sortKey = key; state.sortDir = 'asc'; }
      renderTableView(getFiltered());
    }
    const metricBtn = e.target.closest('.chart-toggle button[data-metric]');
    if (metricBtn) { state.trendMetric = metricBtn.dataset.metric; renderDashboard(getFiltered()); }
    const basisBtn = e.target.closest('[data-basis]');
    if (basisBtn) { state.dateBasis = basisBtn.dataset.basis; renderDashboard(getFiltered()); }
    const granBtn = e.target.closest('[data-granularity]');
    if (granBtn) { state.granularity = granBtn.dataset.granularity; renderDashboard(getFiltered()); }
  });

  document.querySelector('[data-action="close-detail"]').addEventListener('click', closeDetail);

  document.querySelectorAll('[data-action="open-admin"]').forEach(b => b.addEventListener('click', () => { admin.diff = null; openAdmin(); }));
  document.getElementById('adminOverlay').addEventListener('click', closeAdmin);
  document.getElementById('adminBody').addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    if (action === 'do-login') doLogin();
    else if (action === 'close-admin') closeAdmin();
    else if (action === 'cancel-diff') { admin.diff = null; renderAdmin(); }
    else if (action === 'confirm-update') confirmUpdate();
    else if (action === 'save-new-reclamo') saveNewReclamo();
    else if (action === 'cancel-edit') { admin.editTarget = null; renderAdmin(); }
    else if (action === 'save-edit-reclamo') saveEditReclamo();
  });
  document.getElementById('adminBody').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'adminPin') doLogin();
  });
}

bindEvents();
init();
</script>
