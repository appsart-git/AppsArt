<style>
  :root{
    --bg:#14171A; --surface:#1D2126; --surface-2:#262B32; --surface-3:#2E343C;
    --border:#2E343C; --text:#ECEDEF; --text-muted:#8B92A0; --text-faint:#5C6470;
    --amber:#FA5C02; --amber-ink:#1A0D02; --green:#34B27B; --red:#E15252;
    --font-display: Oswald, 'Arial Narrow', sans-serif;
    --font-body: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    font-family:var(--font-body); -webkit-font-smoothing:antialiased;
  }
  ::placeholder{color:var(--text-faint);}
  ::selection{background:rgba(250,92,2,0.28); color:var(--text);}
  button{font-family:inherit;}
  a{color:inherit;}
  table{border-collapse:collapse; width:100%;}
  :focus-visible{outline:2px solid var(--amber); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

  .layout{display:flex; min-height:100vh;}
  .sidebar{
    width:222px; flex:none; border-right:1px solid var(--border);
    padding:22px 14px; display:flex; flex-direction:column; gap:4px;
    position:sticky; top:0; height:100vh;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:0 8px 22px;}
  .brand-mark{
    width:34px; height:34px; border-radius:7px; flex:none;
    background:linear-gradient(135deg,var(--amber),#B84402);
    display:flex; align-items:center; justify-content:center;
  }
  .brand-name{font-family:var(--font-display); font-size:16px; letter-spacing:0.03em; line-height:1;}
  .brand-sub{font-size:10px; color:var(--text-muted); letter-spacing:0.08em; text-transform:uppercase; margin-top:3px;}

  .nav-btn{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:7px;
    border:none; background:transparent; color:var(--text-muted); cursor:pointer;
    font-size:14px; font-weight:500; text-align:left; border-left:3px solid transparent;
    transition:background .15s, color .15s;
  }
  .nav-btn:hover{background:var(--surface-2); color:var(--text);}
  .nav-btn.active{background:var(--surface-2); color:var(--text); font-weight:600; border-left-color:var(--amber);}
  .sidebar-foot{margin-top:auto; padding:12px 8px 0; font-size:11px; color:var(--text-muted);}
  .saving-row{display:flex; align-items:center; gap:6px;}
  .saving-dot{width:6px; height:6px; border-radius:50%; display:inline-block;}
  .sidebar-foot .shared{margin-top:4px; opacity:.7;}
  .brand-footer{display:flex; align-items:center; gap:8px; margin-top:14px; padding-top:14px; border-top:1px solid var(--border); opacity:.65; transition:opacity .15s;}
  .brand-footer:hover{opacity:.95;}
  .brand-footer span{font-size:12px; color:var(--text-muted);}
  .brand-footer img{height:48px; width:auto; display:block;}

  .main{flex:1; padding:28px 34px; min-width:0;}
  .loading{padding:40px; color:var(--text-muted); font-family:var(--font-mono);}

  .icon-btn{background:none; border:none; color:var(--text-muted); cursor:pointer; padding:6px; border-radius:6px; display:inline-flex; align-items:center; justify-content:center; transition:background .15s,color .15s;}
  .icon-btn:hover{background:var(--surface-2); color:var(--text);}
  .btn-primary{background:var(--amber); color:var(--amber-ink); border:none; font-weight:700; border-radius:6px; padding:10px 16px; font-size:13.5px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; letter-spacing:.01em; transition:filter .15s;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent; color:var(--text); border:1px solid var(--border); border-radius:6px; padding:9px 15px; font-size:13.5px; cursor:pointer; display:inline-flex; align-items:center; gap:8px;}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-ghost.active{background:var(--surface-2); border-color:var(--amber); color:var(--text);}
  .btn-danger{background:transparent; color:var(--red); border:1px solid rgba(225,82,82,0.35); border-radius:6px; padding:9px 15px; font-size:13.5px; cursor:pointer; display:inline-flex; align-items:center; gap:8px;}
  .btn-danger:hover{background:rgba(225,82,82,0.1);}
  .row-hover:hover{background:var(--surface-2);}

  .page-header{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px; gap:14px; flex-wrap:wrap;}
  .page-title{font-family:var(--font-display); font-size:28px; margin:0; letter-spacing:0.01em; text-wrap:balance;}
  .page-desc{color:var(--text-muted); margin:6px 0 0; font-size:14px;}
  .section-title{font-family:var(--font-display); font-weight:600; font-size:15px; letter-spacing:0.03em; text-transform:uppercase; color:var(--text-muted); margin:0 0 12px;}

  .stat-row{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:28px;}
  .stat-card{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:18px; flex:1; min-width:190px;}
  .stat-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .stat-label{font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; font-weight:600;}
  .stat-value{font-family:var(--font-mono); font-size:25px; font-weight:700; font-variant-numeric:tabular-nums;}
  .stat-sub{font-size:12px; color:var(--text-muted); margin-top:4px;}
  .tone-amber{color:var(--amber);} .tone-green{color:var(--green);} .tone-red{color:var(--red);}

  .partner-row{display:flex; gap:12px; flex-wrap:wrap;}
  .partner-card{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 18px; min-width:170px;}
  .partner-head{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block; flex:none;}
  .partner-value{font-family:var(--font-mono); font-size:19px; font-weight:700; font-variant-numeric:tabular-nums;}

  .table-wrap{border:1px solid var(--border); border-radius:10px; overflow:hidden; overflow-x:auto;}
  th{text-align:left; padding:10px 14px; font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.04em; font-weight:600; background:var(--surface-2); white-space:nowrap;}
  td{padding:12px 14px; border-top:1px solid var(--border); font-size:13.5px; white-space:nowrap;}
  tr.clickable{cursor:pointer;}
  .veh-name{font-weight:600;}
  .veh-year{font-size:12px; color:var(--text-muted);}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}

  .plate{display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-weight:700; font-size:13px; letter-spacing:0.08em; background:linear-gradient(180deg,#f2f2f2,#dcdcdc); color:#15181b; border:2px solid #9a9a9a; border-radius:5px; padding:3px 10px; position:relative;}
  .plate::before,.plate::after{content:""; position:absolute; top:2px; width:3px; height:3px; border-radius:50%; background:#8a8a8a;}
  .plate::before{left:3px;} .plate::after{right:3px;}

  .badge{border-radius:4px; padding:3px 9px; font-size:11px; font-family:var(--font-mono); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; border:1px solid; display:inline-block;}
  .badge-stock{background:rgba(250,92,2,0.12); color:var(--amber); border-color:rgba(250,92,2,0.4);}
  .badge-vendido{background:rgba(52,178,123,0.12); color:var(--green); border-color:rgba(52,178,123,0.4);}

  .empty-state{border:1px dashed var(--border); border-radius:12px; padding:60px 30px; text-align:center; color:var(--text-muted);}
  .empty-icon{opacity:.6; margin-bottom:14px;}
  .empty-title{color:var(--text); font-weight:600; font-size:16px; margin-bottom:6px;}
  .empty-desc{font-size:13.5px; max-width:420px; margin:0 auto;}
  .empty-action{margin-top:18px;}

  .filters{display:flex; gap:8px; margin-bottom:16px;}

  .detail-back{margin-bottom:18px;}
  .detail-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:24px; flex-wrap:wrap; gap:14px;}
  .detail-title-row{display:flex; align-items:center; gap:12px; margin-bottom:8px; flex-wrap:wrap;}
  .detail-title{font-family:var(--font-display); font-size:26px; margin:0; text-wrap:balance;}
  .detail-meta{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .detail-meta-text{color:var(--text-muted); font-size:13px;}
  .detail-actions{display:flex; gap:8px; flex-wrap:wrap;}

  .veh-photo-banner-wrap{position:relative; width:100%; margin-bottom:20px;}
  .veh-photo-banner{width:100%; height:300px; object-fit:cover; border-radius:12px; border:1px solid var(--border); display:block; background:var(--surface-2);}
  .veh-photo-banner-empty{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--text-muted); height:200px; border:1px dashed var(--border); border-radius:12px;}
  .veh-photo-edit{position:absolute; bottom:14px; right:14px; width:38px; height:38px; border-radius:50%; background:var(--amber); color:var(--amber-ink); display:flex; align-items:center; justify-content:center; cursor:pointer; border:2px solid var(--bg); box-shadow:0 4px 14px rgba(0,0,0,0.4);}
  .veh-photo-edit:hover{filter:brightness(1.08);}
  .row-thumb{width:36px; height:36px; object-fit:cover; border-radius:6px; flex:none; background:var(--surface-2);}
  .row-thumb-empty{width:36px; height:36px; border-radius:6px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; flex:none; color:var(--text-muted);}
  .form-photo-drop{border:1px dashed var(--border); border-radius:8px; padding:14px; text-align:center; color:var(--text-muted); font-size:13px; margin-bottom:14px; cursor:pointer;}
  .form-photo-drop:hover{border-color:var(--amber); color:var(--text);}
  .form-photo-preview{margin-bottom:14px; display:none; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:8px;}
  .form-photo-preview-item{position:relative;}
  .form-photo-preview-item img{width:100%; height:80px; object-fit:cover; border-radius:8px; display:block; background:var(--surface-2);}
  .form-photo-preview-item button{position:absolute; top:3px; right:3px; background:rgba(20,23,26,0.75); color:#fff; width:20px; height:20px; border-radius:50%; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center;}

  .foto-thumbs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .foto-thumb-item{position:relative; width:64px; height:64px; flex:none;}
  .foto-thumb-item img{width:100%; height:100%; object-fit:cover; border-radius:8px; cursor:pointer; border:2px solid transparent; display:block;}
  .foto-thumb-item.is-main img{border-color:var(--amber);}
  .foto-thumb-del{position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%; background:var(--red); color:#fff; border:2px solid var(--bg); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;}
  .foto-thumb-add{width:64px; height:64px; flex:none; border:1px dashed var(--border); border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-muted);}
  .foto-thumb-add:hover{border-color:var(--amber); color:var(--text);}

  .split{display:grid; grid-template-columns:1.1fr 1fr; gap:24px; align-items:start;}
  @media (max-width: 860px){ .split{grid-template-columns:1fr;} }
  .list-box{border:1px solid var(--border); border-radius:10px; overflow:hidden;}
  .list-item{display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-top:1px solid var(--border);}
  .list-item:first-child{border-top:none;}
  .list-empty{padding:16px; color:var(--text-muted); font-size:13px;}
  .warn-line{display:flex; gap:6px; align-items:center; color:var(--amber); font-size:12.5px; margin-top:8px;}

  .gasto-form{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:14px;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;}
  .grid-2b{display:grid; grid-template-columns:1fr 1.4fr; gap:10px; margin-bottom:10px;}

  .field{display:block; margin-bottom:14px;}
  .field-label{display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px; font-weight:600; letter-spacing:0.03em;}
  .input, select.input{
    width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:6px;
    padding:9px 11px; color:var(--text); font-size:14px; font-family:var(--font-body); outline:none;
  }
  .input:focus{border-color:var(--amber);}

  .partners-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;}
  .partner-full{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:18px;}
  .partner-full-head{display:flex; justify-content:space-between; align-items:flex-start;}
  .avatar{width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); color:var(--amber-ink); font-weight:700; flex:none;}
  .partner-full-name{font-weight:600; font-size:15.5px;}
  .partner-full-label{font-size:12px; color:var(--text-muted); margin:12px 0 4px;}
  .partner-full-value{font-family:var(--font-mono); font-size:20px; font-weight:700; margin-bottom:8px; font-variant-numeric:tabular-nums;}
  .partner-full-sub{font-size:12.5px; color:var(--text-muted);}

  .pct-row{display:flex; align-items:center; justify-content:space-between; padding:9px 14px; border-top:1px solid var(--border);}
  .pct-row:first-child{border-top:none;}
  .pct-input{width:70px; text-align:right;}
  .pct-head{margin-top:6px; margin-bottom:4px; display:flex; justify-content:space-between; align-items:center;}
  .pct-label{font-size:12px; color:var(--text-muted); font-weight:600; letter-spacing:0.03em;}
  .pct-total{font-size:12px; font-family:var(--font-mono);}

  .modal-overlay{position:fixed; inset:0; background:rgba(8,10,12,0.72); backdrop-filter:blur(3px); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:50; overflow-y:auto;}
  .modal-box{background:var(--surface); border:1px solid var(--border); border-radius:10px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.5);}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border);}
  .modal-title{margin:0; font-family:var(--font-display); font-size:19px; letter-spacing:0.02em;}
  .modal-body{padding:20px;}

  .summary-line{background:var(--surface-2); border-radius:8px; padding:12px; font-size:13px; margin-bottom:6px; display:flex; justify-content:space-between;}
  .summary-line + .summary-line{margin-bottom:14px;}

  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}

  .amount-group{display:flex; gap:6px;}
  .amount-group .input{flex:1; min-width:0;}
  .amount-group select.input{flex:none; width:76px;}

  .fx-row{display:flex; align-items:center; gap:6px; margin-top:10px; font-size:11px; color:var(--text-muted);}
  .fx-row button{background:none; border:none; color:var(--text-muted); cursor:pointer; padding:2px; display:inline-flex; align-items:center;}
  .fx-row button:hover{color:var(--amber);}

  .specs-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;}
  .spec-item{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 12px;}
  .spec-label{font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:3px;}
  .spec-value{font-size:14px; font-weight:600;}

  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{background:var(--surface-2); border:1px solid var(--border); border-radius:20px; padding:5px 12px; font-size:12.5px; color:var(--text);}
  .chip-check{display:flex; align-items:center; gap:7px; padding:7px 10px; border-radius:6px; cursor:pointer; font-size:13px;}
  .chip-check:hover{background:var(--surface-2);}
  .chips-form{display:grid; grid-template-columns:1fr 1fr; gap:2px; border:1px solid var(--border); border-radius:8px; padding:6px; margin-bottom:14px;}

  .observaciones-box{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; font-size:13.5px; line-height:1.5; color:var(--text-muted); white-space:pre-wrap;}

  @media (max-width: 720px){
    .layout{flex-direction:column;}
    .sidebar{
      width:100%; height:auto; position:sticky; top:0; z-index:40;
      flex-direction:row; flex-wrap:wrap; align-items:center;
      padding:10px 12px; gap:8px; border-right:none; border-bottom:1px solid var(--border);
      background:var(--bg);
    }
    .brand{padding:0; gap:8px;}
    .brand-mark{width:28px; height:28px;}
    .brand-name{font-size:14px;}
    .brand-sub{display:none;}
    #nav{display:flex; flex-direction:row; gap:4px; margin-left:auto;}
    .nav-btn{padding:8px; border-left:none; border-bottom:2px solid transparent;}
    .nav-btn.active{border-left-color:transparent; border-bottom-color:var(--amber);}
    .nav-btn span{display:none;}
    .sidebar-foot{margin-top:0; padding:0; width:100%; order:3; display:flex; align-items:center; justify-content:space-between; gap:8px;}
    .sidebar-foot .shared{display:none;}
    .brand-footer{display:none;}
    .fx-row{margin-top:0; padding-top:0; border-top:none;}

    .main{padding:16px;}
    .page-title{font-size:22px;}
    .stat-row{flex-direction:column;}
    .stat-card{min-width:0;}
    .specs-grid{grid-template-columns:1fr;}
    .veh-photo-banner, .veh-photo-banner-empty{height:190px;}
    .grid-2{grid-template-columns:1fr;}
    .chips-form{grid-template-columns:1fr;}
    table{white-space:nowrap;}
    .grid-2b{grid-template-columns:1fr;}
    .detail-title{font-size:20px;}
    .detail-actions{width:100%;}
    .detail-actions button{flex:1 1 auto; justify-content:center;}
    .amount-group select.input{width:64px;}
  }

  @media (max-width: 420px){
    .stat-value{font-size:21px;}
    .partner-full-value{font-size:17px;}
  }
</style>
</head>

  // ---------- helpers ----------
  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
  function money(n){ var v = Number(n)||0; return "AR$ " + v.toLocaleString("es-AR", {maximumFractionDigits:0}); }
  function moneyFmt(n, moneda){
    var v = Number(n)||0;
    var prefix = moneda==="USD" ? "US$ " : "AR$ ";
    return prefix + v.toLocaleString("es-AR", {maximumFractionDigits:0});
  }
  function toARS(n, moneda){
    var v = Number(n)||0;
    if(moneda==="USD") return v * (state.tipoCambio || 1000);
    return v;
  }
  function fmtDate(d){
    if(!d) return "—";
    var dt = new Date(d+"T00:00:00");
    if(isNaN(dt)) return d;
    return dt.toLocaleDateString("es-AR", {day:"2-digit", month:"short", year:"numeric"});
  }
  function sumGastos(v){ return (v.gastos||[]).reduce(function(a,g){return a+toARS(g.monto, g.moneda);},0); }
  function costoTotal(v){ return toARS(v.precioCompra, v.precioCompraMoneda) + sumGastos(v); }
  function ganancia(v){ if(v.estado!==ESTADOS.VENDIDO) return null; return toARS(v.precioVenta, v.precioVentaMoneda) - costoTotal(v); }
  function pctSum(ps){ return (ps||[]).reduce(function(a,p){return a+(Number(p.porcentaje)||0);},0); }
  function fotosOf(v){ if(v.fotos && v.fotos.length) return v.fotos; if(v.foto) return [v.foto]; return []; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  function compressImage(file, maxDim, quality, cb){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, maxDim/Math.max(img.width, img.height));
        var cw = Math.max(1, Math.round(img.width*scale));
        var ch = Math.max(1, Math.round(img.height*scale));
        var canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        canvas.getContext("2d").drawImage(img, 0, 0, cw, ch);
        (function tryQuality(q){
          var dataUrl = canvas.toDataURL("image/jpeg", q);
          if(dataUrl.length > 700000 && q > 0.35) tryQuality(q-0.15);
          else cb(dataUrl);
        })(quality);
      };
      img.onerror = function(){ cb(null); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ cb(null); };
    reader.readAsDataURL(file);
  }

  // ---------- persistence (Firestore, tiempo real, compartido, por colección) ----------
  var sociosLoaded = false, vehiculosLoaded = false;

  function initRealtime(){
    sociosCol.orderBy("createdAt","asc").onSnapshot(function(snap){
      if(!state.data) state.data = { socios: [], vehiculos: [] };
      state.data.socios = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      sociosLoaded = true;
      onDataReady();
    }, onFirestoreError);

    vehiculosCol.orderBy("createdAt","desc").onSnapshot(function(snap){
      if(!state.data) state.data = { socios: [], vehiculos: [] };
      state.data.vehiculos = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      vehiculosLoaded = true;
      onDataReady();
    }, onFirestoreError);

    configDoc.onSnapshot(function(snap){
      var d = snap.data();
      if(d && d.arsPorUsd) state.tipoCambio = d.arsPorUsd;
      else if(snap.exists === false) configDoc.set({ arsPorUsd: state.tipoCambio });
      renderFxRow();
      if(state.data && !state.modal) render();
    });
  }
  function renderFxRow(){
    var el = document.getElementById("fxRow");
    if(!el) return;
    el.innerHTML = 'US$1 = AR$'+Math.round(state.tipoCambio).toLocaleString("es-AR")
      + '<button id="fxEdit" title="Editar tipo de cambio">'+icon("pencil",12)+'</button>';
    var btn = document.getElementById("fxEdit");
    if(btn) btn.addEventListener("click", function(){ state.modal = {type:"tipo-cambio"}; renderModal(); });
  }
  function setTipoCambio(v){
    var n = Number(v);
    if(!n || n<=0) return;
    configDoc.set({ arsPorUsd: n });
  }
  function onDataReady(){
    if(!sociosLoaded || !vehiculosLoaded) return;
    if(!state.modal) render(); else updateSavingIndicator();
  }
  function onFirestoreError(err){
    console.error("Firestore error", err);
    var main = document.getElementById("main");
    if(main) main.innerHTML = '<div class="loading">No se pudo conectar con la base de datos compartida.<br>Revisá tu conexión a internet o las reglas de Firestore.</div>';
  }

  function markSaving(){ state.saving = true; updateSavingIndicator(); }
  function doneSaving(){ state.saving = false; updateSavingIndicator(); }
  function saveError(e){ console.error("No se pudo guardar", e); state.saving = false; updateSavingIndicator(); }

  function updateSavingIndicator(){
    var dot = document.getElementById("savingDot");
    var txt = document.getElementById("savingText");
    if(!dot||!txt) return;
    dot.style.background = state.saving ? "var(--amber)" : "var(--green)";
    txt.textContent = state.saving ? "Guardando…" : "Sincronizado";
  }

  // ---------- mutations ----------
  function addSocio(nombre){
    markSaving();
    sociosCol.add({
      nombre: nombre,
      color: PALETTE_SOCIOS[state.data.socios.length % PALETTE_SOCIOS.length],
      createdAt: Date.now()
    }).then(doneSaving).catch(saveError);
  }
  function deleteSocio(id){
    markSaving();
    var batch = db.batch();
    batch.delete(sociosCol.doc(id));
    state.data.vehiculos.forEach(function(v){
      var parts = (v.participaciones||[]).filter(function(p){return p.socioId!==id;});
      if(parts.length !== (v.participaciones||[]).length){
        batch.update(vehiculosCol.doc(v.id), { participaciones: parts });
      }
    });
    batch.commit().then(doneSaving).catch(saveError);
  }
  function addVehiculo(v){
    markSaving();
    vehiculosCol.add({
      marca:v.marca, modelo:v.modelo, version:v.version||"", anio:v.anio, patente:v.patente,
      fechaCompra:v.fechaCompra, precioCompra:v.precioCompra, precioCompraMoneda:v.precioCompraMoneda||"ARS", vendedor:v.vendedor,
      estado: ESTADOS.STOCK, fechaVenta:"", precioVenta:"", precioVentaMoneda:"ARS", comprador:"",
      participaciones: v.participaciones, gastos: [], fotos: v.fotos || [],
      kilometraje: v.kilometraje||"", color: v.color||"", combustible: v.combustible||"", transmision: v.transmision||"",
      prestaciones: v.prestaciones||[], observaciones: v.observaciones||"",
      precioPublicado: v.precioPublicado||"", precioPublicadoMoneda: v.precioPublicadoMoneda||"ARS",
      createdAt: Date.now()
    }).then(doneSaving).catch(saveError);
  }
  function updateVehiculoFields(id, patch){
    markSaving();
    vehiculosCol.doc(id).update(patch).then(doneSaving).catch(saveError);
  }
  function deleteVehiculo(id){
    markSaving();
    vehiculosCol.doc(id).delete().then(doneSaving).catch(saveError);
    state.selectedVehiculo = null;
  }
  function addGasto(vehiculoId, gasto){
    var v = state.data.vehiculos.find(function(x){return x.id===vehiculoId;});
    var gastos = (v.gastos||[]).concat([Object.assign({ id: uid() }, gasto)]);
    updateVehiculoFields(vehiculoId, { gastos: gastos });
  }
  function deleteGasto(vehiculoId, gastoId){
    var v = state.data.vehiculos.find(function(x){return x.id===vehiculoId;});
    var gastos = (v.gastos||[]).filter(function(g){return g.id!==gastoId;});
    updateVehiculoFields(vehiculoId, { gastos: gastos });
  }
  function registrarVenta(vehiculoId, venta){
    updateVehiculoFields(vehiculoId, {
      estado: ESTADOS.VENDIDO, fechaVenta: venta.fechaVenta, precioVenta: venta.precioVenta,
      precioVentaMoneda: venta.precioVentaMoneda||"USD", comprador: venta.comprador
    });
  }
  function reabrirVenta(vehiculoId){
    updateVehiculoFields(vehiculoId, { estado: ESTADOS.STOCK });
  }
  function addFotosVehiculo(vehiculoId, dataUrls){
    if(state.saving) return;
    var v = state.data.vehiculos.find(function(x){return x.id===vehiculoId;});
    updateVehiculoFields(vehiculoId, { fotos: fotosOf(v).concat(dataUrls) });
  }
  function removeFotoVehiculo(vehiculoId, index){
    if(state.saving) return;
    var v = state.data.vehiculos.find(function(x){return x.id===vehiculoId;});
    var fotos = fotosOf(v).slice();
    fotos.splice(index,1);
    updateVehiculoFields(vehiculoId, { fotos: fotos });
  }
  function setFotoPrincipal(vehiculoId, index){
    if(state.saving) return;
    var v = state.data.vehiculos.find(function(x){return x.id===vehiculoId;});
    var fotos = fotosOf(v).slice();
    var picked = fotos.splice(index,1)[0];
    fotos.unshift(picked);
    updateVehiculoFields(vehiculoId, { fotos: fotos });
  }

  // ---------- render: shell ----------
  function renderNav(){
    var items = [
      {id:"dashboard", label:"Panel", ic:"gauge"},
      {id:"vehiculos", label:"Vehículos", ic:"car"},
      {id:"socios", label:"Socios", ic:"users"}
    ];
    var nav = document.getElementById("nav");
    nav.innerHTML = items.map(function(n){
      var active = state.tab===n.id;
      return '<button class="nav-btn'+(active?" active":"")+'" data-nav="'+n.id+'">'+icon(n.ic,17)+'<span>'+n.label+'</span></button>';
    }).join("");
    nav.querySelectorAll("[data-nav]").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.tab = btn.getAttribute("data-nav");
        if(state.tab!=="vehiculos") state.selectedVehiculo = null;
        render();
      });
    });
  }

  function render(){
    document.getElementById("icon-car-brand").innerHTML = icon("car", 19, "#1A0D02");
    renderNav();
    updateSavingIndicator();
    renderFxRow();
    var main = document.getElementById("main");
    if(!state.data){
      main.innerHTML = '<div class="loading">Cargando datos…</div>';
      renderModal();
      return;
    }
    if(state.tab==="dashboard") main.innerHTML = dashboardHTML();
    else if(state.tab==="vehiculos") main.innerHTML = state.selectedVehiculo ? detalleVehiculoHTML() : listaVehiculosHTML();
    else if(state.tab==="socios") main.innerHTML = listaSociosHTML();
    attachContentEvents();
    renderModal();
  }

  // ---------- dashboard ----------
  function dashboardHTML(){
    var d = state.data, socios = d.socios, vehiculos = d.vehiculos;
    if(vehiculos.length===0){
      return emptyState("Todavía no hay vehículos cargados", "Agregá el primer auto desde la sección Vehículos para empezar a llevar el control de compras, gastos y ventas.");
    }
    var stock = vehiculos.filter(function(v){return v.estado===ESTADOS.STOCK;});
    var vendidos = vehiculos.filter(function(v){return v.estado===ESTADOS.VENDIDO;});
    var invertido = stock.reduce(function(a,v){return a+costoTotal(v);},0);
    var gananciaTotal = vendidos.reduce(function(a,v){return a+(ganancia(v)||0);},0);
    var gastosTotales = vehiculos.reduce(function(a,v){return a+sumGastos(v);},0);

    var gananciaPorSocio = {};
    socios.forEach(function(s){ gananciaPorSocio[s.id]=0; });
    vendidos.forEach(function(v){
      var g = ganancia(v)||0;
      (v.participaciones||[]).forEach(function(p){
        if(gananciaPorSocio[p.socioId]===undefined) return;
        gananciaPorSocio[p.socioId] += g * ((Number(p.porcentaje)||0)/100);
      });
    });

    var html = pageHeader("Panel general", "Estado actual de la flota y resultado acumulado de la sociedad.");
    html += '<div class="stat-row">'
      + statCard("car","En stock", stock.length, "amber", money(invertido)+" invertidos")
      + statCard("check","Vendidos", vendidos.length, "green")
      + statCard(gananciaTotal>=0?"trendUp":"trendDown","Ganancia acumulada", money(gananciaTotal), gananciaTotal>=0?"green":"red")
      + statCard("wrench","Gastos totales", money(gastosTotales), "red", "reparaciones, limpieza y otros")
      + '</div>';

    if(socios.length>0){
      html += '<div style="margin-bottom:28px">';
      html += '<h3 class="section-title">Ganancia por socio</h3>';
      html += '<div class="partner-row">';
      html += socios.map(function(s){
        var g = gananciaPorSocio[s.id]||0;
        return '<div class="partner-card"><div class="partner-head"><span class="dot" style="background:'+s.color+'"></span><span style="font-weight:600;font-size:14px">'+esc(s.nombre)+'</span></div><div class="partner-value '+(g>=0?"tone-green":"tone-red")+'">'+money(g)+'</div></div>';
      }).join("");
      html += '</div></div>';
    }

    if(stock.length>0){
      var qStock = (state.busquedaStock||"").trim().toLowerCase();
      var stockFiltrado = stock;
      if(qStock){
        stockFiltrado = stock.filter(function(v){
          var hay = [v.marca, v.modelo, v.version, v.patente, v.anio, v.color, v.vendedor].join(" ").toLowerCase();
          return hay.indexOf(qStock) >= 0;
        });
      }
      html += '<div>';
      html += '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px">'
        + '<h3 class="section-title" style="margin:0">Vehículos en stock</h3>'
        + '<input class="input" id="buscarStockPanel" type="search" placeholder="Buscar por marca, modelo, patente…" value="'+esc(state.busquedaStock||"")+'" style="max-width:260px">'
        + '</div>';
      html += stockFiltrado.length
        ? vehiculoTable(stockFiltrado)
        : '<div class="list-empty" style="padding:24px;text-align:center;border:1px dashed var(--border);border-radius:10px">No se encontraron vehículos con esa búsqueda.</div>';
      html += '</div>';
    }
    return html;
  }

  function statCard(iconName, label, value, tone, sub){

    return '<div class="stat-card"><div class="stat-top"><span class="stat-label">'+esc(label)+'</span><span class="'+toneClass+'">'+icon(iconName,16,"currentColor")+'</span></div>'
      + '<div class="stat-value '+toneClass+'">'+value+'</div>'

    socios.forEach(function(s){ gananciaPorSocio[s.id]=0; });

  // ---------- ficha PDF ----------
  function generarFichaPDF(v){
    if(typeof window.jspdf === "undefined"){ alert("No se pudo cargar el generador de PDF. Revisá tu conexión a internet e intentá de nuevo."); return; }
    var doc = new window.jspdf.jsPDF({ unit:"mm", format:"a4" });
    var pageW = doc.internal.pageSize.getWidth();
    var pageH = doc.internal.pageSize.getHeight();
    var margin = 16;
    var headerH = 40;
    var footerH = 26;
    var top = headerH + 8;
    var bottom = pageH - footerH;
    var usableH = bottom - top;

    var fotos = fotosOf(v);
    var specs = [["Año", String(v.anio)]];
    if(v.kilometraje) specs.push(["Kilometraje", Number(v.kilometraje).toLocaleString("es-AR")+" km"]);
    if(v.color) specs.push(["Color", v.color]);
    if(v.combustible) specs.push(["Combustible", v.combustible]);
    if(v.transmision) specs.push(["Transmisión", v.transmision]);
    var prestaciones = v.prestaciones||[];
    var titleText = v.marca+" "+v.modelo+(v.version?" "+v.version:"");
    var badges = ["Tenemos FINANCIACIÓN","Aceptamos PERMUTA"];

    // ---- estimar altura total necesaria con un set de medidas ----
    function estimateHeight(sz){
      var h = 0;
      if(fotos.length) h += sz.photosH + sz.gapPhotos;
      h += sz.priceBarH + sz.gapPrice;
      h += sz.specsH + sz.gapSpecs;
      if(prestaciones.length){
        var rows = Math.ceil(prestaciones.length/2);
        h += 6 + rows*sz.equipRowH + (rows-1)*sz.equipGap + sz.gapAfterEquip;
      }
      if(v.observaciones){
        doc.setFont("helvetica","normal");
        doc.setFontSize(sz.obsFont);
        var lines = doc.splitTextToSize(v.observaciones, pageW - margin*2 - sz.obsPad*2);
        h += sz.obsPad*2 + 5 + lines.length*sz.obsLineH;
      }
      return h;
    }

    var tiers = [
      { photosH:80, gapPhotos:8, priceBarH:22, gapPrice:8, specsH:17, gapSpecs:8,
        equipRowH:6.2, equipGap:2, equipFont:9.5, gapAfterEquip:8,
        obsPad:8, obsLineH:5, obsFont:9.5, titleFont:16, priceFont:19 },
      { photosH:62, gapPhotos:6, priceBarH:18, gapPrice:6, specsH:14, gapSpecs:6,
        equipRowH:5.2, equipGap:1.6, equipFont:8.3, gapAfterEquip:6,
        obsPad:6, obsLineH:4.2, obsFont:8.3, titleFont:14, priceFont:16 },
      { photosH:46, gapPhotos:4, priceBarH:15, gapPrice:4, specsH:12, gapSpecs:4,
        equipRowH:4.4, equipGap:1.2, equipFont:7.2, gapAfterEquip:4,
        obsPad:4, obsLineH:3.6, obsFont:7.2, titleFont:12, priceFont:13 }
    ];
    var sz = tiers[0];
    for(var t=0; t<tiers.length; t++){
      sz = tiers[t];
      if(estimateHeight(sz) <= usableH) break;
    }

    // ---- encabezado: logo grande + dirección al lado ----
    doc.setFillColor(0,0,0);
    doc.rect(0,0,pageW,headerH,"F");
    var logoH = 30;
    var logoW = logoH * LOGO_ALFA_RATIO;
    try{ doc.addImage(LOGO_ALFA, "JPEG", margin, (headerH-logoH)/2, logoW, logoH, undefined, "FAST"); }catch(e){ console.error("No se pudo incluir el logo en el PDF", e); }
    doc.setTextColor(205,205,205);
    doc.setFont("helvetica","normal");
    doc.setFontSize(10.5);
    doc.text("Miranda 877, Hurlingham, Buenos Aires", margin+logoW+10, headerH/2-3);
    doc.setFontSize(9.5);
    doc.text("WhatsApp +54 9 11 6568-1106", margin+logoW+10, headerH/2+5);
    doc.setTextColor(255,255,255);
    doc.setFontSize(9.5);
    doc.text("Ficha de vehículo", pageW - margin, headerH/2 + 2, { align: "right" });

    var y = top;

    function drawPhotoContain(dataUrl, x, boxY, maxW, maxH, imgEl){
      var w = maxW, h = maxH;
      if(imgEl && imgEl.naturalWidth && imgEl.naturalHeight){
        var ratio = imgEl.naturalWidth/imgEl.naturalHeight;
        w = maxW; h = w/ratio;
        if(h > maxH){ h = maxH; w = h*ratio; }
      }
      var dx = x + (maxW-w)/2, dy = boxY + (maxH-h)/2;
      try{ doc.addImage(dataUrl, "JPEG", dx, dy, w, h, undefined, "FAST"); }
      catch(e){ console.error("No se pudo incluir una foto en el PDF", e); }
    }

    function drawPhotoCard(dataUrl, x, cx0, w, h, imgEl, pad){
      doc.setFillColor(212,212,212);
      doc.rect(x+1, cx0+1.2, w, h, "F");
      doc.setFillColor(255,255,255);
      doc.setDrawColor(222,222,222);
      doc.setLineWidth(0.3);
      doc.rect(x, cx0, w, h, "FD");
      drawPhotoContain(dataUrl, x+pad, cx0+pad, w-pad*2, h-pad*2, imgEl);
    }

    // ---- fotos: principal + grilla 2x2 ----
    if(fotos.length){
      var thumbEls = document.querySelectorAll(".foto-thumb-item img");
      var maxW = pageW - margin*2;
      var gapMid = 5;
      var heroW = fotos.length > 1 ? (maxW-gapMid)/2 : maxW;
      drawPhotoCard(fotos[0], margin, y, heroW, sz.photosH, thumbEls[0], 3);
      if(fotos.length > 1){
        var gridX = margin + heroW + gapMid;
        var cellGap = 3.5;
        var cellW = (heroW-cellGap)/2, cellH = (sz.photosH-cellGap)/2;
        fotos.slice(1,5).forEach(function(f,i){
          var col = i%2, row = Math.floor(i/2);
          drawPhotoCard(f, gridX+col*(cellW+cellGap), y+row*(cellH+cellGap), cellW, cellH, thumbEls[i+1], 2);
        });
      }
      y += sz.photosH + sz.gapPhotos;
    }

    // ---- franja marca/modelo/año + precio ----
    doc.setFillColor(0,0,0);
    doc.rect(margin, y, pageW-margin*2, sz.priceBarH, "F");
    doc.setFont("helvetica","bold");
    doc.setFontSize(sz.titleFont);
    doc.setTextColor(255,255,255);
    doc.text(titleText, margin+8, y+sz.priceBarH*0.42);
    doc.setFont("helvetica","normal");
    doc.setFontSize(9);
    doc.setTextColor(180,180,180);
    doc.text(String(v.anio), margin+8, y+sz.priceBarH*0.78);
    if(v.precioPublicado){
      doc.setFont("helvetica","normal");
      doc.setFontSize(7.5);
      doc.setTextColor(180,180,180);
      doc.text("PRECIO", pageW-margin-8, y+sz.priceBarH*0.32, { align:"right" });
      doc.setFont("helvetica","bold");
      doc.setFontSize(sz.priceFont);
      doc.setTextColor(255,255,255);
      doc.text(moneyFmt(v.precioPublicado, v.precioPublicadoMoneda), pageW-margin-8, y+sz.priceBarH*0.78, { align:"right" });
    }
    y += sz.priceBarH + sz.gapPrice;

    // ---- ficha técnica: 5 celdas ----
    var boxW = pageW - margin*2;
    var cellW2 = boxW/specs.length;
    doc.setDrawColor(218,218,218);
    doc.setLineWidth(0.3);
    doc.rect(margin, y, boxW, sz.specsH, "S");
    specs.forEach(function(s, i){
      var x = margin + i*cellW2;
      if(i>0) doc.line(x, y, x, y+sz.specsH);
      doc.setFont("helvetica","normal");
      doc.setFontSize(7.3);
      doc.setTextColor(140,140,140);
      doc.text(s[0].toUpperCase(), x+3, y+sz.specsH*0.4);
      doc.setFont("helvetica","bold");
      doc.setFontSize(sz.specsH>=15?10.5:9);
      doc.setTextColor(25,25,25);
      var val = doc.splitTextToSize(s[1], cellW2-5)[0];
      doc.text(val, x+3, y+sz.specsH*0.8);
    });
    y += sz.specsH + sz.gapSpecs;

    // ---- prestaciones: 2 columnas, viñeta cuadrada ----
    if(prestaciones.length){
      doc.setFont("helvetica","bold");
      doc.setFontSize(sz.equipFont+1.3);
      doc.setTextColor(25,25,25);
      doc.text("PRESTACIONES", margin, y);
      var titleW2 = doc.getTextWidth("PRESTACIONES");
      doc.setDrawColor(220,220,220);
      doc.setLineWidth(0.3);
      doc.line(margin+titleW2+6, y-1.6, pageW-margin, y-1.6);
      y += 6;
      var colGap = 10;
      var colW2 = (pageW-margin*2-colGap)/2;
      var rows = Math.ceil(prestaciones.length/2);
      prestaciones.forEach(function(p, i){
        var col = i % 2, row = Math.floor(i/2);
        var x = margin + col*(colW2+colGap);
        var yy = y + row*(sz.equipRowH+sz.equipGap);
        doc.setFillColor(25,25,25);
        doc.rect(x, yy-2.6, 1.8, 1.8, "F");
        doc.setFont("helvetica","normal");
        doc.setFontSize(sz.equipFont);
        doc.setTextColor(50,50,50);
        doc.text(p, x+5, yy);
      });
      y += rows*sz.equipRowH + (rows-1)*sz.equipGap + sz.gapAfterEquip;
    }

    // ---- observaciones: caja con borde ----
    if(v.observaciones){
      doc.setFont("helvetica","normal");
      doc.setFontSize(sz.obsFont);
      var obsLines = doc.splitTextToSize(v.observaciones, pageW - margin*2 - sz.obsPad*2);
      var avail = bottom - y - sz.obsPad*2 - 5;
      var maxLines = Math.max(0, Math.floor(avail/sz.obsLineH));
      if(obsLines.length > maxLines){
        obsLines = obsLines.slice(0, maxLines);
        if(obsLines.length) obsLines[obsLines.length-1] = obsLines[obsLines.length-1].replace(/.{3}$/, "…");
      }
      if(obsLines.length){
        var boxH2 = sz.obsPad*2 + 5 + obsLines.length*sz.obsLineH;
        doc.setDrawColor(220,220,220);
        doc.setLineWidth(0.3);
        doc.rect(margin, y, pageW-margin*2, boxH2, "S");
        doc.setFont("helvetica","normal");
        doc.setFontSize(7.3);
        doc.setTextColor(140,140,140);
        doc.text("OBSERVACIONES", margin+sz.obsPad, y+sz.obsPad+2);
        doc.setFontSize(sz.obsFont);
        doc.setTextColor(60,60,60);
        doc.text(obsLines, margin+sz.obsPad, y+sz.obsPad+5+sz.obsLineH*0.7);
      }
    }

    // ---- pie: badges + by AppsArt ----
    doc.setFont("helvetica","bold");
    doc.setFontSize(9);
    var badgeW = badges.map(function(b){ return doc.getTextWidth(b)+16; });
    var totalBadgeW = badgeW.reduce(function(a,b){return a+b;},0) + (badges.length-1)*6;
    var badgeX = (pageW-totalBadgeW)/2;
    var badgeY = pageH-23;
    badges.forEach(function(b,i){
      doc.setDrawColor(25,25,25);
      doc.setLineWidth(0.4);
      doc.rect(badgeX, badgeY, badgeW[i], 8, "S");
      doc.setTextColor(25,25,25);
      doc.text(b, badgeX+badgeW[i]/2, badgeY+5.3, { align:"center" });
      badgeX += badgeW[i]+6;
    });

    doc.setFont("helvetica","normal");
    doc.setFontSize(8.5);
    doc.setTextColor(150,150,150);
    var byText = "by", byW = doc.getTextWidth(byText);
    var aLogoH = 5, aLogoW = aLogoH * LOGO_APPSART_RATIO;
    var totalByW = byW + 3 + aLogoW;
    var byX = (pageW-totalByW)/2;
    var byY = pageH-9;
    doc.text(byText, byX, byY);
    try{ doc.addImage(LOGO_APPSART, "PNG", byX+byW+3, byY-aLogoH+1.3, aLogoW, aLogoH, undefined, "FAST"); }
    catch(e){ console.error("No se pudo incluir el logo de AppsArt en el PDF", e); }

    var filename = (v.marca+"-"+v.modelo+"-"+v.anio).replace(/\s+/g,"-").toLowerCase()+"-ficha.pdf";
    var blobUrl = URL.createObjectURL(doc.output("blob"));
    var a = document.createElement("a");
    a.href = blobUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(blobUrl); }, 2000);
  }

  // ---------- content events ----------
  function attachContentEvents(){
    var main = document.getElementById("main");

    main.querySelectorAll("[data-open-vehiculo]").forEach(function(el){
      el.addEventListener("click", function(){
        state.selectedVehiculo = el.getAttribute("data-open-vehiculo");
        state.tab = "vehiculos";
        render();
      });
    });
    main.querySelectorAll("[data-filtro]").forEach(function(el){
      el.addEventListener("click", function(){ state.filtro = el.getAttribute("data-filtro"); render(); });
    });

    var buscarInput = main.querySelector("#buscarVehiculo");
    if(buscarInput){
      buscarInput.addEventListener("input", function(){
        state.busqueda = buscarInput.value;
        render();
        var inp = document.getElementById("buscarVehiculo");
        if(inp){ inp.focus(); var pos = inp.value.length; inp.setSelectionRange(pos, pos); }
      });
    }

    var buscarStockPanel = main.querySelector("#buscarStockPanel");
    if(buscarStockPanel){
      buscarStockPanel.addEventListener("input", function(){
        state.busquedaStock = buscarStockPanel.value;
        render();
        var inp = document.getElementById("buscarStockPanel");
        if(inp){ inp.focus(); var pos = inp.value.length; inp.setSelectionRange(pos, pos); }
      });
    }

    var nuevoVeh = main.querySelector('[data-action="nuevo-vehiculo"]');
    if(nuevoVeh) nuevoVeh.addEventListener("click", function(){ state.modal = {type:"nuevo-vehiculo"}; renderModal(); });
    var nuevoSocio = main.querySelector('[data-action="nuevo-socio"]');
    if(nuevoSocio) nuevoSocio.addEventListener("click", function(){ state.modal = {type:"nuevo-socio"}; renderModal(); });

    var volver = main.querySelector('[data-action="volver"]');
    if(volver) volver.addEventListener("click", function(){ state.selectedVehiculo = null; render(); });
    var vender = main.querySelector('[data-action="vender"]');
    if(vender) vender.addEventListener("click", function(){ state.modal = {type:"vender", payload: state.selectedVehiculo}; renderModal(); });
    var reabrir = main.querySelector('[data-action="reabrir"]');
    if(reabrir) reabrir.addEventListener("click", function(){ reabrirVenta(state.selectedVehiculo); });
    var eliminarVeh = main.querySelector('[data-action="eliminar-vehiculo"]');
    if(eliminarVeh) eliminarVeh.addEventListener("click", function(){
      var v = state.data.vehiculos.find(function(x){return x.id===state.selectedVehiculo;});
      if(v && confirm("¿Eliminar "+v.marca+" "+v.modelo+"? Esta acción no se puede deshacer.")) deleteVehiculo(v.id);
    });
    var editarFicha = main.querySelector('[data-action="editar-ficha"]');
    if(editarFicha) editarFicha.addEventListener("click", function(){ state.modal = {type:"editar-ficha", payload: state.selectedVehiculo}; renderModal(); });
    var editarPart = main.querySelector('[data-action="editar-participaciones"]');
    if(editarPart) editarPart.addEventListener("click", function(){ state.modal = {type:"editar-participaciones", payload: state.selectedVehiculo}; renderModal(); });
    var descargarPdf = main.querySelector('[data-action="descargar-pdf"]');
    if(descargarPdf) descargarPdf.addEventListener("click", function(){
      var v = state.data.vehiculos.find(function(x){return x.id===state.selectedVehiculo;});
      if(v) generarFichaPDF(v);
    });

    main.querySelectorAll("[data-delete-gasto]").forEach(function(el){
      el.addEventListener("click", function(){ deleteGasto(state.selectedVehiculo, el.getAttribute("data-delete-gasto")); });
    });
    main.querySelectorAll("[data-delete-socio]").forEach(function(el){
      el.addEventListener("click", function(){
        if(confirm("¿Eliminar este socio? Se quitará de todas las participaciones registradas.")) deleteSocio(el.getAttribute("data-delete-socio"));
      });
    });

    var gastoForm = main.querySelector("#gastoForm");
    if(gastoForm){
      gastoForm.addEventListener("submit", function(e){
        e.preventDefault();
        var monto = document.getElementById("gMonto").value;
        if(!monto) return;
        addGasto(state.selectedVehiculo, {
          tipo: document.getElementById("gTipo").value,
          monto: Number(monto),
          moneda: document.getElementById("gMoneda").value,
          fecha: document.getElementById("gFecha").value,
          descripcion: document.getElementById("gDesc").value
        });
      });
    }

    var vehFotoInput = main.querySelector("#vehFotoInput");
    if(vehFotoInput){
      vehFotoInput.addEventListener("change", function(){
        var files = Array.prototype.slice.call(vehFotoInput.files||[]);
        if(!files.length) return;
        var results = [];
        var pending = files.length;
        files.forEach(function(file){
          compressImage(file, 1000, 0.75, function(dataUrl){
            if(dataUrl) results.push(dataUrl);
            pending--;
            if(pending===0){
              if(results.length) addFotosVehiculo(state.selectedVehiculo, results);
              else alert("No se pudo procesar la imagen. Probá con otra foto.");
            }
          });
        });
      });
    }
    main.querySelectorAll("[data-set-principal]").forEach(function(el){
      el.addEventListener("click", function(){
        var idx = Number(el.getAttribute("data-set-principal"));
        if(idx>0) setFotoPrincipal(state.selectedVehiculo, idx);
      });
    });
    main.querySelectorAll("[data-del-foto]").forEach(function(el){
      el.addEventListener("click", function(){
        removeFotoVehiculo(state.selectedVehiculo, Number(el.getAttribute("data-del-foto")));
      });
    });
  }

  // ---------- modals ----------
  function renderModal(){
    var root = document.getElementById("modalRoot");
    if(!state.modal){ root.innerHTML=""; return; }
    var t = state.modal.type;
    if(t==="nuevo-socio") root.innerHTML = modalWrap("Nuevo socio", formSocioHTML(), 420);
    else if(t==="nuevo-vehiculo") root.innerHTML = modalWrap("Cargar vehículo comprado", formVehiculoHTML(), 620);
    else if(t==="vender") root.innerHTML = modalWrap("Registrar venta · "+vehTitle(state.modal.payload), formVentaHTML(state.modal.payload), 460);
    else if(t==="editar-ficha") root.innerHTML = modalWrap("Editar ficha · "+vehTitle(state.modal.payload), formEditarFichaHTML(state.modal.payload), 620);
    else if(t==="editar-participaciones") root.innerHTML = modalWrap("Participación · "+vehTitle(state.modal.payload), formEditarParticipacionesHTML(state.modal.payload), 460);
    else if(t==="tipo-cambio") root.innerHTML = modalWrap("Tipo de cambio", formTipoCambioHTML(), 380);
    attachModalEvents();
  }
  function vehTitle(id){
    var v = state.data.vehiculos.find(function(x){return x.id===id;});
    return v ? esc(v.marca)+" "+esc(v.modelo) : "";
  }
  function modalWrap(title, bodyHTML, width){
    return '<div class="modal-overlay" id="modalOverlay"><div class="modal-box" style="max-width:'+width+'px">'
      + '<div class="modal-head"><h3 class="modal-title">'+esc(title)+'</h3><button class="icon-btn" id="modalClose">'+icon("x",18)+'</button></div>'
      + '<div class="modal-body">'+bodyHTML+'</div></div></div>';
  }
  function closeModal(){ state.modal=null; renderModal(); }

  function formSocioHTML(){
    return '<form id="formSocio">'
      + '<label class="field"><span class="field-label">Nombre del socio</span><input class="input" id="socioNombre" autofocus placeholder="Ej: Martín Gómez"></label>'
      + '<button class="btn-primary" type="submit" style="width:100%;justify-content:center;margin-top:6px">Guardar socio</button>'
      + '</form>';
  }

  function detallesFieldsHTML(prefix, vehiculo){
    vehiculo = vehiculo || {};
    var html = '';
    html += '<div class="grid-2">'
      + field("Kilometraje", '<input class="input" id="'+prefix+'Km" type="number" min="0" placeholder="45000" value="'+esc(vehiculo.kilometraje||"")+'">')
      + field("Color", '<input class="input" id="'+prefix+'Color" placeholder="Ej: Gris plata" value="'+esc(vehiculo.color||"")+'">')
      + '</div>';
    html += '<div class="grid-2">'
      + field("Combustible", '<select class="input" id="'+prefix+'Combustible"><option value="">—</option>'+COMBUSTIBLES.map(function(c){return '<option value="'+esc(c)+'"'+(vehiculo.combustible===c?" selected":"")+'>'+esc(c)+'</option>';}).join("")+'</select>')
      + field("Transmisión", '<select class="input" id="'+prefix+'Transmision"><option value="">—</option>'+TRANSMISIONES.map(function(t){return '<option value="'+esc(t)+'"'+(vehiculo.transmision===t?" selected":"")+'>'+esc(t)+'</option>';}).join("")+'</select>')
      + '</div>';
    html += field("Precio publicado (para la ficha)", '<div class="amount-group"><input class="input" id="'+prefix+'PrecioPub" type="number" min="0" placeholder="Ej: 9500000" value="'+esc(vehiculo.precioPublicado||"")+'"><select class="input" id="'+prefix+'PrecioPubMoneda"><option value="ARS"'+(vehiculo.precioPublicadoMoneda!=="USD"?" selected":"")+'>AR$</option><option value="USD"'+(vehiculo.precioPublicadoMoneda==="USD"?" selected":"")+'>US$</option></select></div>');
    html += '<div class="field"><span class="field-label">Prestaciones</span><div class="chips-form">'
      + PRESTACIONES_COMUNES.map(function(p){
          var checked = (vehiculo.prestaciones||[]).indexOf(p)>=0;
          return '<label class="chip-check"><input type="checkbox" value="'+esc(p)+'" data-prestacion'+(checked?" checked":"")+'> '+esc(p)+'</label>';
        }).join("") + '</div></div>';
    html += field("Observaciones (opcional)", '<textarea class="input" id="'+prefix+'Obs" rows="3" style="resize:vertical" placeholder="Detalles adicionales para compartir con el comprador">'+esc(vehiculo.observaciones||"")+'</textarea>');
    return html;
  }

  function formVehiculoHTML(){
    var socios = state.data.socios;
    var today = new Date().toISOString().slice(0,10);
    var eachPct = socios.length ? Math.round(100/socios.length) : 0;
    var anioActual = new Date().getFullYear();
    var anioOptions = "";
    for(var y=anioActual+1; y>=1980; y--){ anioOptions += '<option value="'+y+'"'+(y===anioActual?" selected":"")+'>'+y+'</option>'; }

    var marcaOptions = MARCAS_ORDEN.map(function(m){return '<option value="'+esc(m)+'">'+esc(m)+'</option>';}).join("") + '<option value="__otra__">Otra marca…</option>';

    var html = '<form id="formVehiculo">';
    html += '<div class="form-photo-drop" id="fFotoDrop">'+icon("car",18)+' <span id="fFotoDropLabel">Agregar una o más fotos del vehículo (opcional)</span></div>'
      + '<div class="form-photo-preview" id="fFotoPreview"></div>'
      + '<input type="file" id="fFoto" accept="image/*" multiple class="sr-only">';
    html += '<div class="grid-2">'
      + field("Marca", '<select class="input" id="fMarca" required>'+marcaOptions+'</select>')
      + field("Modelo", '<select class="input" id="fModelo" required></select>')
      + '</div>';
    html += '<div class="grid-2" style="display:none" id="fMarcaOtraWrap">'
      + field("Nombre de la marca", '<input class="input" id="fMarcaOtra" placeholder="Ej: Chana">')
      + '</div>';
    html += '<div class="grid-2" style="display:none" id="fModeloOtraWrap">'
      + field("Nombre del modelo", '<input class="input" id="fModeloOtra" placeholder="Ej: Modelo poco común">')
      + '</div>';
    html += field("Versión (opcional)", '<select class="input" id="fVersion"><option value="">— sin especificar —</option><option value="__otro__">Otra versión…</option></select>');
    html += '<div style="display:none" id="fVersionOtraWrap">' + field("Especificar versión", '<input class="input" id="fVersionOtra" placeholder="Ej: Trend 1.6 2012">') + '</div>';
    html += '<div class="grid-2">'
      + field("Año", '<select class="input" id="fAnio">'+anioOptions+'</select>')
      + field("Patente / Dominio", '<input class="input" id="fPatente" placeholder="AB123CD" style="text-transform:uppercase">')
      + field("Fecha de compra", '<input class="input" id="fFecha" type="date" value="'+today+'">')
      + field("Precio de compra", '<div class="amount-group"><input class="input" id="fPrecio" type="number" min="0" required placeholder="8000000"><select class="input" id="fPrecioMoneda"><option value="ARS">AR$</option><option value="USD">US$</option></select></div>')
      + '</div>';
    html += field("Comprado a (opcional)", '<input class="input" id="fVendedor" placeholder="Nombre del vendedor">');

    html += '<h3 class="section-title" style="margin-top:18px">Detalles para la ficha (opcional)</h3>';
    html += detallesFieldsHTML("f");

    html += '<div class="pct-head"><span class="pct-label">PARTICIPACIÓN POR SOCIO</span><span class="pct-total" id="pctTotal" style="color:'+(eachPct*socios.length===100||socios.length===0?"var(--green)":"var(--amber)")+'">'+(socios.length?eachPct*socios.length:0)+'% asignado</span></div>';

    if(socios.length===0){
      html += '<div style="border:1px dashed var(--border);border-radius:8px;padding:14px;font-size:13px;color:var(--text-muted);margin-bottom:10px">Todavía no hay socios cargados. <button type="button" id="needSocio" style="color:var(--amber);background:none;border:none;cursor:pointer;padding:0;text-decoration:underline">Agregar un socio primero</button></div>';
    } else {
      html += '<div class="list-box" style="margin-bottom:6px">';
      socios.forEach(function(s){
        html += '<div class="pct-row"><div style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:'+s.color+'"></span>'+esc(s.nombre)+'</div>'
          + '<div style="display:flex;align-items:center;gap:6px"><input class="input pct-input" type="number" min="0" max="100" value="'+eachPct+'" data-pct-socio="'+s.id+'"><span style="color:var(--text-muted);font-size:13px">%</span></div></div>';
      });
      html += '</div>';
    }
    html += '<div class="warn-line" id="pctWarn" style="display:none">'+icon("alert",14)+' Podés guardar igual, pero lo ideal es que sume 100%.</div>';
    html += '<button class="btn-primary" type="submit" style="width:100%;justify-content:center;margin-top:10px">'+icon("sparkles",15)+' Guardar vehículo</button>';
    html += '</form>';
    return html;
  }

  function formVentaHTML(vehiculoId){
    var vehiculo = state.data.vehiculos.find(function(v){return v.id===vehiculoId;});
    if(!vehiculo) return "";
    var costo = costoTotal(vehiculo);
    var today = new Date().toISOString().slice(0,10);
    var html = '<form id="formVenta">';
    html += field("Fecha de venta", '<input class="input" id="vFecha" type="date" value="'+today+'">');
    html += field("Precio de venta", '<div class="amount-group"><input class="input" id="vPrecio" type="number" min="0" required placeholder="9500000"'+(vehiculo.precioPublicado?' value="'+esc(vehiculo.precioPublicado)+'"':'')+'><select class="input" id="vMoneda"><option value="ARS"'+(vehiculo.precioPublicadoMoneda!=="USD"?" selected":"")+'>AR$</option><option value="USD"'+(vehiculo.precioPublicadoMoneda==="USD"?" selected":"")+'>US$</option></select></div>');
    html += field("Comprador (opcional)", '<input class="input" id="vComprador" placeholder="Nombre del comprador">');
    html += '<div class="summary-line"><span style="color:var(--text-muted)">Costo total (compra + gastos)</span><span class="mono">'+money(costo)+'</span></div>';
    html += '<div class="summary-line" id="ventaPreview" style="display:none"><span style="color:var(--text-muted)">Resultado estimado</span><span class="mono" id="ventaPreviewValue" style="font-weight:700"></span></div>';
    html += '<button class="btn-primary" type="submit" style="width:100%;justify-content:center">Confirmar venta</button>';
    html += '</form>';
    return html;
  }

  function formEditarFichaHTML(vehiculoId){
    var vehiculo = state.data.vehiculos.find(function(v){return v.id===vehiculoId;});
    if(!vehiculo) return "";
    var html = '<form id="formEditarFicha">';
    html += '<h3 class="section-title">Datos de compra</h3>';
    html += '<div class="grid-2">'
      + field("Precio de compra", '<div class="amount-group"><input class="input" id="ePrecioCompra" type="number" min="0" required value="'+esc(vehiculo.precioCompra||"")+'"><select class="input" id="ePrecioCompraMoneda"><option value="ARS"'+(vehiculo.precioCompraMoneda!=="USD"?" selected":"")+'>AR$</option><option value="USD"'+(vehiculo.precioCompraMoneda==="USD"?" selected":"")+'>US$</option></select></div>')
      + field("Patente / Dominio", '<input class="input" id="ePatente" value="'+esc(vehiculo.patente||"")+'" style="text-transform:uppercase">')
      + '</div>';
    var verOpts = VERSIONES[vehiculo.marca+"|"+vehiculo.modelo] || [];
    var verKnown = verOpts.indexOf(vehiculo.version||"") >= 0;
    html += field("Versión (opcional)", '<select class="input" id="eVersion">'
      + '<option value=""'+(!vehiculo.version?" selected":"")+'>— sin especificar —</option>'
      + verOpts.map(function(v){return '<option value="'+esc(v)+'"'+(v===vehiculo.version?" selected":"")+'>'+esc(v)+'</option>';}).join("")
      + '<option value="__otro__"'+(vehiculo.version && !verKnown?" selected":"")+'>Otra versión…</option>'
      + '</select>');
    html += '<div style="display:'+(vehiculo.version && !verKnown ? "block":"none")+'" id="eVersionOtraWrap">'
      + field("Especificar versión", '<input class="input" id="eVersionOtra" value="'+(vehiculo.version && !verKnown ? esc(vehiculo.version) : "")+'">')
      + '</div>';
    html += '<h3 class="section-title" style="margin-top:8px">Ficha</h3>';
    html += detallesFieldsHTML("e", vehiculo);
    html += '<button class="btn-primary" type="submit" style="width:100%;justify-content:center;margin-top:6px">Guardar cambios</button>';
    html += '</form>';
    return html;
  }

  function formEditarParticipacionesHTML(vehiculoId){
    var vehiculo = state.data.vehiculos.find(function(v){return v.id===vehiculoId;});
    if(!vehiculo) return "";
    var socios = state.data.socios;
    var existentes = {};
    (vehiculo.participaciones||[]).forEach(function(p){ existentes[p.socioId] = p.porcentaje; });
    var totalActual = pctSum(vehiculo.participaciones);
    var html = '<form id="formParticipaciones">';
    if(socios.length===0){
      html += '<div style="border:1px dashed var(--border);border-radius:8px;padding:14px;font-size:13px;color:var(--text-muted)">Todavía no hay socios cargados. Agregá socios primero desde la sección Socios.</div>';
    } else {
      html += '<div class="pct-head"><span class="pct-label">PARTICIPACIÓN POR SOCIO</span><span class="pct-total" id="epctTotal" style="color:'+(totalActual===100?"var(--green)":"var(--amber)")+'">'+totalActual+'% asignado</span></div>';
      html += '<div class="list-box" style="margin-bottom:6px">';
      socios.forEach(function(s){
        var val = existentes[s.id]!==undefined ? existentes[s.id] : 0;
        html += '<div class="pct-row"><div style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:'+s.color+'"></span>'+esc(s.nombre)+'</div>'
          + '<div style="display:flex;align-items:center;gap:6px"><input class="input pct-input" type="number" min="0" max="100" value="'+val+'" data-epct-socio="'+s.id+'"><span style="color:var(--text-muted);font-size:13px">%</span></div></div>';
      });
      html += '</div>';
      html += '<div class="warn-line" id="epctWarn" style="display:'+(totalActual!==100?"flex":"none")+'">'+icon("alert",14)+' Podés guardar igual, pero lo ideal es que sume 100%.</div>';
      html += '<button class="btn-primary" type="submit" style="width:100%;justify-content:center;margin-top:10px">Guardar participación</button>';
    }
    html += '</form>';
    return html;
  }

  function formTipoCambioHTML(){
    return '<form id="formTipoCambio">'
      + field("1 US$ equivale a (en pesos)", '<input class="input" id="tcValor" type="number" min="1" value="'+Math.round(state.tipoCambio)+'" required>')
      + '<p style="font-size:12.5px;color:var(--text-muted);margin-top:-6px">Se usa para convertir los montos cargados en pesos a dólares en los totales y el margen de ganancia.</p>'
      + '<button class="btn-primary" type="submit" style="width:100%;justify-content:center;margin-top:6px">Guardar</button>'
      + '</form>';
  }

  function field(label, inputHTML){
    return '<label class="field"><span class="field-label">'+esc(label)+'</span>'+inputHTML+'</label>';
  }

  function attachModalEvents(){
    var overlay = document.getElementById("modalOverlay");
    if(!overlay) return;
    overlay.addEventListener("mousedown", function(e){ if(e.target===overlay) closeModal(); });
    var closeBtn = document.getElementById("modalClose");
    if(closeBtn) closeBtn.addEventListener("click", closeModal);

    var fSocio = document.getElementById("formSocio");
    if(fSocio){
      fSocio.addEventListener("submit", function(e){
        e.preventDefault();
        var nombre = document.getElementById("socioNombre").value.trim();
        if(!nombre) return;
        addSocio(nombre);
        closeModal();
      });
    }

    var needSocio = document.getElementById("needSocio");
    if(needSocio) needSocio.addEventListener("click", function(){ state.modal = {type:"nuevo-socio"}; renderModal(); });

    var fVeh = document.getElementById("formVehiculo");
    if(fVeh){
      var pctInputs = fVeh.querySelectorAll("[data-pct-socio]");
      function recalcPct(){
        var total = 0;
        pctInputs.forEach(function(inp){ total += Number(inp.value)||0; });
        var totalEl = document.getElementById("pctTotal");
        var warnEl = document.getElementById("pctWarn");
        if(totalEl){
          totalEl.textContent = total+"% asignado";
          totalEl.style.color = total===100 ? "var(--green)" : "var(--amber)";
        }
        if(warnEl) warnEl.style.display = (total!==100 && pctInputs.length>0) ? "flex" : "none";
      }
      pctInputs.forEach(function(inp){ inp.addEventListener("input", recalcPct); });
      recalcPct();

      var marcaSel = document.getElementById("fMarca");
      var modeloSel = document.getElementById("fModelo");
      var marcaOtraWrap = document.getElementById("fMarcaOtraWrap");
      var modeloOtraWrap = document.getElementById("fModeloOtraWrap");
      var versionSel = document.getElementById("fVersion");
      var versionOtraWrap = document.getElementById("fVersionOtraWrap");
      function refreshModelos(){
        var modelos = MARCAS_MODELOS[marcaSel.value] || [];
        modeloSel.innerHTML = modelos.map(function(m){return '<option value="'+esc(m)+'">'+esc(m)+'</option>';}).join("") + '<option value="__otro__">Otro modelo…</option>';
        modeloOtraWrap.style.display = "none";
      }
      function refreshVersiones(){
        var versiones = VERSIONES[marcaSel.value+"|"+modeloSel.value] || [];
        versionSel.innerHTML = '<option value="">— sin especificar —</option>'
          + versiones.map(function(v){return '<option value="'+esc(v)+'">'+esc(v)+'</option>';}).join("")
          + '<option value="__otro__">Otra versión…</option>';
        versionOtraWrap.style.display = "none";
      }
      marcaSel.addEventListener("change", function(){
        marcaOtraWrap.style.display = marcaSel.value==="__otra__" ? "grid" : "none";
        refreshModelos();
        refreshVersiones();
      });
      modeloSel.addEventListener("change", function(){
        modeloOtraWrap.style.display = modeloSel.value==="__otro__" ? "grid" : "none";
        refreshVersiones();
      });
      versionSel.addEventListener("change", function(){
        versionOtraWrap.style.display = versionSel.value==="__otro__" ? "block" : "none";
      });
      refreshModelos();
      refreshVersiones();

      var fotoInput = document.getElementById("fFoto");
      var fotoDrop = document.getElementById("fFotoDrop");
      var fotoPreview = document.getElementById("fFotoPreview");
      var fotoDataUrls = [];
      function renderFotoPreview(){
        if(!fotoDataUrls.length){ fotoPreview.style.display="none"; fotoPreview.innerHTML=""; return; }
        fotoPreview.style.display = "grid";
        fotoPreview.innerHTML = fotoDataUrls.map(function(url, i){
          return '<div class="form-photo-preview-item"><img src="'+url+'">'
            + '<button type="button" data-remove-preview="'+i+'">'+icon("x",12)+'</button></div>';
        }).join("");
        fotoPreview.querySelectorAll("[data-remove-preview]").forEach(function(btn){
          btn.addEventListener("click", function(){
            fotoDataUrls.splice(Number(btn.getAttribute("data-remove-preview")),1);
            renderFotoPreview();
          });
        });
      }
      fotoDrop.addEventListener("click", function(){ fotoInput.click(); });
      fotoInput.addEventListener("change", function(){
        var files = Array.prototype.slice.call(fotoInput.files||[]);
        if(!files.length) return;
        var dropLabel = document.getElementById("fFotoDropLabel");
        dropLabel.textContent = "Procesando imágenes…";
        var pending = files.length;
        files.forEach(function(file){
          compressImage(file, 1000, 0.75, function(dataUrl){
            if(dataUrl) fotoDataUrls.push(dataUrl);
            pending--;
            if(pending===0){
              dropLabel.textContent = fotoDataUrls.length ? "Agregar más fotos" : "No se pudo procesar la imagen, probá con otra.";
              renderFotoPreview();
            }
          });
        });
      });

      fVeh.addEventListener("submit", function(e){
        e.preventDefault();
        var marca = marcaSel.value==="__otra__" ? document.getElementById("fMarcaOtra").value.trim() : marcaSel.value;
        var modelo = modeloSel.value==="__otro__" ? document.getElementById("fModeloOtra").value.trim() : modeloSel.value;
        var version = versionSel.value==="__otro__" ? document.getElementById("fVersionOtra").value.trim() : versionSel.value;
        var precio = document.getElementById("fPrecio").value;
        if(!marca || !precio) return;
        var participaciones = [];
        pctInputs.forEach(function(inp){
          var val = Number(inp.value)||0;
          if(val>0) participaciones.push({ socioId: inp.getAttribute("data-pct-socio"), porcentaje: val });
        });
        var prestaciones = [];
        fVeh.querySelectorAll("[data-prestacion]").forEach(function(cb){ if(cb.checked) prestaciones.push(cb.value); });
        addVehiculo({
          marca: marca,
          modelo: modelo,
          version: version,
          anio: document.getElementById("fAnio").value,
          patente: document.getElementById("fPatente").value.toUpperCase(),
          fechaCompra: document.getElementById("fFecha").value,
          precioCompra: precio,
          precioCompraMoneda: document.getElementById("fPrecioMoneda").value,
          vendedor: document.getElementById("fVendedor").value,
          participaciones: participaciones,
          fotos: fotoDataUrls,
          kilometraje: document.getElementById("fKm").value,
          color: document.getElementById("fColor").value,
          combustible: document.getElementById("fCombustible").value,
          transmision: document.getElementById("fTransmision").value,
          precioPublicado: document.getElementById("fPrecioPub").value,
          precioPublicadoMoneda: document.getElementById("fPrecioPubMoneda").value,
          prestaciones: prestaciones,
          observaciones: document.getElementById("fObs").value
        });
        closeModal();
      });
    }

    var fVenta = document.getElementById("formVenta");
    if(fVenta){
      var vehiculo = state.data.vehiculos.find(function(v){return v.id===state.modal.payload;});
      var costo = costoTotal(vehiculo);
      var precioInput = document.getElementById("vPrecio");
      var monedaInput = document.getElementById("vMoneda");
      function recalcVentaPreview(){
        var preview = document.getElementById("ventaPreview");
        var val = document.getElementById("ventaPreviewValue");
        if(precioInput.value===""){ preview.style.display="none"; return; }
        var proyectado = toARS(precioInput.value, monedaInput.value) - costo;
        preview.style.display="flex";
        val.textContent = money(proyectado);
        val.style.color = proyectado>=0 ? "var(--green)" : "var(--red)";
      }
      precioInput.addEventListener("input", recalcVentaPreview);
      monedaInput.addEventListener("change", recalcVentaPreview);
      recalcVentaPreview();
      fVenta.addEventListener("submit", function(e){
        e.preventDefault();
        var precioVenta = document.getElementById("vPrecio").value;
        if(!precioVenta) return;
        registrarVenta(state.modal.payload, {
          fechaVenta: document.getElementById("vFecha").value,
          precioVenta: precioVenta,
          precioVentaMoneda: monedaInput.value,
          comprador: document.getElementById("vComprador").value
        });
        closeModal();
      });
    }

    var fFicha = document.getElementById("formEditarFicha");
    if(fFicha){
      var eVersionSel = document.getElementById("eVersion");
      var eVersionOtraWrap = document.getElementById("eVersionOtraWrap");
      eVersionSel.addEventListener("change", function(){
        eVersionOtraWrap.style.display = eVersionSel.value==="__otro__" ? "block" : "none";
      });
      fFicha.addEventListener("submit", function(e){
        e.preventDefault();
        var prestaciones = [];
        fFicha.querySelectorAll("[data-prestacion]").forEach(function(cb){ if(cb.checked) prestaciones.push(cb.value); });
        var version = eVersionSel.value==="__otro__" ? document.getElementById("eVersionOtra").value.trim() : eVersionSel.value;
        updateVehiculoFields(state.modal.payload, {
          precioCompra: document.getElementById("ePrecioCompra").value,
          precioCompraMoneda: document.getElementById("ePrecioCompraMoneda").value,
          patente: document.getElementById("ePatente").value.toUpperCase(),
          version: version,
          kilometraje: document.getElementById("eKm").value,
          color: document.getElementById("eColor").value,
          combustible: document.getElementById("eCombustible").value,
          transmision: document.getElementById("eTransmision").value,
          precioPublicado: document.getElementById("ePrecioPub").value,
          precioPublicadoMoneda: document.getElementById("ePrecioPubMoneda").value,
          prestaciones: prestaciones,
          observaciones: document.getElementById("eObs").value
        });
        closeModal();
      });
    }

    var fPart = document.getElementById("formParticipaciones");
    if(fPart){
      var epctInputs = fPart.querySelectorAll("[data-epct-socio]");
      function erecalcPct(){
        var total = 0;
        epctInputs.forEach(function(inp){ total += Number(inp.value)||0; });
        var totalEl = document.getElementById("epctTotal");
        var warnEl = document.getElementById("epctWarn");
        if(totalEl){
          totalEl.textContent = total+"% asignado";
          totalEl.style.color = total===100 ? "var(--green)" : "var(--amber)";
        }
        if(warnEl) warnEl.style.display = (total!==100 && epctInputs.length>0) ? "flex" : "none";
      }
      epctInputs.forEach(function(inp){ inp.addEventListener("input", erecalcPct); });
      fPart.addEventListener("submit", function(e){
        e.preventDefault();
        var participaciones = [];
        epctInputs.forEach(function(inp){
          var val = Number(inp.value)||0;
          if(val>0) participaciones.push({ socioId: inp.getAttribute("data-epct-socio"), porcentaje: val });
        });
        updateVehiculoFields(state.modal.payload, { participaciones: participaciones });
        closeModal();
      });
    }

    var fTipoCambio = document.getElementById("formTipoCambio");
    if(fTipoCambio){
      fTipoCambio.addEventListener("submit", function(e){
        e.preventDefault();
        setTipoCambio(document.getElementById("tcValor").value);
        closeModal();
      });
    }
  }

  document.addEventListener("keydown", function(e){
    if(e.key==="Escape" && state.modal) closeModal();
  });

  // ---------- init ----------
  render();
  initRealtime();
})();
</script>
</body>
</html>
