<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Remates El Cruce</title>
<meta name="theme-color" content="#FBF6EC">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root{
    --bg:#FBF6EC; --surface:#FFFFFF; --surface-2:#F3ECDC; --border:#E5D9C0;
    --text:#2A2118; --text-muted:#7A6E5A; --text-faint:#B7AB90;
    --accent:#8B2E2A; --accent-ink:#FFFFFF;
    --green:#3F7A4C; --red:#C0392B; --amber:#A6690A;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--text); font-family:var(--font); -webkit-font-smoothing:antialiased;}
  h1,h2,h3{margin:0 0 8px; font-family:var(--font-display); font-weight:700; letter-spacing:-.01em;}
  h1{font-weight:800;}
  p{line-height:1.5;}
  .muted{color:var(--text-muted);}
  a{color:var(--accent);}
  button{font-family:inherit;}
  input,select,textarea{
    font-family:inherit; font-size:14.5px; color:var(--text); background:var(--surface-2);
    border:1px solid var(--border); border-radius:9px; padding:9px 11px; width:100%;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:0;}
  label{display:block; font-size:12.5px; color:var(--text-muted); margin:0 0 12px; font-weight:600;}
  label input,label select,label textarea{margin-top:5px;}
  label.checkbox{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--text);}
  label.checkbox input{width:auto;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--surface-2); color:var(--text); border:1px solid var(--border);
    border-radius:9px; padding:10px 16px; font-weight:700; font-size:13.5px; cursor:pointer;
  }
  .btn:hover{border-color:#555;}
  .btn:disabled{opacity:.5; cursor:default;}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn-ghost{background:transparent;}
  .btn-sm{padding:6px 10px; font-size:12px;}
  .btn-danger{color:var(--red); border-color:#E8C4BC;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px;}

  #app{display:flex; min-height:100vh;}
  .sidebar{
    width:220px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:18px 14px; position:sticky; top:0; height:100vh;
  }
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:18px; padding:0 4px;}
  .brand .name{font-family:var(--font-display); font-weight:700; font-size:18px; line-height:1.2;}
  .brand .name small{display:block; font-size:10.5px; color:var(--text-muted); font-weight:500;}
  .nav{display:flex; flex-direction:column; gap:2px; flex:1;}
  .nav-item{
    display:flex; align-items:center; gap:9px; padding:10px 12px; border-radius:9px; color:var(--text-muted);
    cursor:pointer; font-size:13.5px; font-weight:700; user-select:none;
  }
  .nav-item:hover{background:var(--surface-2); color:var(--text);}
  .nav-item.active{background:var(--accent); color:var(--accent-ink);}
  .nav-ico{width:17px; height:17px; flex-shrink:0;}
  .backend-badge{font-size:11px; color:var(--text-muted); padding:8px 6px; display:flex; align-items:center; gap:6px;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--green); flex-shrink:0;}
  .dot.local{background:var(--amber);}

  .topbar{display:none;}
  main{flex:1; min-width:0; padding:26px 30px 60px;}
  .section-head{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:16px; flex-wrap:wrap;}
  .searchbar{position:relative; max-width:320px; flex:1;}
  .searchbar input{padding-left:34px;}
  .searchbar .ico{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:13px;}

  @media(max-width:860px){
    .sidebar{display:none;}
    .topbar{
      display:flex; align-items:center; gap:6px; overflow-x:auto; position:sticky; top:0; z-index:20;
      background:var(--surface); border-bottom:1px solid var(--border); padding:10px 12px;
    }
    .topbar .nav-item{white-space:nowrap; padding:8px 11px; font-size:12.5px;}
    #app{display:block;}
    main{padding:16px 14px 50px;}
  }

  .ocr-layout{display:grid; grid-template-columns:340px 1fr; gap:20px; align-items:start;}
  @media(max-width:900px){ .ocr-layout{grid-template-columns:1fr;} }
  .ocr-col-img{position:sticky; top:16px;}
  @media(max-width:900px){ .ocr-col-img{position:static;} }
  .ocr-preview{width:100%; border-radius:10px; margin-top:10px; border:1px solid var(--border); cursor:zoom-in;}
  .ocr-preview.zoomed{cursor:zoom-out;}
  .progress-bar{height:6px; background:var(--surface-2); border-radius:4px; margin-top:10px; overflow:hidden;}
  .progress-bar .fill{height:100%; background:var(--accent); transition:width .2s;}
  .empty-hint{color:var(--text-faint); font-size:13.5px; padding:30px 0; text-align:center; border:1px dashed var(--border); border-radius:10px;}
  .ocr-raw-text{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px; font-size:12px; line-height:1.5; color:var(--text-muted); white-space:pre-wrap; word-break:break-word; max-height:340px; overflow-y:auto;}

  .ocr-rows{display:flex; flex-direction:column; gap:14px;}
  .ocr-row{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px;}
  .ocr-row.dup{border-color:var(--amber);}
  .dup-warning{font-size:12px; color:var(--amber); margin-bottom:8px; font-weight:700;}
  .ocr-row-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 14px;}
  .ocr-row-grid .col-span2{grid-column:1/-1;}
  @media(max-width:520px){ .ocr-row-grid{grid-template-columns:1fr;} }
  .row-foto-preview{width:90px; height:90px; object-fit:cover; border-radius:8px; margin-top:6px; display:block;}
  .ocr-footer-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;}

  .chips{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:10px;}
  .chip{display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:20px; padding:5px 6px 5px 12px; font-size:12.5px;}
  .chip button{background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:13px; padding:2px;}
  .inline-add{display:flex; gap:8px; margin-bottom:18px;}
  .inline-add input{width:auto; flex:1;}

  .table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:10px;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap;}
  th{color:var(--text-muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.03em;}
  tr:last-child td{border-bottom:none;}
  td select{width:auto;}

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:12px 18px;
    border-radius:10px; font-size:13.5px; z-index:100; transition:.2s; pointer-events:none; max-width:90vw;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---- Buscar (vista visual, con fotos) ---- */
  .categoria-tabs{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin-bottom:16px; scrollbar-width:none;}
  .categoria-tabs::-webkit-scrollbar{display:none;}
  .tab-chip{flex:none; padding:8px 14px; border-radius:20px; border:1px solid var(--border); background:var(--surface); color:var(--text-muted); font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;}
  .tab-chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .result-count{font-size:12.5px; color:var(--text-muted); font-weight:600; margin-bottom:10px;}
  .prod-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  @media (min-width:640px){ .prod-grid{grid-template-columns:repeat(3,1fr);} }
  @media (min-width:900px){ .prod-grid{grid-template-columns:repeat(4,1fr); gap:16px;} }
  @media (min-width:1300px){ .prod-grid{grid-template-columns:repeat(5,1fr);} }
  .p-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; cursor:pointer; text-align:left; padding:0;}
  .p-card:hover{box-shadow:0 4px 16px rgba(42,33,24,.12);}
  .p-card-img{width:100%; aspect-ratio:1/1; background:var(--surface-2); overflow:hidden; position:relative;}
  .p-card-img img{width:100%; height:100%; object-fit:cover; display:block;}
  .p-card-img .noimg{width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:28px;}
  .estado-flag{position:absolute; top:6px; left:6px; font-size:10px; font-weight:700; padding:2px 7px; border-radius:6px; color:#fff;}
  .estado-flag.reservado{background:var(--amber);}
  .estado-flag.vendido{background:var(--text-faint);}
  .p-card-body{padding:9px 10px 11px;}
  .p-card-title{font-size:12.5px; font-weight:700; line-height:1.25; margin:0 0 4px; color:var(--text); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .p-card-meta{display:flex; flex-wrap:wrap; align-items:center; gap:4px; justify-content:space-between;}
  .badge{font-size:10.5px; font-weight:600; background:var(--surface-2); color:var(--text-muted); border-radius:6px; padding:2px 6px;}
  .price{font-family:var(--font-display); font-size:14px; font-weight:700; color:var(--accent);}
  .empty-state{padding:60px 20px; text-align:center; color:var(--text-muted); grid-column:1/-1;}
  .empty-state .big{font-size:34px; margin-bottom:8px;}

  .overlay{position:fixed; inset:0; background:rgba(42,33,24,.45); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s;}
  .overlay.show{opacity:1; pointer-events:auto;}
  .detail{position:fixed; inset:0; z-index:50; background:var(--surface); display:flex; flex-direction:column; transform:translateX(100%); transition:transform .22s ease; pointer-events:none;}
  .detail.show{transform:translateX(0); pointer-events:auto;}
  @media (min-width:720px){
    .detail{ inset:auto; left:50%; top:50%; width:520px; max-width:92vw; max-height:86vh; transform:translate(-50%,-46%) scale(.97); opacity:0; border-radius:18px; overflow:hidden; box-shadow:0 20px 60px rgba(42,33,24,.3);}
    .detail.show{transform:translate(-50%,-50%) scale(1); opacity:1;}
  }
  .detail-img{width:100%; aspect-ratio:4/3; background:var(--surface-2); overflow:hidden; position:relative;}
  .detail-img img{width:100%; height:100%; object-fit:cover; display:block;}
  .detail-img .noimg{width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:44px;}
  .detail-close{position:absolute; top:12px; right:12px; width:34px; height:34px; border-radius:50%; background:rgba(0,0,0,.45); color:#fff; border:none; font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .detail-body{overflow-y:auto; padding:16px 18px calc(20px + env(safe-area-inset-bottom));}
  .detail-title{font-size:18px; font-weight:800; margin:0 0 3px;}
  .detail-sub{color:var(--text-muted); font-size:13px; margin:0 0 10px;}
  .detail-price{font-family:var(--font-display); font-size:24px; font-weight:700; color:var(--accent); margin:0 0 14px;}
  .spec-table{width:100%; border-collapse:collapse;}
  .spec-table tr{border-bottom:1px solid var(--border);}
  .spec-table tr:last-child{border-bottom:none;}
  .spec-table td{padding:9px 0; font-size:13px; vertical-align:top;}
  .spec-table td:first-child{color:var(--text-muted); width:46%; font-weight:600;}
  .spec-table td:last-child{color:var(--text); text-align:right; font-weight:600;}
</style>
</head>
<body>

  <aside class="sidebar">
    <div class="brand">
      <div class="name">Remates El Cruce<small>Carga de catálogo</small></div>
    </div>
    <nav class="nav">
      <div class="nav-item" data-action="setTab" data-tab="productos"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg> Productos</div>
      <div class="nav-item" data-action="setTab" data-tab="escanear"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg> Carga</div>
      <div class="nav-item" data-action="setTab" data-tab="fotos"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2h6l2 2h3v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8Z"/><circle cx="12" cy="13.5" r="3.3"/></svg> Agregar foto</div>

  </aside>
  <div style="flex:1; min-width:0;">
    <div class="topbar">
      <div class="nav-item" data-action="setTab" data-tab="productos"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg> Productos</div>
      <div class="nav-item" data-action="setTab" data-tab="escanear"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg> Carga</div>
      <div class="nav-item" data-action="setTab" data-tab="fotos"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2h6l2 2h3v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8Z"/><circle cx="12" cy="13.5" r="3.3"/></svg> Foto</div>
    </div>
    <main id="content"></main>
  </div>
</div>

<div class="overlay" id="overlay" data-action="cerrarDetalle"></div>

  <div class="detail-img" id="detailImg">
    <button class="detail-close" data-action="cerrarDetalle">✕</button>
  </div>

    <h2 class="detail-title" id="detailTitle"></h2>
    <p class="detail-sub" id="detailSub"></p>
    <p class="detail-price" id="detailPrice"></p>
    <table class="spec-table" id="detailSpecs"></table>
    <div id="detailActions" style="margin-top:14px;"></div>
  </div>
</div>

<script src="./carga-ocr.js"></script>
<script>
'use strict';

const FIREBASE_CONFIG_KEY = 'remates_firebase_config';
const VISION_API_KEY_KEY = 'remates_vision_api_key';
const LOCAL_PRODUCTOS_KEY = 'remates_productos_local';
const LOCAL_CATEGORIAS_KEY = 'remates_categorias_local';
const LOCAL_ETIQUETAS_KEY = 'remates_etiquetas_local';
const DEFAULT_FIREBASE_CONFIG = null; // se completa cuando el cliente cree su proyecto Firebase
const DEFAULT_CATEGORIAS = ['Muebles','Cuadros y decoración','Cerámica y vidrio','Iluminación','Vajilla','Adornos','Textiles','Herramientas','Piezas de demolición','Jardín','Otros'];

let db = null, storage = null;

let state = {
  tab: 'productos',
  backendMode: 'local',
  productos: [], categorias: [], etiquetas: [],
  ocr: { imageDataUrl: null, imageName: '', processing: false, progress: 0, rows: [] },
  fotoBusqueda: { codigo: '', producto: null, buscado: false, compressed: null, previewUrl: null, uploading: false },
  buscar: { search: '', categoria: 'Todas' },
  detalleCodigo: null
};

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatMoney(n, moneda){ return (moneda==='USD' ? 'U$S ' : '$ ') + (Number(n)||0).toLocaleString('es-AR'); }

let toastTimer = null;
function toast(msg){
  let el = document.getElementById('toast');
  if(!el){ el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 3200);
}

function getVisionApiKey(){ return (localStorage.getItem(VISION_API_KEY_KEY) || '').trim(); }

/* ===================== Backend: Firestore o localStorage ===================== */
function getSavedFirebaseConfig(){
  const raw = localStorage.getItem(FIREBASE_CONFIG_KEY);
  if(raw){ try{ return JSON.parse(raw); }catch(e){ return null; } }
  return DEFAULT_FIREBASE_CONFIG;
}
function initBackend(){
  const cfg = getSavedFirebaseConfig();
  if(cfg){
    try{
      firebase.initializeApp(cfg);
      db = firebase.firestore();
      storage = firebase.storage();
      state.backendMode = 'firebase';
      return;
    }catch(e){ console.warn('No se pudo conectar a Firebase, sigo en modo local.', e); }
  }
  state.backendMode = 'local';
}
function localRead(key, fallback){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }catch(e){ return fallback; }
}
function localWrite(key, value){ localStorage.setItem(key, JSON.stringify(value)); }

async function loadAll(){
  if(state.backendMode === 'firebase'){
    const [prodSnap, catSnap, etqSnap] = await Promise.all([
      db.collection('productos').get(),
      db.collection('config').doc('categorias').get(),
      db.collection('config').doc('etiquetas').get()
    ]);
    state.productos = prodSnap.docs.map(d => d.data());
    if(catSnap.exists){ state.categorias = catSnap.data().lista || []; }
    else { state.categorias = DEFAULT_CATEGORIAS; await db.collection('config').doc('categorias').set({lista: DEFAULT_CATEGORIAS}); }
    state.etiquetas = (etqSnap.exists && etqSnap.data().lista) || [];
  } else {
    state.productos = localRead(LOCAL_PRODUCTOS_KEY, []);
    if(localStorage.getItem(LOCAL_CATEGORIAS_KEY)){ state.categorias = localRead(LOCAL_CATEGORIAS_KEY, DEFAULT_CATEGORIAS); }
    else { state.categorias = DEFAULT_CATEGORIAS; localWrite(LOCAL_CATEGORIAS_KEY, DEFAULT_CATEGORIAS); }
    state.etiquetas = localRead(LOCAL_ETIQUETAS_KEY, []);
  }
}

async function saveProducto(p){
  p.fechaCarga = p.fechaCarga || Date.now();
  if(state.backendMode === 'firebase'){
    await db.collection('productos').doc('p' + p.codigo).set(p, { merge: true });
  } else {
    const list = localRead(LOCAL_PRODUCTOS_KEY, []);
    const idx = list.findIndex(x => x.codigo === p.codigo);
    if(idx >= 0) list[idx] = Object.assign({}, list[idx], p); else list.push(p);
    localWrite(LOCAL_PRODUCTOS_KEY, list);
  }
  const idx2 = state.productos.findIndex(x => x.codigo === p.codigo);
  if(idx2 >= 0) state.productos[idx2] = Object.assign({}, state.productos[idx2], p);
  else state.productos.push(p);
}
async function deleteProducto(codigo){
  if(state.backendMode === 'firebase'){ await db.collection('productos').doc('p' + codigo).delete(); }
  else { localWrite(LOCAL_PRODUCTOS_KEY, localRead(LOCAL_PRODUCTOS_KEY, []).filter(x => x.codigo !== codigo)); }
}
async function saveCategorias(list){
  state.categorias = list;
  if(state.backendMode === 'firebase'){ await db.collection('config').doc('categorias').set({ lista: list }); }
  else { localWrite(LOCAL_CATEGORIAS_KEY, list); }
}
async function saveEtiquetas(list){
  state.etiquetas = list;
  if(state.backendMode === 'firebase'){ await db.collection('config').doc('etiquetas').set({ lista: list }); }
  else { localWrite(LOCAL_ETIQUETAS_KEY, list); }
}

/* ===================== Fotos: compresión client-side + subida ===================== */
function compressImageFile(file, maxSide, quality){
  maxSide = maxSide || 1400; quality = quality || 0.82;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if(width > height && width > maxSide){ height = Math.round(height * maxSide / width); width = maxSide; }
        else if(height >= width && height > maxSide){ width = Math.round(width * maxSide / height); height = maxSide; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        canvas.toBlob((blob) => resolve({ dataUrl, blob }), 'image/jpeg', quality);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function uploadFoto(codigo, compressed){
  if(state.backendMode === 'firebase'){
    const path = `productos/${codigo}/${Date.now()}.jpg`;
    await storage.ref(path).put(compressed.blob);
    return await storage.ref(path).getDownloadURL();
  }
  return compressed.dataUrl;
}

        return `<div class="ocr-row ${dup ? 'dup' : ''}">

              <input value="${esc(r.etiquetasTexto || '')}" placeholder="ej: Socio A" list="etiquetasList" data-change="ocrEtiquetas" data-i="${i}">
            </label>
            <label class="col-span2">Foto (opcional ahora, se puede agregar después desde "Agregar foto")
              <input type="file" accept="image/*" capture="environment" data-change="ocrFoto" data-i="${i}">
              ${r.fotoPreview ? `<img src="${r.fotoPreview}" class="row-foto-preview">` : ''}

        </div>`;
      }).join('')}
    </div>
    <div class="ocr-footer-actions">
      <button class="btn" data-action="ocrAgregarFilaVacia">+ Agregar línea manual</button>
      <button class="btn btn-primary" data-action="ocrGuardarTodo">Guardar todas las filas en el catálogo →</button>

Object.assign(actions, {
  ocrElegirImagen(){ document.getElementById('ocr_file').click(); },
  ocrZoom(el){ el.classList.toggle('zoomed'); el.style.maxWidth = el.classList.contains('zoomed') ? 'none' : '100%'; },
  async ocrProcesar(){
    state.ocr.processing = true; state.ocr.progress = 0; render();
    const apiKey = getVisionApiKey();
    try{
      let text;
      if(apiKey){
        text = await runVisionOcr(state.ocr.imageDataUrl, apiKey);
      } else {
        text = await runOcrOnImage(state.ocr.imageDataUrl, (pct) => {
          state.ocr.progress = pct;
          const bar = document.querySelector('.progress-bar .fill');
          if(bar) bar.style.width = pct + '%';
        });
      }
      state.ocr.rawText = text;
      state.ocr.rows = parseCuadernoText(text).map(r => Object.assign(r, { etiquetasTexto: '', fotoPreview: null, fotoCompressed: null }));
      state.ocr.processing = false;
      if(!state.ocr.rows.length) toast('No se detectaron filas automáticamente. Mirá abajo lo que reconoció el OCR, o cargá las líneas a mano con "+ Agregar línea manual".');
      render();
    }catch(err){
      console.error(err);
      state.ocr.processing = false;
      toast(apiKey ? ('Error de Google Cloud Vision: ' + err.message) : 'No se pudo procesar la imagen.');
      render();
    }
  },
  ocrQuitarFila(el){ state.ocr.rows.splice(Number(el.dataset.i), 1); render(); },
  ocrAgregarFilaVacia(){ state.ocr.rows.push({ codigo: '', nombre: '', categoria: '', precio: 0, moneda: 'ARS', porUnidad: false, etiquetasTexto: '', fotoPreview: null, fotoCompressed: null }); render(); },
  ocrReiniciar(){ state.ocr = { imageDataUrl: null, imageName: '', processing: false, progress: 0, rows: [] }; render(); },
  async ocrGuardarTodo(){
    const rows = state.ocr.rows.filter(r => r.codigo && r.nombre);
    if(!rows.length){ toast('No hay filas completas (código + descripción) para guardar.'); return; }
    for(const r of rows){
      const existing = state.productos.find(p => p.codigo === r.codigo);
      let fotos = existing ? (existing.fotos || []) : [];
      if(r.fotoCompressed){ fotos = [await uploadFoto(r.codigo, r.fotoCompressed)]; }
      const etiquetas = String(r.etiquetasTexto || '').split(',').map(s => s.trim()).filter(Boolean);
      etiquetas.forEach(t => { if(!state.etiquetas.includes(t)) state.etiquetas.push(t); });
      await saveProducto({
        codigo: r.codigo, nombre: r.nombre, categoria: r.categoria || '', precio: Number(r.precio) || 0,
        moneda: r.moneda, porUnidad: !!r.porUnidad, etiquetas,
        estado: (existing && existing.estado) || 'disponible',
        fotos, origenOCR: true
      });
    }
    await saveEtiquetas(state.etiquetas);
    toast(rows.length + ' producto(s) guardados.');
    state.ocr = { imageDataUrl: null, imageName: '', processing: false, progress: 0, rows: [] };
    render();
  }
});
inputActions.ocrPageFile = (el) => {
  const file = el.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => { state.ocr = { imageDataUrl: reader.result, imageName: file.name, processing: false, progress: 0, rows: [] }; render(); };
  reader.readAsDataURL(file);
};
inputActions.ocrCodigo = (el) => { state.ocr.rows[Number(el.dataset.i)].codigo = el.value.trim(); };
inputActions.ocrNombre = (el) => { state.ocr.rows[Number(el.dataset.i)].nombre = el.value; };
inputActions.ocrCategoria = (el) => { state.ocr.rows[Number(el.dataset.i)].categoria = el.value; };
inputActions.ocrPrecio = (el) => { state.ocr.rows[Number(el.dataset.i)].precio = Number(el.value) || 0; };
inputActions.ocrMoneda = (el) => { state.ocr.rows[Number(el.dataset.i)].moneda = el.value; };
inputActions.ocrPorUnidad = (el) => { state.ocr.rows[Number(el.dataset.i)].porUnidad = el.checked; };
inputActions.ocrEtiquetas = (el) => { state.ocr.rows[Number(el.dataset.i)].etiquetasTexto = el.value; };
inputActions.ocrFoto = async (el) => {

  state.ocr.rows[i].fotoCompressed = compressed;

  render();
};

Object.assign(actions, {
  fotoBuscar(){
    const codigo = state.fotoBusqueda.codigo.trim();
    state.fotoBusqueda.producto = state.productos.find(x => x.codigo === codigo) || null;
    state.fotoBusqueda.buscado = true;
    state.fotoBusqueda.previewUrl = null;
    state.fotoBusqueda.compressed = null;
    render();
  },
  async fotoSubir(){
    const f = state.fotoBusqueda;
    if(!f.compressed){ toast('Elegí una foto primero.'); return; }
    f.uploading = true; render();
    const url = await uploadFoto(f.producto.codigo, f.compressed);
    await saveProducto(Object.assign({}, f.producto, { fotos: [url] }));
    f.producto = state.productos.find(p => p.codigo === f.producto.codigo);
    f.uploading = false; f.compressed = null; f.previewUrl = null;
    toast('Foto guardada.');
    render();
  }
});
inputActions.fotoBuscarCodigo = (el) => { state.fotoBusqueda.codigo = el.value; };

  if(!file) return;
  const compressed = await compressImageFile(file);
  state.fotoBusqueda.compressed = compressed;
  state.fotoBusqueda.previewUrl = compressed.dataUrl;
  render();
};

function estadoBadgeHtml(estado){
  if(estado === 'reservado') return `<span class="estado-flag reservado">Reservado</span>`;
  if(estado === 'vendido') return `<span class="estado-flag vendido">Vendido</span>`;
  return '';
}
function pCardHtml(p){
  const foto = p.fotos && p.fotos[0];
  const img = foto ? `<img src="${esc(foto)}" alt="${esc(p.nombre)}" loading="lazy">` : `<div class="noimg">◈</div>`;
  return `<div class="p-card" data-action="verDetalle" data-codigo="${esc(p.codigo)}">
    <div class="p-card-img">${img}${estadoBadgeHtml(p.estado)}</div>

      <p class="p-card-title">${esc(p.nombre)}</p>
      <div class="p-card-meta">
        <span class="badge">#${esc(p.codigo)}</span>
        <span class="price">${formatMoney(p.precio, p.moneda)}${p.porUnidad ? ' c/u' : ''}</span>
      </div>
    </div>
  </div>`;
}
function buscarFiltrados(){
  const b = state.buscar;
  const q = b.search.trim().toLowerCase();
  return state.productos
    .filter(p => b.categoria === 'Todas' || (p.categoria || '') === b.categoria)
    .filter(p => !q || [p.codigo, p.nombre, p.categoria].join(' ').toLowerCase().includes(q))
    .sort((a, b2) => a.codigo.localeCompare(b2.codigo, undefined, { numeric: true }));
}
function renderProductos(){
  const b = state.buscar;
  const list = buscarFiltrados();
  document.getElementById('content').innerHTML = `

  verDetalle(el){
    state.detalleCodigo = el.dataset.codigo;
    renderDetalle();
    document.getElementById('overlay').classList.add('show');
    document.getElementById('detail').classList.add('show');
  },
  cerrarDetalle(){
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('detail').classList.remove('show');
  },
  async detalleEliminar(){
    const p = state.productos.find(x => x.codigo === state.detalleCodigo);
    if(!p) return;
    if(!confirm('¿Eliminar este producto del catálogo?')) return;
    await deleteProducto(p.codigo);
    state.productos = state.productos.filter(x => x.codigo !== p.codigo);
    actions.cerrarDetalle();
    if(state.tab === 'productos') renderProductos();
  },
  async catAgregar(){
    const el = document.getElementById('catNueva'); const v = el.value.trim();
    if(!v || state.categorias.includes(v)) return;
    state.categorias.push(v); await saveCategorias(state.categorias); render();
  },
  async catQuitar(el){ state.categorias.splice(Number(el.dataset.i), 1); await saveCategorias(state.categorias); render(); },
  async etqAgregar(){
    const el = document.getElementById('etqNueva'); const v = el.value.trim();
    if(!v || state.etiquetas.includes(v)) return;
    state.etiquetas.push(v); await saveEtiquetas(state.etiquetas); render();
  },
  async etqQuitar(el){ state.etiquetas.splice(Number(el.dataset.i), 1); await saveEtiquetas(state.etiquetas); render(); }
});
inputActions.buscarTexto = (el) => { state.buscar.search = el.value; renderProductos(); };

  const p = state.productos.find(x => x.codigo === state.detalleCodigo);

      ${state.backendMode === 'firebase' ? `<button class="btn btn-ghost" data-action="volverModoLocal" style="margin-top:8px;">Volver a modo local</button>` : ''}
    </div>
    <div class="card" style="max-width:560px; margin-top:18px;">
      <p><b>OCR de "Escanear cuaderno":</b> ${getVisionApiKey() ? '🟢 Google Cloud Vision configurado' : '🟡 Usando Tesseract (lee muy mal esta letra manuscrita)'}</p>
      <p class="muted" style="font-size:13px;">Tesseract (el motor que trae el navegador, gratis y sin configurar nada) casi no reconoce los códigos de este cuaderno — se probó con fotos reales y falló incluso mejorando la imagen. Google Cloud Vision lee manuscrito mucho mejor y tiene cuota gratis mensual, pero hay que crear un proyecto de Google Cloud con facturación habilitada (no se cobra nada dentro de la cuota gratis) y generar una clave de API: <a href="https://console.cloud.google.com/apis/library/vision.googleapis.com" target="_blank" rel="noopener">console.cloud.google.com</a> → crear/elegir proyecto → habilitar "Cloud Vision API" → Credenciales → Crear credenciales → Clave de API. Por seguridad, restringí esa clave a la API "Cloud Vision API" solamente.</p>
      <label>Pegar clave de API de Google Cloud Vision
        <input id="visionKeyInput" value="${esc(getVisionApiKey())}" placeholder="AIza...">
      </label>
      <button class="btn btn-primary" data-action="guardarVisionKey">Guardar clave</button>
      ${getVisionApiKey() ? `<button class="btn btn-ghost" data-action="quitarVisionKey" style="margin-top:8px;">Quitar clave (volver a Tesseract)</button>` : ''}
    </div>`;
}
Object.assign(actions, {
  guardarFirebaseConfig(){
    const raw = document.getElementById('fbConfigInput').value.trim();
    if(!raw){ toast('Pegá el firebaseConfig primero.'); return; }
    let cfg;
    try{
      const cleaned = raw.replace(/^\s*(const|let|var)\s+\w+\s*=\s*/, '').replace(/;\s*$/, '');
      cfg = new Function('return (' + cleaned + ')')();
    }catch(e){ toast('No se pudo leer ese config. Revisá que sea el objeto completo.'); return; }
    if(!cfg || !cfg.projectId){ toast('Ese config no parece válido (falta projectId).'); return; }
    localStorage.setItem(FIREBASE_CONFIG_KEY, JSON.stringify(cfg));
    toast('Config guardada. Recargando…');
    setTimeout(() => location.reload(), 800);
  },
  volverModoLocal(){
    if(!confirm('¿Volver a modo local? Vas a dejar de ver los datos de Firebase desde acá.')) return;
    localStorage.removeItem(FIREBASE_CONFIG_KEY);
    location.reload();
  },
  guardarVisionKey(){
    const v = document.getElementById('visionKeyInput').value.trim();
    if(!v){ toast('Pegá la clave de API primero.'); return; }
    localStorage.setItem(VISION_API_KEY_KEY, v);
    toast('Clave guardada. Escaneá una página para probarla.');
    render();
  },
  quitarVisionKey(){
    localStorage.removeItem(VISION_API_KEY_KEY);
    toast('Clave quitada. Vuelve a usar Tesseract.');
    render();
  }
});

/* ===================== Init ===================== */
function updateNavActive(){
  document.querySelectorAll('[data-tab]').forEach(el => el.classList.toggle('active', el.dataset.tab === state.tab));
}
function updateBackendBadge(){
  const el = document.getElementById('backendBadge');
  if(!el) return;
  el.innerHTML = state.backendMode === 'firebase'
    ? `<span class="dot"></span> Conectado`
    : `<span class="dot local"></span> Modo local (prueba)`;
}
function render(){
  updateNavActive();
  updateBackendBadge();
  if(state.tab === 'escanear') renderEscanear();
  else if(state.tab === 'fotos') renderFotos();
  else if(state.tab === 'productos') renderProductos();
  else if(state.tab === 'config') renderConfig();
}
async function init(){
  // ⚙ Configuración queda sin pestaña visible en el menú (ahí se ve la clave de Vision y se puede
  // cambiar a que Firebase apunta la app) — se llega solo entrando directo a index.html#config.
  if(location.hash === '#config') state.tab = 'config';
  initBackend();
  await loadAll();
  render();
}
init();
</script>
</body>
</html>
