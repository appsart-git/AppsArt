name: Qualitron — Deploy Cloud Functions

on:
  push:
    branches: [main]
    paths:
      - "alberdi-qualitron-src/functions/**"
      - "alberdi-qualitron-src/firebase.json"
      - "alberdi-qualitron-src/.firebaserc"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alberdi-qualitron-src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias de la Cloud Function
        working-directory: alberdi-qualitron-src/functions
        run: npm install

      - name: Guardar credencial de Firebase
        run: echo '${{ secrets.QUALITRON_FIREBASE_SERVICE_ACCOUNT }}' > /tmp/qualitron-service-account.json

      - name: Configurar clave de Anthropic en Secret Manager
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/qualitron-service-account.json
        run: printf '%s' "${{ secrets.QUALITRON_ANTHROPIC_API_KEY }}" | npx firebase-tools functions:secrets:set ANTHROPIC_API_KEY --project appsart-qualitron --data-file - --force

      - name: Deploy de las Cloud Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/qualitron-service-account.json
        run: npx firebase-tools deploy --only functions --project appsart-qualitron --non-interactive --force
