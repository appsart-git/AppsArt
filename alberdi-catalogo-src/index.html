<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo de Productos - Alberdi</title>
<meta name="theme-color" content="#14171A">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#14171A; --surface:#1D2126; --surface-2:#262B32; --border:#2E343C;
    --text:#ECEDEF; --text-muted:#8B92A0; --text-faint:#5C6470;
    --brand:#898A8D; --accent:#E8A33D; --accent-ink:#1A1305; --accent-soft:rgba(232,163,61,.16);
    --green:#4C8B5A; --red:#E15252;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font);
    -webkit-font-smoothing:antialiased; min-height:100vh; padding-bottom:24px;
  }
  img{max-width:100%; display:block;}
  button{font-family:inherit;}
  input{font-family:inherit;}
  ::placeholder{color:var(--text-faint);}

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--surface);
    border-bottom:1px solid var(--border); padding:12px 14px 10px;
  }
  .topbar-inner{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px;}
  .brand{display:flex; align-items:center; gap:8px;}
  .brand-logo{line-height:1;}
  .brand-logo .marca-sub{display:block; font-size:10.5px; font-weight:500; color:var(--brand); letter-spacing:.02em; margin:0 0 1px 2px;}
  .brand-logo .marca-main{font-size:21px; font-weight:800; color:var(--brand); letter-spacing:-0.01em;}
  .brand-logo .marca-main .dot{display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--brand); margin-left:3px; vertical-align:top; margin-top:3px;}
  .brand-logo small{display:block; font-size:11px; font-weight:500; color:var(--text-muted); margin-top:2px;}
  .filters-btn{
    display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); padding:9px 13px; border-radius:10px; font-size:13.5px; font-weight:600; cursor:pointer;
    white-space:nowrap;
  }
  .filters-btn .count{
    background:var(--accent); color:var(--accent-ink); border-radius:20px; font-size:11px; padding:1px 7px; font-weight:700;
  }
  .search-row{position:relative; margin-bottom:10px;}
  .search-row input{
    width:100%; padding:11px 14px 11px 36px; border-radius:11px; border:1px solid var(--border);
    background:var(--surface-2); font-size:14.5px; color:var(--text);
  }
  .search-row input:focus{outline:2px solid var(--accent); outline-offset:0; background:var(--surface);}
  .search-icon{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.55; font-size:15px; pointer-events:none;}
  .coleccion-tabs{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none;}
  .coleccion-tabs::-webkit-scrollbar{display:none;}
  .tab-chip{
    flex:none; padding:8px 14px; border-radius:20px; border:1px solid var(--border); background:var(--surface);
    color:var(--text-muted); font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .tab-chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

  .active-filters{display:flex; gap:6px; flex-wrap:wrap; padding:10px 14px 0;}
  .active-filters:empty{display:none;}
  .af-chip{
    display:flex; align-items:center; gap:6px; background:var(--accent-soft); color:var(--accent);
    border-radius:20px; padding:5px 10px 5px 12px; font-size:12.5px; font-weight:600;
  }
  .af-chip button{background:none; border:none; color:var(--accent); cursor:pointer; font-size:14px; line-height:1; padding:0;}
  .clear-all{background:none; border:none; color:var(--text-muted); font-size:12.5px; text-decoration:underline; cursor:pointer; padding:5px 4px;}

  .result-count{padding:12px 14px 6px; font-size:12.5px; color:var(--text-muted); font-weight:600;}

  /* ---------- Grid ---------- */
  .grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:12px; padding:6px 14px 14px;
    max-width:1200px; margin:0 auto;
  }
  @media (min-width:640px){ .grid{grid-template-columns:repeat(3,1fr);} }
  @media (min-width:900px){ .grid{grid-template-columns:repeat(4,1fr); gap:16px; padding:6px 24px 24px;} }
  @media (min-width:1200px){ .grid{grid-template-columns:repeat(5,1fr);} }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    overflow:hidden; cursor:pointer; text-align:left; padding:0; transition:box-shadow .15s, transform .15s;
  }
  .card:active{transform:scale(.98);}
  .card:hover{box-shadow:0 4px 16px rgba(0,0,0,.06);}
  .card-img{width:100%; aspect-ratio:1/1; background:var(--surface-2); overflow:hidden; position:relative;}
  .card-img img{width:100%; height:100%; object-fit:cover;}
  .card-img .noimg{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    color:var(--text-faint); font-size:28px;
  }
  .card-body{padding:9px 10px 11px;}
  .card-title{font-size:12.5px; font-weight:700; line-height:1.25; margin:0 0 4px; color:var(--text);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .card-meta{display:flex; flex-wrap:wrap; gap:4px;}
  .badge{font-size:10.5px; font-weight:600; background:var(--surface-2); color:var(--text-muted); border-radius:6px; padding:2px 6px;}

  .empty-state{padding:60px 20px; text-align:center; color:var(--text-muted);}
  .empty-state .big{font-size:34px; margin-bottom:8px;}

  .load-more{display:block; margin:6px auto 20px; padding:11px 22px; border-radius:11px; border:1px solid var(--border);
    background:var(--surface); color:var(--accent); font-weight:700; font-size:13.5px; cursor:pointer;}

  /* ---------- Sheet (filtros) ---------- */
  .overlay{position:fixed; inset:0; background:rgba(30,26,20,.4); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s;}
  .overlay.show{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41; background:var(--surface);
    border-radius:20px 20px 0 0; max-height:82vh; display:flex; flex-direction:column;
    transform:translateY(100%); transition:transform .25s ease; box-shadow:0 -8px 30px rgba(0,0,0,.15);
  }
  .sheet.show{transform:translateY(0);}
  @media (min-width:720px){
    .sheet{ left:50%; right:auto; bottom:auto; top:50%; width:520px; max-width:92vw;
      transform:translate(-50%,-46%) scale(.96); opacity:0; border-radius:18px; max-height:80vh;}
    .sheet.show{transform:translate(-50%,-50%) scale(1); opacity:1;}
  }
  .sheet-handle{width:38px; height:4px; background:var(--border); border-radius:3px; margin:10px auto 4px; flex:none;}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; padding:8px 18px 12px; border-bottom:1px solid var(--border); flex:none;}
  .sheet-head h3{margin:0; font-size:16px;}
  .sheet-head button{background:none; border:none; font-size:13px; font-weight:700; color:var(--accent); cursor:pointer;}
  .sheet-body{overflow-y:auto; padding:6px 18px 10px; flex:1;}
  .filter-group{margin:14px 0;}
  .filter-group h4{margin:0 0 8px; font-size:12.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted);}
  .filter-group .opts{display:flex; flex-wrap:wrap; gap:7px;}
  .opt-chip{padding:7px 12px; border-radius:18px; border:1px solid var(--border); background:var(--surface);
    color:var(--text); font-size:12.5px; font-weight:600; cursor:pointer;}
  .opt-chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .sheet-foot{padding:12px 18px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--border); flex:none;}
  .btn-primary{width:100%; padding:13px; border-radius:12px; border:none; background:var(--accent); color:var(--accent-ink); font-size:14.5px; font-weight:700; cursor:pointer;}
  .btn-primary:disabled{opacity:.5; cursor:default;}

  .admin-p{font-size:13px; color:var(--text-muted); line-height:1.5; margin:0 0 14px;}
  .admin-input{
    width:100%; padding:12px 14px; border-radius:11px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:15px; margin-bottom:12px;
  }
  .admin-error{background:rgba(225,82,82,.12); color:var(--red); border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:12px;}
  .admin-file{
    position:relative; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px;
    border:1.5px dashed var(--border); border-radius:12px; padding:28px 16px; text-align:center;
    color:var(--text-muted); font-size:13px; cursor:pointer; margin-bottom:14px;
  }
  .admin-file input[type="file"]{
    position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer;
  }
  .admin-file b{color:var(--text); font-size:14px;}
  .diff-summary{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px;}
  .diff-stat{background:var(--surface-2); border-radius:11px; padding:12px 8px; text-align:center;}
  .diff-stat .n{font-size:20px; font-weight:800; color:var(--text);}
  .diff-stat .l{font-size:11px; color:var(--text-muted); margin-top:2px;}
  .diff-list{max-height:180px; overflow-y:auto; border:1px solid var(--border); border-radius:11px; padding:4px 12px; margin-bottom:14px;}
  .diff-list p{font-size:12.5px; padding:6px 0; border-bottom:1px solid var(--border); margin:0;}
  .diff-list p:last-child{border-bottom:none;}
  .admin-note{font-size:12px; color:var(--text-faint); line-height:1.5; margin:10px 0 4px;}
  .admin-spinner{text-align:center; padding:30px 0; color:var(--text-muted); font-size:13px;}

  /* ---------- Detail modal ---------- */
  .detail{
    position:fixed; inset:0; z-index:50; background:var(--surface); display:flex; flex-direction:column;
    transform:translateX(100%); transition:transform .22s ease;
  }
  .detail.show{transform:translateX(0);}
  @media (min-width:720px){
    .detail{ inset:auto; left:50%; top:50%; width:640px; max-width:92vw; max-height:86vh;
      transform:translate(-50%,-46%) scale(.97); opacity:0; border-radius:18px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.25);}
    .detail.show{transform:translate(-50%,-50%) scale(1); opacity:1;}
  }
  .detail-head{position:relative; flex:none;}
  .detail-img{width:100%; aspect-ratio:4/3; background:var(--surface-2); overflow:hidden;}
  .detail-img img{width:100%; height:100%; object-fit:cover;}
  .detail-img .noimg{width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:44px;}
  .detail-close{
    position:absolute; top:12px; right:12px; width:34px; height:34px; border-radius:50%;
    background:rgba(0,0,0,.45); color:#fff; border:none; font-size:17px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .detail-body{overflow-y:auto; padding:16px 18px calc(20px + env(safe-area-inset-bottom));}
  .detail-title{font-size:18px; font-weight:800; margin:0 0 3px;}
  .detail-sub{color:var(--text-muted); font-size:13px; margin:0 0 14px;}
  .spec-table{width:100%; border-collapse:collapse;}
  .spec-table tr{border-bottom:1px solid var(--border);}
  .spec-table tr:last-child{border-bottom:none;}
  .spec-table td{padding:9px 0; font-size:13px; vertical-align:top;}
  .spec-table td:first-child{color:var(--text-muted); width:46%; font-weight:600;}
  .spec-table td:last-child{color:var(--text); text-align:right; font-weight:600;}

  .app-footer{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    padding:22px 14px calc(26px + env(safe-area-inset-bottom)); opacity:.85;
  }
  .app-footer span{font-size:12px; color:var(--text-muted);}
  .app-footer .appsart-logo{height:34px; width:auto; display:block;}

  .hidden{display:none !important;}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><div class="brand-logo">
      <span class="marca-sub">cerámica</span>
      <span class="marca-main">Alberdi<i class="dot"></i></span>
      <small id="brandSub">cargando…</small>
    </div></div>
    <div style="display:flex; gap:8px;">
      <button class="filters-btn" data-action="open-admin" title="Actualizar base de datos">⇪</button>
      <button class="filters-btn" data-action="open-filters">⚙ Filtros <span class="count hidden" id="filterCount">0</span></button>
    </div>
  </div>
  <div class="search-row">
    <span class="search-icon">🔎</span>
    <input id="search" placeholder="Buscar por línea, producto o código…" autocomplete="off">
  </div>
  <div class="coleccion-tabs" id="coleccionTabs"></div>
</header>

<div class="active-filters" id="activeFilters"></div>
<div class="result-count" id="resultCount"></div>

<main class="grid" id="grid"></main>
<button class="load-more hidden" id="loadMoreBtn">Ver más productos</button>

<footer class="app-footer">
  <span>App desarrollada por</span>
  <img src="./appsart-brand.png" alt="AppsArt" class="appsart-logo">
</footer>

<div class="overlay" id="overlay"></div>

<div class="sheet" id="filterSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h3>Filtros</h3>
    <button data-action="reset-filters">Limpiar todo</button>
  </div>
  <div class="sheet-body" id="filterBody"></div>
  <div class="sheet-foot">
    <button class="btn-primary" data-action="apply-filters">Ver resultados</button>
  </div>
</div>

<div class="detail" id="detail">
  <div class="detail-head">
    <div class="detail-img" id="detailImg"></div>
    <button class="detail-close" data-action="close-detail">✕</button>
  </div>
  <div class="detail-body">
    <h2 class="detail-title" id="detailTitle"></h2>
    <p class="detail-sub" id="detailSub"></p>
    <table class="spec-table" id="detailSpecs"></table>
  </div>
</div>

<div class="overlay" id="adminOverlay"></div>
<div class="sheet" id="adminPanel">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h3>Actualizar base de datos</h3>
    <button data-action="close-admin">Cerrar</button>
  </div>
  <div class="sheet-body" id="adminBody"></div>
</div>

<script>
'use strict';

const firebaseConfig = {
  apiKey: "AIzaSyBbyTSnTekMkXOZOAZEV0SQzk46NqkyaSA",
  authDomain: "de-r-13.firebaseapp.com",
  projectId: "de-r-13",
  storageBucket: "de-r-13.firebasestorage.app",
  messagingSenderId: "79165446593",
  appId: "1:79165446593:web:19719e556144c227833740"
};
let db = null, auth = null;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  auth = firebase.auth();
} catch (e) { console.warn('Firebase no disponible, uso datos locales.', e); }

const ADMIN_EMAIL = 'admin@catalogo-alberdi.app';

const FILTERABLE = [
  { key:'formato', label:'Formato' },
  { key:'terminacion', label:'Terminación' },
  { key:'tipologia', label:'Tipología' },
  { key:'color', label:'Color' }
];

const SPEC_LABELS = {
  formato:'Formato', tecnologia:'Tecnología', coleccion:'Colección', linea:'Línea',
  producto:'Producto', color:'Color', terminacion:'Terminación', codigo:'Código',
  absorcion_agua:'Absorción de agua', resistencia_flexion:'Resistencia a la flexión',
  bordes:'Bordes', tipologia:'Tipología', granilla:'Granilla', goteado:'Goteado',
  low_slip:'Low Slip', proteccion:'Protección', cubierta_esmalte:'Cubierta de esmalte',
  espesor:'Espesor (mm)', uso_grupo:'Uso grupo', recomendacion_uso:'Recomendación de uso',
  tonalidad:'Tonalidad', cantidad_caras:'Cantidad de caras', microrelieve:'Microrelieve',
  estructura_relieve:'Estructura (relieve)', horno:'Horno', observaciones:'Observaciones',
  patron:'Patrón'
};
const SPEC_ORDER = Object.keys(SPEC_LABELS).filter(k => !['formato','coleccion','linea','producto','color'].includes(k));

let ALL = [];
let COLECCIONES = [];
let state = {
  search:'', coleccion:'Todas',
  filters:{ formato:new Set(), terminacion:new Set(), tipologia:new Set(), color:new Set() },
  pendingFilters:null,
  pageSize:30, shown:30
};

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// La planilla tiene mayúsculas inconsistentes ("allpa"/"Allpa", "20 x 80"/"20 X 80").
// Normalizamos para agrupar y comparar sin duplicar opciones de filtro.
const CANON_FIELDS = new Set(['coleccion','formato','terminacion','tipologia','color']);
function canon(s){
  s = String(s ?? '').trim();
  if(!s) return s;
  const lower = s.toLowerCase();
  return lower.charAt(0).toUpperCase() + lower.slice(1);
}
function val(p, key){
  const v = p[key];
  return CANON_FIELDS.has(key) ? canon(v) : v;
}

function applyProducts(raw){
  ALL = raw.filter(p => (p.estado || '').toUpperCase() === 'ALTA').sort((a,b) => a.id - b.id);
  COLECCIONES = uniqueSorted(ALL, 'coleccion');
  document.getElementById('brandSub').textContent = ALL.length + ' productos vigentes';
  renderColeccionTabs();
  render();
}

async function init(){
  const res = await fetch('./data/productos.json');
  const raw = await res.json();
  applyProducts(raw);
  bindEvents();

  if (db) {
    db.collection('productos').onSnapshot(
      (snap) => {
        const live = snap.docs.map(d => d.data());
        if (live.length) applyProducts(live);
      },
      (err) => console.warn('Sin conexión a Firestore, sigo con datos locales.', err)
    );
  }
}

function uniqueSorted(list, key){
  const set = new Set();
  list.forEach(p => { const v = val(p,key).trim ? val(p,key).trim() : val(p,key); if(v) set.add(v); });
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'es'));
}

function renderColeccionTabs(){
  const el = document.getElementById('coleccionTabs');
  const tabs = ['Todas', ...COLECCIONES];
  el.innerHTML = tabs.map(c =>
    `<button class="tab-chip ${c===state.coleccion?'active':''}" data-coleccion="${esc(c)}">${esc(c)}</button>`
  ).join('');
}

function matchesFilters(p){
  if(state.coleccion !== 'Todas' && val(p,'coleccion') !== state.coleccion) return false;
  for(const f of FILTERABLE){
    const set = state.filters[f.key];
    if(set.size && !set.has(val(p,f.key))) return false;
  }
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    const hay = [p.producto,p.linea,p.codigo,p.color].join(' ').toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function getFiltered(){
  return ALL.filter(matchesFilters);
}

function render(){
  const list = getFiltered();
  renderActiveFilters();
  document.getElementById('resultCount').textContent =
    list.length + (list.length===1 ? ' producto encontrado' : ' productos encontrados');

  const visible = list.slice(0, state.shown);
  const grid = document.getElementById('grid');
  if(!visible.length){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="big">🔍</div>No encontramos productos con esos filtros.</div>`;
  } else {
    grid.innerHTML = visible.map(cardHtml).join('');
  }
  const loadMore = document.getElementById('loadMoreBtn');
  loadMore.classList.toggle('hidden', list.length <= visible.length);
}

function cardHtml(p){
  const img = p.imagen
    ? `<img src="./images/${esc(p.imagen)}" alt="${esc(p.producto)}" loading="lazy">`
    : `<div class="noimg">◈</div>`;
  return `<button class="card" data-id="${p.id}">
    <div class="card-img">${img}</div>
    <div class="card-body">
      <p class="card-title">${esc(p.producto || p.linea)}</p>
      <div class="card-meta">
        ${p.formato ? `<span class="badge">${esc(val(p,'formato'))}</span>` : ''}
        ${p.color ? `<span class="badge">${esc(val(p,'color'))}</span>` : ''}
      </div>
    </div>
  </button>`;
}

function renderActiveFilters(){
  const chips = [];
  if(state.coleccion !== 'Todas'){
    chips.push({label:'Colección: '+state.coleccion, clear:()=>{state.coleccion='Todas';}});
  }
  for(const f of FILTERABLE){
    state.filters[f.key].forEach(v => {
      chips.push({label:f.label+': '+v, clear:()=>{state.filters[f.key].delete(v);}});
    });
  }
  const el = document.getElementById('activeFilters');
  if(!chips.length){ el.innerHTML=''; return; }
  el.innerHTML = chips.map((c,i)=>
    `<span class="af-chip">${esc(c.label)}<button data-clear="${i}">✕</button></span>`
  ).join('') + `<button class="clear-all" data-action="reset-filters">Limpiar todo</button>`;
  el.querySelectorAll('[data-clear]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      chips[+btn.dataset.clear].clear();
      renderColeccionTabs();
      state.shown = state.pageSize;
      render();
    });
  });
}

function openFilters(){
  state.pendingFilters = {
    formato:new Set(state.filters.formato), terminacion:new Set(state.filters.terminacion),
    tipologia:new Set(state.filters.tipologia), color:new Set(state.filters.color)
  };
  renderFilterSheet();
  document.getElementById('overlay').classList.add('show');
  document.getElementById('filterSheet').classList.add('show');
}
function closeFilters(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('filterSheet').classList.remove('show');
}

function renderFilterSheet(){
  const body = document.getElementById('filterBody');
  const baseList = ALL.filter(p => state.coleccion==='Todas' || val(p,'coleccion')===state.coleccion);
  body.innerHTML = FILTERABLE.map(f=>{
    const opts = uniqueSorted(baseList, f.key);
    if(!opts.length) return '';
    const activeSet = state.pendingFilters[f.key];
    return `<div class="filter-group">
      <h4>${esc(f.label)}</h4>
      <div class="opts">${opts.map(o=>
        `<button class="opt-chip ${activeSet.has(o)?'active':''}" data-fkey="${f.key}" data-fval="${esc(o)}">${esc(o)}</button>`
      ).join('')}</div>
    </div>`;
  }).join('');
  body.querySelectorAll('.opt-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const {fkey, fval} = chip.dataset;
      const set = state.pendingFilters[fkey];
      if(set.has(fval)) set.delete(fval); else set.add(fval);
      chip.classList.toggle('active');
    });
  });
}

function openDetail(p){
  const img = document.getElementById('detailImg');
  img.innerHTML = p.imagen
    ? `<img src="./images/${esc(p.imagen)}" alt="${esc(p.producto)}">`

  document.getElementById('detailSub').textContent =
    [val(p,'coleccion'), p.linea, p.codigo].filter(Boolean).join(' · ');
  const rows = SPEC_ORDER
    .filter(k => (p[k]||'').toString().trim())
    .map(k => `<tr><td>${esc(SPEC_LABELS[k])}</td><td>${esc(val(p,k))}</td></tr>`)
    .join('');

  document.getElementById('detail').classList.add('show');
}
function closeDetail(){
  document.getElementById('detail').classList.remove('show');
}

/* ===================== Actualizar base de datos ===================== */

const XLSX_KEY_MAP = {
  'ESTADO':'estado','MOTIVO':'motivo','FORMATO':'formato','TECNOLOGIA':'tecnologia',
  'COLECCION':'coleccion','IMAGEN':'imagen','C. P.':'cp','SRI':'sri','LINEA':'linea',
  'PRODUCTO':'producto','COLOR':'color','TERMINACION':'terminacion','CODIGO':'codigo',
  'ABSORCION DE AGUA':'absorcion_agua','RESISTENCIA A LA FLEXION':'resistencia_flexion',
  'BORDES':'bordes','TIPOLOGIA':'tipologia','GRANILLA':'granilla','GOTEADO':'goteado',
  'LOW SLIP':'low_slip','PROTECCION':'proteccion','CUBIERTA DE ESMALTE':'cubierta_esmalte',
  'ESPESOR':'espesor','USO GRUPO':'uso_grupo','RECOMENDACION DE USO':'recomendacion_uso',
  'TONALIDAD':'tonalidad','CANTIDAD DE CARAS':'cantidad_caras','MICRORELIEVE':'microrelieve',
  'ESTRUCTURA (RELIEVE)':'estructura_relieve','HORNO':'horno','INSUMOS OBSOLETOS':'insumos_obsoletos',
  'OBSERVACIONES':'observaciones','DESARROLLO':'desarrollo','APROBACION INDUSTRIAL':'aprobacion_industrial',
  'APROBACION COMERCIAL':'aprobacion_comercial','FECHA DE PEDIDO':'fecha_pedido','FECHA DE ALTA':'fecha_alta',
  'PATRON':'patron','ESTADO DE ALTA':'estado_alta'
};
function stripAccents(s){
  return String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '');
}
function normHeader(h){ return stripAccents(h).toUpperCase().replace(/\s+/g,' ').trim(); }
function normMatch(s){ return stripAccents(String(s ?? '')).toLowerCase().replace(/\s+/g,' ').trim(); }
function matchKey(p){ return [p.linea,p.color,p.terminacion,p.formato].map(normMatch).join('|'); }

const admin = { logged:false, rows:null, diff:null, existing:null };

function openAdmin(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('filterSheet').classList.remove('show');
  document.getElementById('adminOverlay').classList.add('show');
  document.getElementById('adminPanel').classList.add('show');
  renderAdmin();
}
function closeAdmin(){
  document.getElementById('adminOverlay').classList.remove('show');
  document.getElementById('adminPanel').classList.remove('show');
}

function renderAdmin(){
  if (!auth) { renderAdminError('Firebase no está disponible ahora mismo.'); return; }
  if (!admin.logged) return renderAdminLogin();
  if (!admin.diff) return renderAdminUpload();
  return renderAdminPreview();
}

function renderAdminError(msg){
  document.getElementById('adminBody').innerHTML = `<p class="admin-error">${esc(msg)}</p>`;
}

function renderAdminLogin(){
  document.getElementById('adminBody').innerHTML = `
    <p class="admin-p">Ingresá la clave para poder subir una planilla actualizada.</p>
    <input type="password" id="adminPin" class="admin-input" placeholder="Clave" autocomplete="off">
    <div id="adminLoginError"></div>
    <button class="btn-primary" data-action="do-login">Ingresar</button>
  `;
  document.getElementById('adminPin').focus();
}

async function doLogin(){
  const pin = document.getElementById('adminPin').value;
  if (!pin) return;
  const btn = document.querySelector('[data-action="do-login"]');
  btn.disabled = true; btn.textContent = 'Verificando…';
  try {
    await auth.signInWithEmailAndPassword(ADMIN_EMAIL, pin);
    admin.logged = true;
    renderAdmin();
  } catch (e) {
    document.getElementById('adminLoginError').innerHTML = `<p class="admin-error">Clave incorrecta.</p>`;
    btn.disabled = false; btn.textContent = 'Ingresar';
  }
}

function renderAdminUpload(){
  document.getElementById('adminBody').innerHTML = `
    <p class="admin-p">Subí el Excel de "Descripción y Registro de Productos" (hoja PRODUCTOS). Voy a comparar cada fila con lo que ya está cargado y te muestro los cambios antes de aplicar nada.</p>
    <div class="admin-file" id="adminDrop">
      <span>📄</span>
      <b>Elegir archivo .xlsx</b>
      <span>o arrastralo acá</span>
      <input type="file" id="adminFile" accept=".xlsx,.xls">
    </div>
    <div id="adminUploadStatus"></div>
    <p class="admin-note">Las fotos no se actualizan desde acá: los productos nuevos van a quedar sin foto hasta que se agreguen a mano.</p>
  `;
  const dropEl = document.getElementById('adminDrop');
  const fileInput = document.getElementById('adminFile');
  fileInput.addEventListener('change', (e) => {
    if (e.target.files[0]) handleFile(e.target.files[0]);
  });
  dropEl.addEventListener('dragover', (e) => { e.preventDefault(); });
  dropEl.addEventListener('drop', (e) => {
    e.preventDefault();
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
}

async function handleFile(file){
  const statusEl = document.getElementById('adminUploadStatus');
  statusEl.innerHTML = `<div class="admin-spinner">Leyendo planilla…</div>`;
  try {
    const rows = await parseExcelFile(file);
    statusEl.innerHTML = `<div class="admin-spinner">Comparando con la base actual…</div>`;
    const snap = await db.collection('productos').get();
    const existing = snap.docs.map(d => d.data());
    admin.diff = buildDiff(rows, existing);
    admin.existing = existing;
    renderAdmin();
  } catch (e) {
    console.error(e);
    statusEl.innerHTML = `<p class="admin-error">${esc(e.message || 'No pude leer el archivo.')}</p>`;
  }
}

function parseSheetRows(ws, sheetName){
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', blankrows: false });
  const headerRowIdx = rows.findIndex(r =>
    r.some(c => normHeader(c) === 'ESTADO') && r.some(c => normHeader(c) === 'PRODUCTO')
  );
  if (headerRowIdx === -1) return [];

  const headers = rows[headerRowIdx].map(h => normHeader(h));
  const dataRows = rows.slice(headerRowIdx + 1);

  const products = [];
  for (const r of dataRows) {
    const obj = {};
    let hasData = false;
    headers.forEach((h, i) => {
      if (!h) return;
      const key = XLSX_KEY_MAP[h] || h.toLowerCase().replace(/\s+/g, '_');
      const val = (r[i] ?? '').toString().trim();
      if (val) hasData = true;
      obj[key] = val;
    });
    if (hasData && (obj.linea || obj.producto)) products.push(obj);
  }
  return products;
}

async function parseExcelFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  const sheetName = wb.SheetNames[0];
  const products = parseSheetRows(wb.Sheets[sheetName], sheetName);
  if (!products.length) throw new Error('No encontré filas de productos con datos debajo del encabezado en la primera hoja ("' + sheetName + '").');
  return products;
}

function looseKey(p){ return [p.linea, p.color, p.terminacion].map(normMatch).join('|'); }

function buildDiff(rows, existing){
  // Algunos productos comparten línea+color+terminación+formato (variantes históricas/
  // en desarrollo de un mismo producto). Esos casos son ambiguos: no podemos saber con
  // certeza a cuál le corresponde cada fila del Excel, así que los dejamos sin tocar.
  const FIELDS = Object.values(XLSX_KEY_MAP).filter(f => f !== 'imagen');

  const existingKeyCounts = {};
  existing.forEach(p => { const k = matchKey(p); existingKeyCounts[k] = (existingKeyCounts[k] || 0) + 1; });
  const rowKeyCounts = {};
  rows.forEach(r => { const k = matchKey(r); rowKeyCounts[k] = (rowKeyCounts[k] || 0) + 1; });
  const byKey = new Map();
  existing.forEach(p => { const k = matchKey(p); if (existingKeyCounts[k] === 1) byKey.set(k, p); });

  // Filas sin FORMATO (dato faltante en el archivo, no en el catálogo): si hay un único
  // producto existente con esa línea+color+terminación, igual lo emparejamos con seguridad.
  const looseCounts = {};
  existing.forEach(p => { const k = looseKey(p); looseCounts[k] = (looseCounts[k] || 0) + 1; });
  const byLooseKey = new Map();
  existing.forEach(p => { const k = looseKey(p); if (looseCounts[k] === 1) byLooseKey.set(k, p); });

  const seen = new Set();
  const nuevos = [], actualizados = [], sinCambios = [], ambiguos = [];
  let nextId = existing.reduce((m, p) => Math.max(m, p.id || 0), 0) + 1;

  for (const row of rows) {
    const key = matchKey(row);
    if (existingKeyCounts[key] > 1 || rowKeyCounts[key] > 1) { ambiguos.push(row); continue; }

    let match = byKey.get(key);
    if (!match && !normMatch(row.formato)) {
      const lk = looseKey(row);
      if (looseCounts[lk] > 1) { ambiguos.push(row); continue; }
      match = byLooseKey.get(lk);
    }

    if (match) {
      seen.add(matchKey(match));
      // Un campo vacío en el Excel nuevo no borra un dato que ya existe: solo compara/
      // aplica los campos que realmente traen valor.
      const changed = FIELDS.some(f => normMatch(row[f]) && normMatch(row[f]) !== normMatch(match[f]));
      const merged = Object.assign({}, match);
      FIELDS.forEach(f => { if (normMatch(row[f])) merged[f] = row[f]; });
      merged.id = match.id;
      merged.imagen = match.imagen ?? null;
      if (changed) actualizados.push(merged); else sinCambios.push(merged);
    } else {
      nuevos.push(Object.assign({}, row, { id: nextId++, imagen: null }));
    }
  }
  const ausentes = existing.filter(p => existingKeyCounts[matchKey(p)] === 1 && !seen.has(matchKey(p)));
  return { nuevos, actualizados, sinCambios, ambiguos, ausentes };
}

function renderAdminPreview(){
  const d = admin.diff;
  const listHtml = (items, empty) => items.length
    ? items.slice(0, 60).map(p => `<p>${esc(p.producto || p.linea)}${p.formato ? ' · ' + esc(p.formato) : ''}</p>`).join('') + (items.length > 60 ? `<p class="admin-note">+${items.length - 60} más</p>` : '')
    : `<p class="admin-note">${empty}</p>`;

  document.getElementById('adminBody').innerHTML = `
    <div class="diff-summary">
      <div class="diff-stat"><div class="n">${d.nuevos.length}</div><div class="l">Nuevos</div></div>
      <div class="diff-stat"><div class="n">${d.actualizados.length}</div><div class="l">Modificados</div></div>
      <div class="diff-stat"><div class="n">${d.sinCambios.length}</div><div class="l">Sin cambios</div></div>
    </div>
    ${d.ausentes.length ? `<p class="admin-note">${d.ausentes.length} producto(s) que están en la base ya no aparecen en esta planilla. No los voy a tocar — si están discontinuados, marcalos como BAJA en el Excel.</p>` : ''}
    ${d.ambiguos.length ? `<p class="admin-note">${d.ambiguos.length} fila(s) tienen la misma línea + color + terminación + formato que otra (variantes en desarrollo/históricas). No puedo saber con certeza a cuál corresponde cada una, así que no las toco — hay que actualizarlas a mano en Firebase si hace falta.</p>` : ''}
    <h4 style="font-size:12.5px; text-transform:uppercase; color:var(--text-muted); margin:16px 0 8px;">Nuevos (${d.nuevos.length})</h4>
    <div class="diff-list">${listHtml(d.nuevos, 'Ninguno.')}</div>
    <h4 style="font-size:12.5px; text-transform:uppercase; color:var(--text-muted); margin:16px 0 8px;">Modificados (${d.actualizados.length})</h4>
    <div class="diff-list">${listHtml(d.actualizados, 'Ninguno.')}</div>
    ${d.ambiguos.length ? `<h4 style="font-size:12.5px; text-transform:uppercase; color:var(--text-muted); margin:16px 0 8px;">Ambiguos, sin tocar (${d.ambiguos.length})</h4><div class="diff-list">${listHtml(d.ambiguos, 'Ninguno.')}</div>` : ''}
    <div id="adminConfirmStatus"></div>
    <button class="btn-primary" data-action="cancel-diff" style="background:var(--surface-2); color:var(--text); margin-bottom:10px;">Cancelar</button>
    <button class="btn-primary" data-action="confirm-update" ${(d.nuevos.length + d.actualizados.length) === 0 ? 'disabled' : ''}>Confirmar actualización</button>
  `;
}

async function confirmUpdate(){
  const d = admin.diff;
  const statusEl = document.getElementById('adminConfirmStatus');
  const btn = document.querySelector('[data-action="confirm-update"]');
  btn.disabled = true;
  const toWrite = [...d.nuevos, ...d.actualizados];
  const CHUNK = 400;
  try {
    for (let i = 0; i < toWrite.length; i += CHUNK) {
      const batch = db.batch();
      toWrite.slice(i, i + CHUNK).forEach(p => {
        batch.set(db.collection('productos').doc('p' + p.id), p);
      });
      await batch.commit();
      statusEl.innerHTML = `<p class="admin-note">Subidos ${Math.min(i + CHUNK, toWrite.length)} / ${toWrite.length}…</p>`;
    }
    document.getElementById('adminBody').innerHTML = `
      <p class="admin-p"><b>¡Listo!</b> Se actualizaron ${toWrite.length} productos (${d.nuevos.length} nuevos, ${d.actualizados.length} modificados). El catálogo ya se actualizó solo.</p>
      <button class="btn-primary" data-action="close-admin">Cerrar</button>
    `;
  } catch (e) {
    console.error(e);
    statusEl.innerHTML = `<p class="admin-error">Hubo un error subiendo los cambios: ${esc(e.message)}</p>`;
    btn.disabled = false;
  }
}

function bindEvents(){
  document.getElementById('search').addEventListener('input', (e)=>{
    state.search = e.target.value;
    state.shown = state.pageSize;
    render();
  });

  document.getElementById('coleccionTabs').addEventListener('click', (e)=>{
    const btn = e.target.closest('[data-coleccion]');
    if(!btn) return;
    state.coleccion = btn.dataset.coleccion;
    state.shown = state.pageSize;
    renderColeccionTabs();
    render();
  });

  document.getElementById('loadMoreBtn').addEventListener('click', ()=>{
    state.shown += state.pageSize;
    render();
  });

  document.getElementById('grid').addEventListener('click', (e)=>{
    const card = e.target.closest('.card');
    if(!card) return;
    const p = ALL.find(x => x.id === +card.dataset.id);
    if(p) openDetail(p);
  });

  document.querySelector('[data-action="open-filters"]').addEventListener('click', openFilters);
  document.getElementById('overlay').addEventListener('click', closeFilters);
  document.querySelector('[data-action="apply-filters"]').addEventListener('click', ()=>{
    state.filters = state.pendingFilters;
    state.shown = state.pageSize;
    updateFilterCount();
    closeFilters();
    render();
  });
  document.querySelectorAll('[data-action="reset-filters"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.filters = { formato:new Set(), terminacion:new Set(), tipologia:new Set(), color:new Set() };
      state.pendingFilters = { formato:new Set(), terminacion:new Set(), tipologia:new Set(), color:new Set() };
      state.coleccion = 'Todas';
      state.shown = state.pageSize;
      renderColeccionTabs();
      updateFilterCount();
      renderFilterSheet();
      render();
    });
  });

  document.querySelector('[data-action="close-detail"]').addEventListener('click', closeDetail);

  document.querySelector('[data-action="open-admin"]').addEventListener('click', openAdmin);
  document.getElementById('adminOverlay').addEventListener('click', closeAdmin);
  document.getElementById('adminBody').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    if (action === 'do-login') doLogin();
    else if (action === 'close-admin') closeAdmin();
    else if (action === 'cancel-diff') { admin.diff = null; renderAdmin(); }
    else if (action === 'confirm-update') confirmUpdate();
  });
  document.getElementById('adminBody').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.id === 'adminPin') doLogin();
  });
}

function updateFilterCount(){
  let n = 0;
  FILTERABLE.forEach(f => n += state.filters[f.key].size);
  const el = document.getElementById('filterCount');
  el.textContent = n;
  el.classList.toggle('hidden', n===0);
}

init();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
