# FUENTE VERSIONADA de este workflow. GitHub Actions solo lee workflows desde
# .github/workflows/ en la RAÍZ REAL del repo (que no es esta carpeta local — el
# checkout local de AppsArt es solo el subárbol AppsArt/ del repo real). Copiar
# este archivo tal cual a:
#   .github/workflows/cuidahoy-deploy-functions.yml
# en la raíz real del repo (vía la interfaz web de GitHub: Add file → Create new
# file, o un clone aparte). Mismo patrón que
# AppsArt/asistente-redes/.github-workflow/asistente-redes-generar.yml.
name: CuidaHoy — Deploy Cloud Functions

on:
  push:
    paths:
      - "AppsArt/enfermeros-demo-src/functions/**"
      - "AppsArt/enfermeros-demo-src/firebase.json"
      - "AppsArt/enfermeros-demo-src/.firebaserc"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AppsArt/enfermeros-demo-src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias de la Cloud Function
        working-directory: AppsArt/enfermeros-demo-src/functions
        run: npm install

      - name: Guardar credencial de Firebase
        run: echo '${{ secrets.CUIDAHOY_FIREBASE_SERVICE_ACCOUNT }}' > /tmp/cuidahoy-service-account.json

      - name: Deploy de las Cloud Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/cuidahoy-service-account.json
        run: npx firebase-tools deploy --only functions --project cuidahoy-6442d --non-interactive --force
