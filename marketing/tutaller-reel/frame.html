<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#eceef0;overflow:hidden}iframe{border:0;display:block}</style></head>
<body><script>
const p = new URLSearchParams(location.search);
const f = document.createElement('iframe');
f.width = p.get('w') || 390; f.height = p.get('h') || 844;
p.delete('w'); p.delete('h');
f.src = '/index.html?' + p.toString();
document.body.appendChild(f);
</script></body></html>
