<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAC · Reclamos - Alberdi</title>
<meta name="theme-color" content="#14171A">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#14171A; --surface:#1D2126; --surface-2:#262B32; --border:#2E343C;
    --text:#ECEDEF; --text-muted:#8B92A0; --text-faint:#5C6470;
    --brand:#898A8D; --accent:#E8A33D; --accent-ink:#1A1305; --accent-soft:rgba(232,163,61,.16);
    --green:#4C8B5A; --red:#E15252;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font);
    -webkit-font-smoothing:antialiased; min-height:100vh; padding-bottom:24px;
  }
  img{max-width:100%; display:block;}
  button{font-family:inherit;}
  input{font-family:inherit;}
  ::placeholder{color:var(--text-faint);}

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--surface);
    border-bottom:1px solid var(--border); padding:12px 14px 10px;
  }
  .topbar-inner{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px;}
  .brand{display:flex; align-items:center; gap:8px;}
  .brand-logo{line-height:1;}
  .brand-logo .marca-sub{display:block; font-size:10.5px; font-weight:500; color:var(--brand); letter-spacing:.02em; margin:0 0 1px 2px;}
  .brand-logo .marca-main{font-size:21px; font-weight:800; color:var(--brand); letter-spacing:-0.01em;}
  .brand-logo .marca-main .dot{display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--brand); margin-left:3px; vertical-align:top; margin-top:3px;}
  .brand-logo small{display:block; font-size:11px; font-weight:500; color:var(--text-muted); margin-top:2px;}
  .topbar-actions{display:flex; gap:8px;}
  .icon-btn{
    display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); padding:9px 13px; border-radius:10px; font-size:13.5px; font-weight:600; cursor:pointer;
    white-space:nowrap;
  }
  .icon-btn .count{
    background:var(--accent); color:var(--accent-ink); border-radius:20px; font-size:11px; padding:1px 7px; font-weight:700;
  }
  .search-row{position:relative; margin-bottom:10px;}
  .search-row input{
    width:100%; padding:11px 14px 11px 36px; border-radius:11px; border:1px solid var(--border);
    background:var(--surface-2); font-size:14.5px; color:var(--text);
  }
  .search-row input:focus{outline:2px solid var(--accent); outline-offset:0; background:var(--surface);}
  .search-icon{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.55; font-size:15px; pointer-events:none;}

  .view-tabs, .coleccion-tabs{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none;}
  .view-tabs::-webkit-scrollbar, .coleccion-tabs::-webkit-scrollbar{display:none;}
  .tab-chip{
    flex:none; padding:8px 14px; border-radius:20px; border:1px solid var(--border); background:var(--surface);
    color:var(--text-muted); font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .tab-chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

  .active-filters{display:flex; gap:6px; flex-wrap:wrap; padding:10px 14px 0;}
  .active-filters:empty{display:none;}
  .af-chip{
    display:flex; align-items:center; gap:6px; background:var(--accent-soft); color:var(--accent);
    border-radius:20px; padding:5px 10px 5px 12px; font-size:12.5px; font-weight:600;
  }
  .af-chip button{background:none; border:none; color:var(--accent); cursor:pointer; font-size:14px; line-height:1; padding:0;}
  .drill-chip{display:inline-flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--accent-soft); color:var(--accent); border-radius:20px; padding:6px 8px 6px 13px; font-size:12.5px; font-weight:700;}
  .drill-chip button{background:var(--accent); color:var(--accent-ink); border:none; border-radius:14px; padding:3px 10px; font-size:11.5px; font-weight:800; cursor:pointer;}
  .clear-all{background:none; border:none; color:var(--text-muted); font-size:12.5px; text-decoration:underline; cursor:pointer; padding:5px 4px;}

  .result-count{padding:12px 14px 6px; font-size:12.5px; color:var(--text-muted); font-weight:600;}

  /* ---------- KPIs ---------- */
  .kpi-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; padding:6px 14px 4px; max-width:1200px; margin:0 auto;}
  @media (min-width:640px){ .kpi-grid{grid-template-columns:repeat(4,1fr);} }
  /* Segunda fila: reclamos por día hábil (total del período + un recuadro por trimestre) */
  .bd-grid:empty{display:none;}
  .bd-grid .bd-title{grid-column:1/-1; font-size:11.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-muted); margin-top:4px;}
  .bd-grid .bd-title small{text-transform:none; letter-spacing:0; font-weight:600; color:var(--text-faint); margin-left:6px;}
  .bd-grid .kpi-card{padding:11px 14px 10px;}
  .bd-grid .kpi-card .v{font-size:19px;}
  .bd-grid .kpi-card.bd-total{grid-column:1/-1;}
  @media (min-width:640px){ .bd-grid{grid-template-columns:repeat(3,1fr);} .bd-grid .kpi-card.bd-total{grid-column:auto;} }
  @media (min-width:900px){ .bd-grid{grid-template-columns:repeat(5,1fr);} }
  .kpi-card .sub{font-size:10.5px; color:var(--text-faint); margin-top:3px; font-weight:600; line-height:1.25;}
  @media (min-width:900px){ .kpi-grid{gap:14px; padding:6px 24px 4px;} }
  .kpi-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 15px 12px;}
  .kpi-card .v{font-size:21px; font-weight:800; color:var(--text); line-height:1.15;}
  .kpi-card .l{font-size:11.5px; color:var(--text-muted); margin-top:5px; font-weight:600;}
  .kpi-card.warn .v{color:var(--red);}
  .kpi-card.good .v{color:var(--green);}
  .kpi-card.accent .v{color:var(--accent);}

  /* ---------- Controles del panel ---------- */
  .dash-controls{display:flex; flex-wrap:wrap; gap:16px; padding:4px 14px 4px; max-width:1200px; margin:0 auto;}
  @media (min-width:900px){ .dash-controls{padding:4px 24px 4px;} }
  .dash-control-group{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .dash-control-group span{font-size:11.5px; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:.02em;}

  /* ---------- Charts ---------- */
  .chart-grid{display:grid; grid-template-columns:1fr; gap:14px; padding:14px 14px 20px; max-width:1200px; margin:0 auto;}
  @media (min-width:900px){ .chart-grid{grid-template-columns:repeat(2,1fr); padding:14px 24px 24px;} }
  .chart-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px 12px; min-width:0;}
  .chart-card.wide{grid-column:1/-1;}
  .chart-card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px; flex-wrap:wrap;}
  .chart-card h4{margin:0; font-size:13px; font-weight:700; color:var(--text);}
  .dash-note{font-size:11.5px; color:var(--text-muted); font-weight:600; text-transform:none; letter-spacing:0;}
  .chart-sub{display:block; margin-top:2px; font-size:11.5px; color:var(--text-muted); font-weight:600;}
  .chart-section-title{grid-column:1/-1; margin-top:6px; font-size:11.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-muted);}
  .chart-toggle{display:flex; gap:4px;}
  .chart-toggle button{
    padding:4px 10px; border-radius:14px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text-muted); font-size:11px; font-weight:700; cursor:pointer;
  }
  .chart-toggle button.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .chart-wrap{position:relative; height:230px;}
  .chart-empty{padding:60px 0; text-align:center; color:var(--text-faint); font-size:12.5px;}

  /* ---------- Informe del reclamo (iframe a pantalla completa) ---------- */
  .informe-overlay{position:fixed; inset:0; z-index:400; background:#d9d9d9; display:none; flex-direction:column;}
  .informe-overlay.show{display:flex;}
  .informe-top{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:10px 14px; background:var(--surface); border-bottom:1px solid var(--border); color:var(--text); font-weight:700; font-size:13px;}
  .informe-btn{background:var(--surface-2); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer; margin-left:6px;}
  .informe-btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  #informeFrame{flex:1; width:100%; border:0; background:#fff;}

  /* ---------- Modo "PDF para imprimir": fondo blanco, un gráfico por hoja (A4 apaisado) ---------- */
  .print-meta{display:none;}
  @page{size:A4 landscape; margin:0;}   /* margen 0: el navegador no agrega su encabezado/pie (fecha, URL); el margen lo pone el propio gráfico */
  body.print-mode{background:#fff; color:#111; min-height:0; padding:0; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  body.print-mode > *:not(main){display:none !important;}
  body.print-mode #emptyState, body.print-mode #tableView, body.print-mode #kpiGrid, body.print-mode #bdGrid,body.print-mode #dashControls, body.print-mode .chart-section-title{display:none !important;}
  body.print-mode .chart-grid{display:block; max-width:1040px; width:100%; margin:0 auto; padding:0;}
  body.print-mode .chart-card{background:#fff; border:0; border-radius:0; padding:0; margin:0 0 24px; width:100%;}
  body.print-mode .chart-card h4{color:#111; font-size:18px;}
  body.print-mode .chart-sub{color:#555; font-size:13px;}
  body.print-mode .chart-empty{color:#777;}
  body.print-mode .print-meta{display:block; border-bottom:2px solid #E8A33D; padding-bottom:7px; margin-bottom:12px;}
  .print-meta .pm-brand{font-weight:800; font-size:15px; color:#111;}
  .print-meta .pm-line{font-size:11.5px; color:#444; margin-top:2px;}
  body.print-mode .chart-wrap{height:550px !important;}
  body.print-mode .chart-wrap.chart-hbar{height:580px !important;}
  /* Primera hoja: tarjetas de KPIs + reclamos por día hábil, y el gráfico de Evolución un poco más bajo para que entre todo */
  .print-kpis{display:none;}
  body.print-mode .print-kpis{display:block; margin:0 0 12px;}
  body.print-mode .chart-card.pk-first .pm-first-hide{display:none;}
  body.print-mode .chart-card.pk-first .chart-wrap{height:var(--first-h, 440px) !important;}
  body.print-mode .print-kpis .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:0; max-width:none; margin:0 0 10px;}
  body.print-mode .print-kpis .bd-grid{grid-template-columns:repeat(5,1fr);}
  body.print-mode .print-kpis .kpi-card{background:#fff; border:1px solid #888; border-radius:8px; padding:8px 12px 7px;}
  body.print-mode .print-kpis .kpi-card .v{font-size:20px; color:#111;}
  body.print-mode .print-kpis .kpi-card .l{font-size:11.5px; color:#333; margin-top:3px;}
  body.print-mode .print-kpis .kpi-card .sub{font-size:10.5px; color:#444;}
  body.print-mode .print-kpis .bd-title{font-size:11.5px; color:#222; margin:2px 0 0;}
  body.print-mode .print-kpis .bd-title small{color:#555;}
  body.print-mode .print-kpis .kpi-card.bd-total{grid-column:auto;}
  body.print-mode:not(.print-bw) .print-kpis .kpi-card.warn .v{color:#c0392b;}
  body.print-mode:not(.print-bw) .print-kpis .kpi-card.good .v{color:#2e7d32;}
  body.print-mode:not(.print-bw) .print-kpis .kpi-card.accent .v{color:#b26a00;}
  body.print-mode .print-kpis .kpi-card.accent{border-width:2px; border-color:#111;}
  body.print-mode .print-kpis .pk-note{font-size:11px; color:#444; margin-top:-4px;}
  @media print{
    body.print-mode .chart-card{break-after:page; page-break-after:always; break-inside:avoid; margin:0; padding:11mm 0 0;}
    body.print-mode .chart-card:last-child{break-after:auto; page-break-after:auto;}
  }

  .empty-state{padding:60px 20px; text-align:center; color:var(--text-muted);}
  .empty-state .big{font-size:34px; margin-bottom:8px;}
  .empty-state .btn-primary{max-width:260px; margin:16px auto 0;}

  /* ---------- Table ---------- */
  .table-toolbar{display:flex; align-items:center; justify-content:space-between; padding:10px 14px 0; max-width:1200px; margin:0 auto; gap:10px; flex-wrap:wrap;}
  @media (min-width:900px){ .table-toolbar{padding:10px 24px 0;} }
  .table-toolbar .btn-ghost{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:8px 13px;
    border-radius:10px; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .table-wrap{padding:10px 14px 20px; max-width:1200px; margin:0 auto; overflow-x:auto;}
  @media (min-width:900px){ .table-wrap{padding:10px 24px 24px;} }
  table.data-table{width:100%; border-collapse:collapse; font-size:12.5px; min-width:820px;}
  .data-table th{
    position:sticky; top:0; background:var(--surface); text-align:left; padding:9px 10px; color:var(--text-muted);
    font-weight:700; border-bottom:1px solid var(--border); cursor:pointer; white-space:nowrap; user-select:none;
  }
  .data-table th .arrow{opacity:.6; margin-left:3px;}
  .data-table td{padding:9px 10px; border-bottom:1px solid var(--border); white-space:nowrap; color:var(--text);}
  .data-table td.desc{white-space:normal; max-width:260px; overflow:hidden; text-overflow:ellipsis;}
  .data-table tbody tr{cursor:pointer;}
  .data-table tbody tr:hover td{background:var(--surface-2);}
  .table-pager{display:flex; align-items:center; justify-content:center; gap:12px; padding:14px 0 4px;}
  .table-pager button{background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:700; font-size:12.5px;}
  .table-pager button:disabled{opacity:.4; cursor:default;}
  .table-pager span{font-size:12.5px; color:var(--text-muted);}

  .pill{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; display:inline-block; white-space:nowrap;}
  .pill.open{background:rgba(225,82,82,.15); color:var(--red);}
  .pill.closed{background:rgba(76,139,90,.15); color:var(--green);}
  .pill.neutral{background:var(--surface-2); color:var(--text-muted);}

  /* ---------- Sheet (filtros / admin) ---------- */
  .overlay{position:fixed; inset:0; background:rgba(20,23,26,.5); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s;}
  .overlay.show{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41; background:var(--surface);
    border-radius:20px 20px 0 0; max-height:86vh; display:flex; flex-direction:column;
    transform:translateY(100%); transition:transform .25s ease; box-shadow:0 -8px 30px rgba(0,0,0,.3);
    pointer-events:none;
  }
  .sheet.show{transform:translateY(0); pointer-events:auto;}
  @media (min-width:720px){
    .sheet{ left:50%; right:auto; bottom:auto; top:50%; width:560px; max-width:92vw;
      transform:translate(-50%,-46%) scale(.96); opacity:0; border-radius:18px; max-height:82vh;}
    .sheet.show{transform:translate(-50%,-50%) scale(1); opacity:1;}
  }
  .sheet-handle{width:38px; height:4px; background:var(--border); border-radius:3px; margin:10px auto 4px; flex:none;}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; padding:8px 18px 12px; border-bottom:1px solid var(--border); flex:none;}
  .sheet-head h3{margin:0; font-size:16px;}
  .sheet-head button{background:none; border:none; font-size:13px; font-weight:700; color:var(--accent); cursor:pointer;}
  .sheet-body{overflow-y:auto; padding:6px 18px 10px; flex:1;}
  .filter-group{margin:14px 0;}
  .filter-group h4{margin:0 0 8px; font-size:12.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted);}
  .filter-group .opts{display:flex; flex-wrap:wrap; gap:7px;}
  .opt-chip{padding:7px 12px; border-radius:18px; border:1px solid var(--border); background:var(--surface);
    color:var(--text); font-size:12.5px; font-weight:600; cursor:pointer;}
  .opt-chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .date-range{display:flex; gap:8px;}
  .date-range input[type=date]{flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:13px;}
  .sheet-foot{padding:12px 18px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--border); flex:none;}
  .btn-primary{width:100%; padding:13px; border-radius:12px; border:none; background:var(--accent); color:var(--accent-ink); font-size:14.5px; font-weight:700; cursor:pointer;}
  .btn-primary:disabled{opacity:.5; cursor:default;}

  .admin-p{font-size:13px; color:var(--text-muted); line-height:1.5; margin:0 0 14px;}
  .admin-input{
    width:100%; padding:12px 14px; border-radius:11px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:15px; margin-bottom:12px;
  }
  .admin-error{background:rgba(225,82,82,.12); color:var(--red); border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:12px;}
  .admin-ok{background:rgba(76,139,90,.12); color:var(--green); border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:12px;}
  .admin-file{
    position:relative; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px;
    border:1.5px dashed var(--border); border-radius:12px; padding:28px 16px; text-align:center;
    color:var(--text-muted); font-size:13px; cursor:pointer; margin-bottom:14px;
  }
  .admin-file input[type="file"]{
    position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer;
  }
  .admin-file b{color:var(--text); font-size:14px;}
  .diff-summary{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px;}
  .diff-stat{background:var(--surface-2); border-radius:11px; padding:12px 8px; text-align:center;}
  .diff-stat .n{font-size:20px; font-weight:800; color:var(--text);}
  .diff-stat .l{font-size:11px; color:var(--text-muted); margin-top:2px;}
  .diff-list{max-height:180px; overflow-y:auto; border:1px solid var(--border); border-radius:11px; padding:4px 12px; margin-bottom:14px;}
  .diff-list p{font-size:12.5px; padding:6px 0; border-bottom:1px solid var(--border); margin:0;}
  .diff-list p:last-child{border-bottom:none;}
  .admin-note{font-size:12px; color:var(--text-faint); line-height:1.5; margin:10px 0 4px;}
  .admin-spinner{text-align:center; padding:30px 0; color:var(--text-muted); font-size:13px;}
  #adminOverlay{z-index:60;}
  #adminPanel{z-index:61;}
  .admin-tabs{display:flex; gap:8px; margin-bottom:16px;}
  .admin-tab{flex:1; padding:9px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted); font-weight:700; font-size:12.5px; cursor:pointer; text-align:center;}
  .admin-tab.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  textarea.admin-input{resize:vertical; font-family:inherit;}

  /* ---------- Detail drawer ---------- */
  .detail{
    position:fixed; inset:0; z-index:50; background:var(--surface); display:flex; flex-direction:column;
    transform:translateX(100%); transition:transform .22s ease; pointer-events:none;
  }
  .detail.show{transform:translateX(0); pointer-events:auto;}
  @media (min-width:720px){
    .detail{ inset:auto; left:50%; top:50%; width:640px; max-width:92vw; max-height:86vh;
      transform:translate(-50%,-46%) scale(.97); opacity:0; border-radius:18px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.4);}
    .detail.show{transform:translate(-50%,-50%) scale(1); opacity:1;}
  }
  .detail-head{position:relative; flex:none; padding:18px 18px 14px; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .detail-head-actions{display:flex; align-items:center; gap:8px; flex:none;}
  .detail-report-btn{
    background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent); border-radius:10px;
    padding:8px 12px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .detail-close{
    width:34px; height:34px; border-radius:50%; flex:none;

/* ===================== Helpers de parseo ===================== */

function stripAccents(s){ return String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function normHeaderKey(h){ return stripAccents(h).toUpperCase().replace(/[^A-Z0-9]/g,''); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function parseNumber(v){
  if (typeof v === 'number') return v;
  if (v == null) return 0;
  let s = String(v).trim();
  if (!s) return 0;
  s = s.replace(/[^0-9,.\-]/g, '');
  if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
  else if (s.includes(',')) s = s.replace(',', '.');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function parseDateVal(v){
  if (v instanceof Date) return isNaN(v) ? null : v;
  if (typeof v === 'number' && v > 0) {
    const days = Math.floor(v);
    const d = new Date(1899, 11, 30 + days);
    d.setMilliseconds(Math.round((v - days) * 86400000));
    return d;
  }
  if (typeof v === 'string') {
    const s = v.trim();
    if (!s) return null;
    let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
    if (m) {
      let [, d, mo, y] = m;
      if (y.length === 2) y = '20' + y;
      const dt = new Date(+y, +mo - 1, +d);
      if (!isNaN(dt)) return dt;
    }
    const dt2 = new Date(s);
    if (!isNaN(dt2)) return dt2;
  }
  return null;
}
function padNum(n){ return String(n).padStart(2, '0'); }
function fracToHora(f){
  const mins = Math.round((f % 1) * 1440);
  return `${padNum(Math.floor(mins / 60) % 24)}:${padNum(mins % 60)}`;
}
function normHora(v){
  if (v === null || v === undefined || v === '') return '';
  if (v instanceof Date) return isNaN(v) ? '' : `${padNum(v.getHours())}:${padNum(v.getMinutes())}`;
  if (typeof v === 'number') return fracToHora(v);
  const s = String(v).trim();
  if (!s) return '';
  if (/^\d*\.\d+$/.test(s) && parseFloat(s) < 1) return fracToHora(parseFloat(s));
  const m = s.match(/(\d{1,2}):(\d{2})/);
  return m ? `${padNum(+m[1])}:${m[2]}` : s;
}

function monthLabel(k){ const [y,m] = k.split('-'); return `${MONTH_NAMES[+m-1]} '${y.slice(2)}`; }
function quarterKey(d){ return d ? `${d.getFullYear()}-T${Math.floor(d.getMonth()/3)+1}` : null; }
function quarterLabel(k){ const [y,q] = k.split('-'); return `${q} '${y.slice(2)}`; }
function yearKey(d){ return d ? String(d.getFullYear()) : null; }

function wrapLabel(text, max){
  const lines = []; let cur = '';

    if (cur && (cur + ' ' + w).length > max) { lines.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w;

  return lines;
}

// La misma causa escrita distinto (mayúsculas, acentos, espacios) cuenta como una sola.
function causaKey(c){ return stripAccents(String(c || '')).toLowerCase().replace(/\s+/g, ' ').trim(); }
let CAUSA_CANON = new Map();
function buildCausaCanon(rows){
  const counts = new Map();
  rows.forEach(r => {
    const raw = String(r.causa || '').replace(/\s+/g, ' ').trim();
    if (!raw) return;
    const k = causaKey(raw);
    const m = counts.get(k) || counts.set(k, new Map()).get(k);
    m.set(raw, (m.get(raw) || 0) + 1);
  });
  CAUSA_CANON = new Map([...counts].map(([k, m]) => [k, [...m.entries()].sort((a, b) => b[1] - a[1])[0][0]]));
}
function causaOf(r){
  const raw = String(r.causa || '').replace(/\s+/g, ' ').trim();
  return raw ? (CAUSA_CANON.get(causaKey(raw)) || raw) : 'Sin causa';
}
// Cliente (nombre de cliente de la planilla): mismo criterio, el mismo nombre escrito distinto cuenta como uno solo.
let CLIENTE_CANON = new Map();
function buildClienteCanon(rows){
  const counts = new Map();
  rows.forEach(r => {
    const raw = String(r.nombreCliente || '').replace(/\s+/g, ' ').trim();
    if (!raw) return;
    const k = causaKey(raw);
    const m = counts.get(k) || counts.set(k, new Map()).get(k);
    m.set(raw, (m.get(raw) || 0) + 1);
  });
  CLIENTE_CANON = new Map([...counts].map(([k, m]) => [k, [...m.entries()].sort((a, b) => b[1] - a[1])[0][0]]));
}
function clienteOf(r){
  const raw = String(r.nombreCliente || '').replace(/\s+/g, ' ').trim();
  return raw ? (CLIENTE_CANON.get(causaKey(raw)) || raw) : 'Sin cliente';
}
// Períodos (según el agrupado elegido) que cubre la ventana por defecto, aunque no tengan reclamos.
/* ===================== Días hábiles (lunes a viernes, sin feriados nacionales de Argentina) ===================== */

// Feriados nacionales y días no laborables con fines turísticos (MM-DD), por año. Fuente: argentinadatos.com (feriados).
// Para agregar un año nuevo o corregir un día, editar esta tabla. Un año que no esté acá usa solo los feriados fijos.
const FERIADOS_AR = {
  2021: '01-01 02-15 02-16 03-24 04-02 05-01 05-24 05-25 06-20 06-21 07-09 08-16 10-08 10-11 11-20 11-22 12-08 12-25',
  2022: '01-01 02-28 03-01 03-24 04-02 04-15 05-01 05-18 05-25 06-17 06-20 07-09 08-15 09-02 10-07 10-10 11-20 11-21 12-08 12-09 12-20 12-25',
  2023: '01-01 02-20 02-21 03-24 04-02 04-07 05-01 05-25 05-26 06-17 06-19 06-20 07-09 08-21 10-13 10-16 11-20 12-08 12-25',
  2024: '01-01 02-12 02-13 03-24 03-29 04-01 04-02 05-01 05-25 06-17 06-20 06-21 07-09 08-17 10-11 10-12 11-18 12-08 12-25',
  2025: '01-01 03-03 03-04 03-24 04-02 04-18 05-01 05-02 05-25 06-16 06-20 07-09 08-15 08-17 10-10 10-12 11-21 11-24 12-08 12-25',
  2026: '01-01 02-16 02-17 03-23 03-24 04-02 04-03 05-01 05-25 06-15 06-20 07-09 07-10 08-17 10-12 11-23 12-07 12-08 12-25',
  2027: '01-01 02-08 02-09 03-24 03-26 04-02 05-01 05-25 06-17 06-20 07-09 08-17 10-12 11-20 12-08 12-25'
};
const FERIADOS_FIJOS = '01-01 03-24 04-02 05-01 05-25 06-20 07-09 12-08 12-25';
function isFeriado(d){
  const mmdd = `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  return (FERIADOS_AR[d.getFullYear()] || FERIADOS_FIJOS).split(' ').includes(mmdd);
}
// Cantidad de días hábiles entre dos fechas, ambas incluidas.
function businessDays(from, to){
  let n = 0;
  const d = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  const end = new Date(to.getFullYear(), to.getMonth(), to.getDate());
  while (d <= end) {
    const wd = d.getDay();
    if (wd !== 0 && wd !== 6 && !isFeriado(d)) n++;
    d.setDate(d.getDate() + 1);
  }
  return n;
}
// Reclamos por día hábil = carga de trabajo del equipo de SAC: cuántos reclamos ingresaron (y hubo que atender) por trimestre
// y en el último año. Es una estadística FIJA: siempre los últimos 4 trimestres completos, siempre por fecha de reclamo y
// con TODOS los reclamos (ALL), sin importar filtros, búsqueda, fecha base ni de dónde vino el reclamo.
function claimsPerBusinessDay(){
  const w = windowRange();
  const dated = ALL.filter(r => r.fechaReclamo instanceof Date && r.fechaReclamo >= w.from && r.fechaReclamo < w.end);
  const days = businessDays(w.from, w.last);
  if (!dated.length || !days) return null;
  const out = { count: dated.length, days, index: dated.length / days, from: w.from, to: w.last, byQuarter: [] };
  const q = new Date(w.from);
  while (q < w.end) {
    const qEnd = new Date(q.getFullYear(), q.getMonth() + 3, 0);   // último día del trimestre
    const key = quarterKey(q), n = dated.filter(r => quarterKey(r.fechaReclamo) === key).length, dq = businessDays(q, qEnd);
    out.byQuarter.push({ label: quarterLabel(key), count: n, days: dq, index: dq ? n / dq : 0 });
    q.setMonth(q.getMonth() + 3);
  }
  return out;
}

function periodsInWindow(w){
  const set = new Set(), d = new Date(w.from);
  while (d < w.end) { set.add(periodKey(d, state.granularity)); d.setMonth(d.getMonth() + 1); }
  return [...set];
}

/* ===================== Filtros ===================== */

function applyFilters(rows){
  let out = rows;
  // Búsqueda combinada: cada palabra escrita tiene que aparecer en alguno de los campos (sin importar mayúsculas ni acentos),
  // así se puede escribir, por ejemplo, "urban pea eco nat 049 006" (artículo + tono + calibre).
  const terms = stripAccents(state.search).toLowerCase().split(/\s+/).filter(Boolean);
  if (terms.length) {
    out = out.filter(r => {
      const hay = stripAccents([r.nroReclamo, r.nombreCliente, r.nombreUsuario, r.articulo, r.nombre, r.causa, r.tono, r.calibre]
        .map(v => v ?? '').join(' ')).toLowerCase();
      return terms.every(t => hay.includes(t));
    });
  }
  FILTERABLE.forEach(f => {
    const set = state.filters[f.key];
    if (set.size) out = out.filter(r => set.has(String(r[f.key]||'—').trim() || '—'));
  });
  if (state.dateFrom) { const from = new Date(state.dateFrom); out = out.filter(r => r.fechaReclamo && r.fechaReclamo >= from); }
  if (state.dateTo) { const to = new Date(state.dateTo); to.setHours(23,59,59,999); out = out.filter(r => r.fechaReclamo && r.fechaReclamo <= to); }
  if (state.dateFromProd) { const from = new Date(state.dateFromProd); out = out.filter(r => r.fechaProd && r.fechaProd >= from); }
  if (state.dateToProd) { const to = new Date(state.dateToProd); to.setHours(23,59,59,999); out = out.filter(r => r.fechaProd && r.fechaProd <= to); }
  return out;
}

function getFiltered(){ return applyFilters(ALL); }

// El Panel muestra por defecto los últimos 4 trimestres COMPLETOS (el trimestre en curso queda afuera),

// en nov-2026 va de T4 '25 a T3 '26; el 1/1/2027 pasa a T1 '26 – T4 '26.
function hasDateFilter(){ return !!(state.dateFrom || state.dateTo || state.dateFromProd || state.dateToProd); }
function windowRange(){
  const d = new Date();
  const end = new Date(d.getFullYear(), Math.floor(d.getMonth() / 3) * 3, 1);   // inicio del trimestre en curso (excluido)
  const from = new Date(end.getFullYear(), end.getMonth() - 12, 1);
  return { from, end, last: new Date(end.getTime() - 86400000) };
}
function windowLabel(w){ return `${quarterLabel(quarterKey(w.from))} a ${quarterLabel(quarterKey(w.last))}`; }
function dashboardRows(){

/* ===================== Agregaciones ===================== */

function groupCount(rows, key){
  const m = {};
  rows.forEach(r => { const k = String(r[key]||'—').trim() || '—'; m[k] = (m[k]||0) + 1; });
  return m;
}
function groupSum(rows, key, valKey){
  const m = {};
  rows.forEach(r => { const k = String(r[key]||'—').trim() || '—'; m[k] = (m[k]||0) + (r[valKey]||0); });
  return m;
}
function topN(map, n){ return Object.entries(map).sort((a,b) => b[1]-a[1]).slice(0, n); }
function avgDays(rows, fromKey, toKey){
  const diffs = [];
  rows.forEach(r => {
    if (r[fromKey] instanceof Date && r[toKey] instanceof Date) {
      const d = (r[toKey] - r[fromKey]) / 86400000;
      if (d >= 0 && d < 3650) diffs.push(d);
    }
  });
  if (!diffs.length) return null;
  return diffs.reduce((a,b) => a+b, 0) / diffs.length;
}

// Importe de un reclamo: total de gastos (planilla histórica) o notas de crédito (planilla nueva), lo que sea mayor.
function costoOf(r){
  const comp = (r.manoDeObra||0) + (r.materialesPropios||0) + (r.materialesDeTerceros||0) + (r.viaticos||0) + (r.fletes||0);
  const nc = (r.ncTotal||0) || ((r.ncA||0) + (r.ncB||0) + (r.nc3ros||0));
  return Math.max(r.totalGastos||0, comp, nc);
}

// Qué se mide en los gráficos: cantidad de reclamos ("count") o metros cuadrados ("m2").
function metricVal(r){ return state.trendMetric === 'm2' ? (r.metros || 0) : state.trendMetric === 'cost' ? costoOf(r) : 1; }
function fmtMetric(n){ return state.trendMetric === 'm2' ? fmtNum(n, 0) + ' m²' : state.trendMetric === 'cost' ? fmtMoney(n) : fmtNum(n, 0); }
function fmtMetricTip(n){ return state.trendMetric === 'm2' ? fmtNum(n, 1) + ' m²' : state.trendMetric === 'cost' ? fmtMoney(n) : fmtNum(n, 0); }

function buildTimeSeries(rows, dateField, granularity){
  const count = {}, cost = {}, m2 = {};
  rows.forEach(r => {
    const k = periodKey(r[dateField], granularity);
    if (!k) return;
    count[k] = (count[k]||0) + 1;
    cost[k] = (cost[k]||0) + costoOf(r);
    m2[k] = (m2[k]||0) + (r.metros||0);
  });
  const periods = Object.keys(count).sort();
  return { periods, count, cost, m2 };
}

// Compara el mismo mes/trimestre a través de distintos años (interanual).
function buildYoY(rows, dateField, granularity){
  const subCount = {};
  const years = new Set();
  rows.forEach(r => {
    const d = r[dateField];
    if (!(d instanceof Date)) return;
    const year = d.getFullYear();
    const sub = granularity === 'quarter' ? Math.floor(d.getMonth()/3) : d.getMonth();
    years.add(year);
    subCount[year] = subCount[year] || {};
    subCount[year][sub] = (subCount[year][sub]||0) + 1;
  });
  const subLabels = granularity === 'quarter' ? ['T1','T2','T3','T4'] : MONTH_NAMES;
  return { subLabels, years: [...years].sort(), subCount };
}

function computeStats(rows, yoyRows){
  const s = {};
  s.total = rows.length;
  s.totalMetros = rows.reduce((a,r) => a + (r.metros||0), 0);
  const costFields = ['manoDeObra','materialesPropios','materialesDeTerceros','viaticos','fletes'];
  s.costBreakdown = {};
  costFields.forEach(f => s.costBreakdown[f] = rows.reduce((a,r) => a + (r[f]||0), 0));
  s.totalCosto = rows.reduce((a,r) => a + costoOf(r), 0);
  s.costoPromedio = s.total ? s.totalCosto / s.total : 0;

  s.estadoCounts = groupCount(rows, 'finalizado');
  s.abiertos = rows.filter(r => !isClosed(r.finalizado)).length;
  s.cerrados = s.total - s.abiertos;

  s.porCausaCount = topN(groupCount(rows, 'causa'), 8);
  const costoPorCausa = {};
  rows.forEach(r => { const k = String(r.causa||'—').trim() || '—'; costoPorCausa[k] = (costoPorCausa[k]||0) + costoOf(r); });
  s.porCausaCosto = topN(costoPorCausa, 8);
  s.porLinea = topN(groupCount(rows, 'lineaProd'), 10);
  s.porHorno = topN(groupCount(rows, 'horno'), 10);
  s.porTurno = topN(groupCount(rows, 'turno'), 8);
  s.porMarca = topN(groupCount(rows, 'marca'), 8);
  s.porProvincia = topN(groupCount(rows, 'provincia'), 8);
  s.porInspector = topN(groupCount(rows, 'inspector'), 8);
  s.origenCounts = groupCount(rows, 'esDeUnUsuario');

  s.trend = buildTimeSeries(rows, state.dateBasis, state.granularity);
  s.yoy = state.granularity !== 'year' ? buildYoY(yoyRows || rows, state.dateBasis, state.granularity) : null;

  s.lagProdReclamo = avgDays(rows, 'fechaProd', 'fechaReclamo');
  s.lagColocReclamo = avgDays(rows, 'fechaColocacion', 'fechaReclamo');

  const now = new Date();
  const buckets = { '< 7 días':0, '7-30 días':0, '30-90 días':0, '> 90 días':0 };
  rows.forEach(r => {
    if (isClosed(r.finalizado) || !(r.fechaReclamo instanceof Date)) return;
    const d = (now - r.fechaReclamo) / 86400000;
    if (d < 7) buckets['< 7 días']++;
    else if (d < 30) buckets['7-30 días']++;
    else if (d < 90) buckets['30-90 días']++;
    else buckets['> 90 días']++;
  });
  s.aging = buckets;

  return s;
}

// "PDF para imprimir": redibuja los gráficos sobre fondo blanco, uno por hoja, y abre la impresión
// (en el diálogo se elige "Guardar como PDF"). Al terminar vuelve al tema oscuro.
// Rellenos para imprimir en blanco y negro: tonos de gris + tramas, para que cada serie se distinga aunque salga sin color.
const BW_FILLS = [
  { t:'solid', bg:'#dcdcdc' }, { t:'diag', bg:'#ffffff' }, { t:'solid', bg:'#6b6b6b' }, { t:'solid', bg:'#111111' },
  { t:'dots', bg:'#ffffff' }, { t:'cross', bg:'#ffffff' }, { t:'hline', bg:'#ffffff' }, { t:'back', bg:'#dcdcdc' },
  { t:'vline', bg:'#ffffff' }, { t:'solid', bg:'#a0a0a0' }
];
const _bwCache = {};
function bwFill(i){
  const k = BW_FILLS[i % BW_FILLS.length];
  if (k.t === 'solid') return k.bg;
  const key = k.t + k.bg;
  if (_bwCache[key]) return _bwCache[key];
  const c = document.createElement('canvas'); c.width = c.height = 8;
  const g = c.getContext('2d');
  g.fillStyle = k.bg; g.fillRect(0, 0, 8, 8);
  g.strokeStyle = g.fillStyle = '#111'; g.lineWidth = 1.3;
  g.beginPath();
  if (k.t === 'diag' || k.t === 'cross') { g.moveTo(0, 8); g.lineTo(8, 0); g.moveTo(-2, 2); g.lineTo(2, -2); g.moveTo(6, 10); g.lineTo(10, 6); }
  if (k.t === 'back' || k.t === 'cross') { g.moveTo(0, 0); g.lineTo(8, 8); g.moveTo(-2, 6); g.lineTo(2, 10); g.moveTo(6, -2); g.lineTo(10, 2); }
  if (k.t === 'hline') { g.moveTo(0, 4); g.lineTo(8, 4); }
  if (k.t === 'vline') { g.moveTo(4, 0); g.lineTo(4, 8); }
  g.stroke();
  if (k.t === 'dots') { g.beginPath(); g.arc(4, 4, 1.4, 0, Math.PI * 2); g.fill(); }
  return _bwCache[key] = c.getContext('2d').createPattern(c, 'repeat');
}

// Etiquetas con el valor sobre las columnas (solo al imprimir):
//  single = valor arriba de cada columna · stacked = valor en cada tramo + total arriba · grouped = valor girado sobre cada barra.
// Línea vertical punteada entre cada grupo de columnas (causa / cliente) para que no se mezclen a la vista.
const catSepPlugin = {
  id: 'catSep',
  beforeDatasetsDraw(chart, args, opts){
    if (!opts || !opts.color) return;
    const x = chart.scales.x, area = chart.chartArea;
    const n = (chart.data.labels || []).length;
    if (!x || n < 2) return;
    const ctx = chart.ctx;
    ctx.save();
    ctx.strokeStyle = opts.color; ctx.lineWidth = opts.width || 1; ctx.setLineDash([4, 3]);
    for (let i = 0; i < n - 1; i++) {
      const px = Math.round((x.getPixelForTick(i) + x.getPixelForTick(i + 1)) / 2) + 0.5;
      ctx.beginPath(); ctx.moveTo(px, area.top); ctx.lineTo(px, area.bottom + 6); ctx.stroke();
    }
    ctx.restore();
  }
};

const barLabelsPlugin = {
  id: 'barLabels',
  afterDatasetsDraw(chart, args, opts){
    if (!opts || !opts.kind) return;
    const ctx = chart.ctx, fmt = opts.fmt || (n => String(n));
    const metas = chart.data.datasets.map((_, i) => chart.getDatasetMeta(i)).filter(m => !m.hidden);
    ctx.save();
    const ink = opts.color || '#000';
    ctx.fillStyle = ink; ctx.textBaseline = 'alphabetic';
    const font = (px, bold) => `${bold ? '700 ' : '500 '}${px}px -apple-system, "Segoe UI", Roboto, Arial, sans-serif`;
    if (opts.kind === 'single') {
      ctx.font = font(13, true); ctx.textAlign = 'center';
      metas.forEach(m => m.data.forEach((bar, i) => {
        const v = chart.data.datasets[m.index].data[i];
        if (v) ctx.fillText(fmt(v), bar.x, bar.y - 6);
      }));
    } else if (opts.kind === 'grouped') {
      const horizontal = chart.options.indexAxis === 'y';
      ctx.textAlign = 'left';
      metas.forEach(m => m.data.forEach((bar, i) => {
        const v = chart.data.datasets[m.index].data[i];
        if (!v) return;
        // "50 · T4 '25": el valor y a qué período (trimestre) corresponde esa barra
        const name = String(chart.data.datasets[m.index].label || '').split(' (')[0];
        const txt = name ? `${fmt(v)} · ${name}` : fmt(v);
        if (horizontal) {
          // barras horizontales: el texto va a la derecha del extremo de la barra, del alto de la barra
          const fs = Math.min(10, Math.max(7.5, (bar.height || 8) * 1.25));
          ctx.font = font(fs, true);
          ctx.fillText(txt, bar.x + 4, bar.y + fs * 0.36);
        } else {
          ctx.font = font(9.5, true);
          ctx.save(); ctx.translate(bar.x + 3.5, bar.y - 4); ctx.rotate(-Math.PI / 2); ctx.fillText(txt, 0, 0); ctx.restore();
        }
      }));
    } else if (opts.kind === 'stacked') {
      const n = (metas[0] && metas[0].data.length) || 0;
      for (let i = 0; i < n; i++) {
        let total = 0, top = Infinity, x = 0;
        metas.forEach(m => {
          const v = chart.data.datasets[m.index].data[i], bar = m.data[i];
          if (!v || !bar) return;
          total += v; x = bar.x; top = Math.min(top, bar.y, bar.base);
          const h = Math.abs(bar.base - bar.y);
          if (h < 17) return;   // tramo muy finito: solo cuenta en el total
          // "SALTA: 6" — la descripción de la serie junto al número (si no entra en la columna, solo el número)
          const name = String(chart.data.datasets[m.index].label || '').split(' (')[0];
          ctx.font = font(11.5, true); ctx.textAlign = 'center';
          let txt = name ? `${name}: ${fmt(v)}` : fmt(v);
          if (ctx.measureText(txt).width + 8 > (bar.width || 999) - 4) txt = fmt(v);
          const w = ctx.measureText(txt).width + 8, cy = (bar.y + bar.base) / 2;
          ctx.fillStyle = '#fff'; ctx.fillRect(bar.x - w / 2, cy - 9, w, 18);
          ctx.strokeStyle = '#000'; ctx.lineWidth = 0.6; ctx.strokeRect(bar.x - w / 2, cy - 9, w, 18);
          ctx.fillStyle = '#000'; ctx.fillText(txt, bar.x, cy + 4);
        });
        if (total) { ctx.font = font(14, true); ctx.textAlign = 'center'; ctx.fillStyle = '#000'; ctx.fillText(fmt(total), x, top - 7); }
      }
    }
    ctx.restore();
  }
};

// mode: 'color' | 'bw'
function printDashboard(mode){
  if (state.view !== 'dashboard' || !ALL.length) return;
  state.printing = true;
  state.printMode = mode === 'bw' ? 'bw' : 'color';
  document.body.classList.add('print-mode');
  document.body.classList.toggle('print-bw', state.printMode === 'bw');
  window.scrollTo(0, 0);
  renderAll();
  setTimeout(() => { Object.values(charts).forEach(c => c.resize()); window.print(); }, 300);
}
function endPrintDashboard(){
  if (!state.printing) return;
  state.printing = false;
  document.body.classList.remove('print-mode', 'print-bw');
  renderAll();
}
window.addEventListener('afterprint', endPrintDashboard);

function controlToggle(groupLabel, options, activeVal, action){
  return `<div class="dash-control-group"><span>${esc(groupLabel)}</span><div class="chart-toggle">
    ${options.map(o => `<button data-${action}="${o.val}" class="${activeVal===o.val?'active':''}">${esc(o.label)}</button>`).join('')}
  </div></div>`;
}

function renderDashboard(rows, ctx){
  ctx = ctx || { all: rows, windowed: false };
  const s = computeStats(rows, ctx.all);
  const bd = claimsPerBusinessDay();   // fijo: últimos 4 trimestres, todos los reclamos, sin filtros
  const kpiHtml = [
    kpiCard(fmtNum(s.total,0), 'Reclamos'),
    kpiCard(s.abiertos, 'Abiertos', 'warn'),
    kpiCard(fmtNum(s.totalMetros,0)+' m²', 'Metros reclamados'),
    kpiCard(s.cerrados, 'Finalizados', 'good')
  ].join('');
  document.getElementById('kpiGrid').innerHTML = kpiHtml;
  // Reclamos por día hábil (carga de trabajo de SAC): último año + un recuadro por trimestre. No responde a ningún filtro.
  const bdHtml = bd ? [
    `<div class="bd-title">Reclamos atendidos por día hábil · carga de trabajo de SAC<small>fijo: últimos 4 trimestres (${esc(windowLabel(windowRange()))}), todos los reclamos, no cambia con los filtros · lunes a viernes sin feriados nacionales</small></div>`,
    kpiCard(fmtIdx(bd.index), 'Último año (4 trimestres)', 'accent bd-total',
      `${fmtNum(bd.count, 0)} reclamos ÷ ${fmtNum(bd.days, 0)} días hábiles`,
      `${fmtDate(bd.from)} al ${fmtDate(bd.to)}`),
    ...bd.byQuarter.map(q => kpiCard(fmtIdx(q.index), q.label, '',
      `${fmtNum(q.count, 0)} reclamos ÷ ${fmtNum(q.days, 0)} días hábiles`))
  ].join('') : '';
  document.getElementById('bdGrid').innerHTML = bdHtml;

  const unidad = state.trendMetric === 'm2' ? 'Metros cuadrados' : 'Cantidad de reclamos';
  document.getElementById('dashControls').innerHTML =
    controlToggle('Ver por', [
      { val:'count', label:'Cantidad' },
      { val:'m2', label:'Metros cuadrados' }
    ], state.trendMetric, 'metric') +
    controlToggle('Fecha base', [
      { val:'fechaReclamo', label:'Fecha de reclamo' },
      { val:'fechaProd', label:'Fecha de producción' }
    ], state.dateBasis, 'basis') +
    controlToggle('Período', [
      { val:'month', label:'Mensual' },
      { val:'quarter', label:'Trimestral' },
      { val:'year', label:'Anual' }
    ], state.granularity, 'granularity') +
    (hasDateFilter()
      ? `<div class="dash-control-group"><span>Rango</span><div class="dash-note">según los filtros de fecha</div></div>`
      : controlToggle('Rango', [
          { val:'year', label:'Últimos 4 trimestres' },
          { val:'all', label:'Todo el historial' }
        ], state.showAll ? 'all' : 'year', 'range')) +
    `<div class="dash-control-group"><button class="icon-btn" data-action="open-chart-settings">⚙ Editar gráficos</button>` +
    `<button class="icon-btn" data-print-mode="color" title="Fondo blanco, un gráfico por hoja, con colores y valores sobre las columnas. En el diálogo elegí «Guardar como PDF» o tu impresora">🖨 PDF color</button>` +
    `<button class="icon-btn" data-print-mode="bw" title="Fondo blanco, un gráfico por hoja, en grises y tramas (para impresoras blanco y negro) y valores sobre las columnas">🖨 PDF blanco y negro</button></div>` +
    (ctx.windowed
      ? `<div class="dash-note" style="flex-basis:100%;">Mostrando ${esc(windowLabel(ctx.w))} (4 trimestres completos; el trimestre en curso no se incluye) según ${state.dateBasis === 'fechaProd' ? 'fecha de producción' : 'fecha de reclamo'}`
        + (() => { const n = ctx.all.filter(r => !(r[state.dateBasis] instanceof Date)).length; return n ? ` · ${fmtNum(n,0)} reclamo(s) sin esa fecha no se incluyen` : ''; })()
        + `.</div>`
      : '');

  const printing = state.printing;
  Chart.defaults.color = printing ? (state.printMode === 'bw' ? '#000' : '#222') : '#8B92A0';
  Chart.defaults.font.family = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif";
  Chart.defaults.animation = false;
  Chart.defaults.responsiveAnimationDuration = 0;
  Chart.defaults.devicePixelRatio = printing ? 2 : (window.devicePixelRatio || 1);
  const grid = printing ? 'rgba(0,0,0,.12)' : 'rgba(46,52,60,.7)';

  // Encabezado que solo se ve al imprimir: se repite en cada hoja.
  const filtrosTxt = (() => {
    const parts = [];
    FILTERABLE.forEach(f => state.filters[f.key].forEach(v => parts.push(`${f.label}: ${v}`)));
    if (state.dateFrom || state.dateTo) parts.push(`Fecha de reclamo ${state.dateFrom || '…'} a ${state.dateTo || '…'}`);
    if (state.dateFromProd || state.dateToProd) parts.push(`Fecha de producción ${state.dateFromProd || '…'} a ${state.dateToProd || '…'}`);
    return parts.join(' · ');
  })();
  const basisTxt = state.dateBasis === 'fechaProd' ? 'fecha de producción' : 'fecha de reclamo';
  const rangoTxt = ctx.windowed ? `${windowLabel(ctx.w)} (4 trimestres completos)` : hasDateFilter() ? 'según los filtros de fecha' : 'todo el historial';
  const printMeta = `<div class="print-meta"><div class="pm-brand">SAC · Reclamos – Cerámica Alberdi</div>
    <div class="pm-line">${esc(rangoTxt)} · según ${basisTxt} · ${esc(unidad.toLowerCase())}</div>
    ${filtrosTxt ? `<div class="pm-line">Filtros: ${esc(filtrosTxt)}</div>` : ''}
    <div class="pm-line pm-first-hide">${fmtNum(s.total,0)} reclamos · ${fmtNum(s.abiertos,0)} abiertos · ${fmtNum(s.cerrados,0)} finalizados · ${fmtNum(s.totalMetros,0)} m² reclamados</div>
    <div class="pm-line pm-date">Generado el ${esc(new Date().toLocaleDateString('es-AR'))}</div></div>`;

  // Solo en la primera hoja del PDF: las mismas tarjetas del Panel (salen de los mismos datos que los gráficos).
  const sinFecha = rows.filter(r => !(r[state.dateBasis] instanceof Date)).length;
  // Alto del gráfico de la primera hoja: lo que queda del A4 después de las tarjetas (dos filas de tarjetas, filtros y aviso lo achican).
  const firstChartH = printing
    ? 440 - (filtrosTxt ? 18 : 0) - (sinFecha ? 18 : 0)
    : 230;
  const printKpis = `<div class="print-kpis">
      <div class="kpi-grid">${kpiHtml}</div>
      ${bdHtml ? `<div class="kpi-grid bd-grid">${bdHtml}</div>` : ''}
      ${sinFecha ? `<div class="pk-note">${fmtNum(sinFecha, 0)} reclamo(s) sin ${basisTxt} cuentan en las tarjetas pero no figuran en los gráficos.</div>` : ''}
    </div>`;

  const showYoY = chartVisibility.chYoY && s.yoy && s.yoy.years.length > 1;
  const yoyCardHtml = showYoY ? `
    <div class="chart-card wide">
      ${printMeta}
      <div class="chart-card-head"><h4>Comparación interanual (${state.granularity==='quarter'?'por trimestre':'por mes'}${ctx.windowed ? ' · todo el historial' : ''})</h4></div>
      <div class="chart-wrap"><canvas id="chYoY"></canvas></div>
    </div>` : '';

  const GROUP_TITLES = {
    nivel: `${unidad} por nivel · Total › Planta › Línea / Horno › Marca`,
    causa: `Causas por nivel · las 20 causas con más ${state.trendMetric === 'm2' ? 'metros cuadrados' : 'reclamos'} y el resto, comparadas por período`,
    cliente: `Clientes · los 20 con más ${state.trendMetric === 'm2' ? 'metros cuadrados' : 'reclamos'} y el resto, comparados por período`,
    general: 'Otros gráficos'
  };
  let lastGroup = null;
  const optionalCardsHtml = OPTIONAL_CHARTS
    .filter(c => chartVisibility[c.id] && !c.custom)
    .map(c => {
      const g = c.group || 'general';
      const title = g !== lastGroup ? `<div class="chart-section-title">${esc(GROUP_TITLES[g])}</div>` : '';
      lastGroup = g;
      return `${title}<div class="chart-card${c.wide ? ' wide' : ''}">
        ${printMeta}
        <div class="chart-card-head"><div><h4>${esc(c.title)}</h4>${c.sub ? `<small class="chart-sub" id="${c.id}Sub">${esc(c.sub)}</small>` : ''}</div></div>
        <div class="chart-wrap"${c.group === 'causa' || c.group === 'cliente' ? ' style="height:310px"' : ''}><canvas id="${c.id}"></canvas></div></div>`;
    })
    .join('');

  // El gráfico de Evolución (solo el total) quedó opcional y apagado: "Total · por planta" muestra el mismo total con más detalle.
  const trendCardHtml = chartVisibility.chTrend ? `
    <div class="chart-card wide">
      ${printMeta}
      <div class="chart-card-head">
        <h4>Evolución · ${unidad.toLowerCase()} (${state.dateBasis==='fechaReclamo'?'fecha de reclamo':'fecha de producción'})</h4>
      </div>
      <div class="chart-wrap"><canvas id="chTrend"></canvas></div>
    </div>` : '';
  const chartGridEl = document.getElementById('chartGrid');
  chartGridEl.innerHTML = `
    ${trendCardHtml}
    ${yoyCardHtml}
    ${optionalCardsHtml}
  `;
  // La primera hoja del PDF (el primer gráfico que haya, cualquiera sea) lleva las tarjetas de KPIs.
  const firstCard = chartGridEl.querySelector('.chart-card');
  if (firstCard) {
    firstCard.classList.add('pk-first');
    firstCard.style.setProperty('--first-h', firstChartH + 'px');
    const pm = firstCard.querySelector('.print-meta');
    if (pm) pm.insertAdjacentHTML('afterend', printKpis);
  }

  function makeChart(id, config){
    const el = document.getElementById(id);
    if (!el) return;
    if (charts[id]) charts[id].destroy();
    const kind = config.barLabels; delete config.barLabels;
    const drillFn = config.drill; delete config.drill;
    if (drillFn && !printing) {
      // Click en una barra → Listado con los reclamos de esa barra.
      config.options = config.options || {};
      config.options.onClick = (evt, els) => {
        if (!els.length) return;
        const d = drillFn(els[0].datasetIndex, els[0].index);
        if (d && d.rows.length) openDrill(d.title, d.rows);
      };
      config.options.onHover = (evt, els) => { if (evt.native && evt.native.target) evt.native.target.style.cursor = els.length ? 'pointer' : 'default'; };
    }
    if (printing) {
      // Impresión: rellenos según color / blanco y negro, bordes definidos, leyenda más grande y valores sobre las columnas.
      const bw = state.printMode === 'bw';
      config.options = config.options || {};
      const pl = config.options.plugins = config.options.plugins || {};
      if (config.type === 'doughnut') {
        config.data.datasets.forEach(d => {
          if (bw) d.backgroundColor = d.data.map((_, i) => bwFill(i));
          d.borderColor = bw ? '#000' : '#fff'; d.borderWidth = bw ? 1 : 2;
        });
      } else {
        config.data.datasets.forEach((d, i) => {
          if (bw) { d.backgroundColor = bwFill(i); d.borderColor = '#000'; d.borderWidth = 1; }
          else { d.borderColor = 'rgba(0,0,0,.45)'; d.borderWidth = 0.6; }
          d.borderRadius = 0;
        });
      }
      if (pl.legend && pl.legend.labels) { pl.legend.labels.boxWidth = 18; pl.legend.labels.boxHeight = 12; pl.legend.labels.font = { size:12.5 }; pl.legend.labels.color = '#000'; }
      if (kind) {
        pl.barLabels = { kind, fmt: n => fmtNum(n, 0) };
        config.plugins = [...(config.plugins || []), barLabelsPlugin];
        // lugar para las etiquetas de valor: arriba (barras verticales) o a la derecha (barras horizontales)
        const hz = config.options.indexAxis === 'y';
        config.options.layout = { padding: kind === 'grouped' ? (hz ? { top:8, right:78 } : { top:72 }) : { top:28 } };
      }
    }
    charts[id] = new Chart(el, config);
  }
  function hbar(id, entries, color){
    const el = document.getElementById(id);
    if (!el) return;
    if (!entries.length) { el.closest('.chart-wrap').innerHTML = '<div class="chart-empty">Sin datos.</div>'; return; }
    makeChart(id, {
      type:'bar',
      data:{ labels: entries.map(e=>e[0]), datasets:[{ data: entries.map(e=>e[1]), backgroundColor: color||'#E8A33D', borderRadius:4 }] },
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false} },
        scales:{ x:{ grid:{color:grid}, beginAtZero:true }, y:{ grid:{display:false} } } }
    });
  }
  function donut(id, map){
    const el = document.getElementById(id);
    if (!el) return;
    const entries = Object.entries(map);
    if (!entries.length) { el.closest('.chart-wrap').innerHTML = '<div class="chart-empty">Sin datos.</div>'; return; }
    makeChart(id, {
      type:'doughnut',
      data:{ labels: entries.map(e=>e[0]), datasets:[{ data: entries.map(e=>e[1]), backgroundColor: COLORS, borderColor: printing ? '#fff' : '#1D2126', borderWidth:2 }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{size:11} } } } }
    });
  }

  buildCausaCanon(ALL);
  buildClienteCanon(ALL);
  const windowPeriods = ctx.windowed ? periodsInWindow(ctx.w) : [];

  function treeChart(id){
    const node = TREE_NODES[id];
    stackedChart(id, rows.filter(node.rows), node.by, node.order, l => TREE_COLORS[l] || '#5C6470');
  }

  // Causas: las 20 con más reclamos del grupo + "Otras" (21 grupos de barras), con una barra por período
  // dentro de cada grupo, para comparar cómo evoluciona cada causa.
  // Los dos usan siempre `rows`: los reclamos del período y de los filtros activos (los mismos que los gráficos de cantidad).
  function causeChart(id){ groupedChart(id, rows.filter(TREE_NODES[CAUSE_SCOPE[id]].rows), causaOf, 'Otras'); }
  function clientChart(id){ groupedChart(id, rows, clienteOf, 'Otros clientes'); }

  function groupedChart(id, nodeRows, keyOf, restLabel){
    const el = document.getElementById(id);
    if (!el) return;
    const val = metricVal;
    const fmtTot = fmtMetric;
    const totCausa = {};
    nodeRows.forEach(r => { const c = keyOf(r); totCausa[c] = (totCausa[c] || 0) + val(r); });
    const top = Object.entries(totCausa).sort((a, b) => b[1] - a[1]).slice(0, 20).map(e => e[0]);
    const catOf = r => { const c = keyOf(r); return top.includes(c) ? c : restLabel; };
    const totCat = {}, byPeriod = {}, periods = new Set(windowPeriods);
    let dated = 0;
    nodeRows.forEach(r => {
      const cat = catOf(r);
      totCat[cat] = (totCat[cat] || 0) + val(r);
      const p = periodKey(r[state.dateBasis], state.granularity);
      if (!p) return;
      dated++;
      periods.add(p);
      byPeriod[p] = byPeriod[p] || {};
      byPeriod[p][cat] = (byPeriod[p][cat] || 0) + val(r);
    });
    const sub = document.getElementById(id + 'Sub');
    if (sub) {
      const base = OPTIONAL_CHARTS.find(c => c.id === id).sub;
      const sinFecha = nodeRows.length - dated;
      sub.textContent = `${base} · ${fmtNum(nodeRows.length,0)} reclamos` + (sinFecha ? ` (${fmtNum(sinFecha,0)} sin ${state.dateBasis === 'fechaProd' ? 'fecha de producción' : 'fecha'})` : '');
    }
    const pl = [...periods].sort();
    // Orden de mayor a menor según el valor del ÚLTIMO período (el más reciente); si empatan, por el total. "Otras" va siempre al final.
    const lastP = pl[pl.length - 1];
    const lastVal = c => (byPeriod[lastP] && byPeriod[lastP][c]) || 0;
    const cats = [...top.filter(c => totCat[c]).sort((a, b) => (lastVal(b) - lastVal(a)) || (totCat[b] - totCat[a])), ...(totCat[restLabel] ? [restLabel] : [])];
    if (!cats.length || !periods.size) { el.closest('.chart-wrap').innerHTML = '<div class="chart-empty">Sin datos.</div>'; return; }
    // Siempre vertical (pedido del usuario, 19-nov-2026): una columna por período dentro de cada causa / cliente.
    const horiz = false;
    const valOf = c => horiz ? c.parsed.x : c.parsed.y;
    const cardTitle = OPTIONAL_CHARTS.find(c => c.id === id).title;
    // Dentro de cada causa / cliente las columnas van del trimestre MÁS RECIENTE al más antiguo (de izquierda a derecha).
    // El color sigue siendo el de cada período (el más reciente, naranja).
    const plr = [...pl].reverse();
    makeChart(id, {
      type:'bar', barLabels:'grouped',
      plugins: [catSepPlugin],
      drill: (di, i) => ({ title: `${cardTitle} · ${cats[i]} · ${periodLabel(plr[di], state.granularity)}`,
        rows: nodeRows.filter(r => catOf(r) === cats[i] && periodKey(r[state.dateBasis], state.granularity) === plr[di]) }),
      data:{ labels: cats.map(c => `${c} (${fmtTot(totCat[c])})`),
        datasets: plr.map(p => ({
          label: `${periodLabel(p, state.granularity)} (${fmtTot(cats.reduce((a, c) => a + ((byPeriod[p] && byPeriod[p][c]) || 0), 0))})`,
          backgroundColor: periodColor(pl.indexOf(p), pl.length), borderRadius:2,
          categoryPercentage:0.92, barPercentage:0.96,
          data: cats.map(c => (byPeriod[p] && byPeriod[p][c]) || 0)
        })) },
      options:{ indexAxis: horiz ? 'y' : 'x', responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{size:11} } },
          catSep:{ color: printing ? 'rgba(0,0,0,.5)' : 'rgba(255,255,255,.3)', width:1 },
          tooltip:{ callbacks:{ title: items => cats[items[0].dataIndex], label: c => c.dataset.label.split(' (')[0] + ': ' + fmtMetricTip(valOf(c)) } } },
        scales: horiz
          ? { x:{ grid:{color:grid}, beginAtZero:true }, y:{ grid:{display:false}, ticks:{ font:{size:10.5}, autoSkip:false } } }
          : { x:{ grid:{display:false}, ticks:{ font:{size:10.5}, minRotation:55, maxRotation:55, autoSkip:false } }, y:{ grid:{color:grid}, beginAtZero:true } } }
    });
  }

  // Barras apiladas por período: una serie por rama del árbol (o por causa).
  function stackedChart(id, nodeRows, by, order, colorOf){
    const el = document.getElementById(id);
    if (!el) return;
    const totals = {}, byLabel = {}, periods = new Set(windowPeriods);
    let dated = 0;
    nodeRows.forEach(r => {
      const lab = by(r);
      const v = metricVal(r);
      totals[lab] = (totals[lab] || 0) + v;
      const p = periodKey(r[state.dateBasis], state.granularity);
      if (!p) return;
      dated++;
      periods.add(p);
      byLabel[lab] = byLabel[lab] || {};
      byLabel[lab][p] = (byLabel[lab][p] || 0) + v;
    });
    const sub = document.getElementById(id + 'Sub');
    if (sub) {
      const base = OPTIONAL_CHARTS.find(c => c.id === id).sub;
      const sinFecha = nodeRows.length - dated;
      sub.textContent = `${base} · ${fmtNum(nodeRows.length,0)} reclamos` + (sinFecha ? ` (${fmtNum(sinFecha,0)} sin ${state.dateBasis === 'fechaProd' ? 'fecha de producción' : 'fecha'})` : '');
    }
    const labels = order.filter(l => totals[l]);
    if (!labels.length || !periods.size) { el.closest('.chart-wrap').innerHTML = '<div class="chart-empty">Sin datos.</div>'; return; }
    const pl = [...periods].sort();
    const fmtTot = fmtMetric;
    const cardTitle = OPTIONAL_CHARTS.find(c => c.id === id).title;
    makeChart(id, {
      type:'bar', barLabels:'stacked',
      drill: (di, i) => ({ title: `${cardTitle} · ${labels[di]} · ${periodLabel(pl[i], state.granularity)}`,
        rows: nodeRows.filter(r => by(r) === labels[di] && periodKey(r[state.dateBasis], state.granularity) === pl[i]) }),
      data:{ labels: pl.map(p => periodLabel(p, state.granularity)),
        datasets: labels.map(l => ({
          label: `${l} (${fmtTot(totals[l])})`, backgroundColor: colorOf(l), borderRadius:2,
          data: pl.map(p => (byLabel[l] && byLabel[l][p]) || 0)
        })) },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{size:11} } },
          tooltip:{ mode:'index', callbacks:{
            label: ctx => ctx.dataset.label.split(' (')[0] + ': ' + fmtMetricTip(ctx.parsed.y),
            footer: items => 'Total: ' + fmtMetricTip(items.reduce((t, it) => t + (it.parsed.y || 0), 0))   // suma de todas las series de esa columna
          } } },
        scales:{ x:{ stacked:true, grid:{display:false} }, y:{ stacked:true, grid:{color:grid}, beginAtZero:true } } }
    });
  }

  const trendPeriods = [...new Set([...windowPeriods, ...s.trend.periods])].sort();
  makeChart('chTrend', {
    type:'bar', barLabels:'single',
    drill: (di, i) => ({ title: `Evolución · ${periodLabel(trendPeriods[i], state.granularity)}`,
      rows: rows.filter(r => periodKey(r[state.dateBasis], state.granularity) === trendPeriods[i]) }),
    data:{ labels: trendPeriods.map(p => periodLabel(p, state.granularity)),
      datasets:[{ label: state.trendMetric==='m2' ? 'Metros cuadrados' : 'Reclamos',
        data: trendPeriods.map(p => s.trend[state.trendMetric === 'm2' ? 'm2' : state.trendMetric === 'cost' ? 'cost' : 'count'][p] || 0),
        backgroundColor:'#E8A33D', borderRadius:4 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false},
      tooltip:{ callbacks:{ label: ctx => state.trendMetric==='count' ? ctx.parsed.y+' reclamos' : fmtMetricTip(ctx.parsed.y) } } },
      scales:{ x:{ grid:{display:false} }, y:{ grid:{color:grid}, beginAtZero:true } } }
  });

  if (showYoY) {
    makeChart('chYoY', {
      type:'bar', barLabels:'grouped',
      data:{ labels: s.yoy.subLabels,
        datasets: s.yoy.years.map((y,i) => ({
          label:String(y), backgroundColor: COLORS[i % COLORS.length], borderRadius:4,
          data: s.yoy.subLabels.map((_,idx) => (s.yoy.subCount[y] && s.yoy.subCount[y][idx]) || 0)
        })) },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{size:11} } } },
        scales:{ x:{ grid:{display:false} }, y:{ grid:{color:grid}, beginAtZero:true } } }
    });
  }

  Object.keys(TREE_NODES).forEach(treeChart);
  Object.keys(CAUSE_SCOPE).forEach(causeChart);
  clientChart('chCliente');
  donut('chEstado', s.estadoCounts);
  donut('chOrigen', s.origenCounts);
  hbar('chAging', Object.entries(s.aging), '#E15252');

const TABLE_COLS = [
  { key:'nroReclamo', label:'N°' },
  { key:'fechaReclamo', label:'Fecha reclamo' },
  { key:'fechaProd', label:'Fecha prod.' },
  { key:'clienteDisplay', label:'Cliente / usuario', sortKey:'nombreCliente' },
  { key:'productoDisplay', label:'Artículo', sortKey:'articulo' },
  { key:'causa', label:'Causa' },
  { key:'metros', label:'m²' },
  { key:'tono', label:'Tono' },
  { key:'calibre', label:'Calibre' },
  { key:'finalizado', label:'Estado' }
];

// Al venir de una barra del gráfico se agregan Horno y Marca: son los datos que clasifican el reclamo
// en SALTA / JCP / H4 / H5 / VIT / ALB y sirven para ver por qué algo cayó en "Otros".
const DRILL_EXTRA_COLS = [
  { key:'horno', label:'Horno' },
  { key:'marca', label:'Marca' }
];
function tableCols(){ return state.drill ? [...TABLE_COLS, ...DRILL_EXTRA_COLS] : TABLE_COLS; }

function rowValue(r, key){
  if (key === 'clienteDisplay') return r.nombreCliente || r.nombreUsuario || '—';
  if (key === 'productoDisplay') return [r.articulo, r.nombre].filter(Boolean).join(' · ') || '—';
  return r[key];
}

function renderTableView(rows){
  document.getElementById('drillBar').innerHTML = state.drill
    ? `<span class="drill-chip">🔎 ${esc(state.drill.title)} · ${fmtNum(rows.length, 0)} reclamo(s)<button data-action="clear-drill">✕ Ver todos</button></span>`
    : '';
  const sorted = [...rows].sort((a,b) => {
    const ka = state.sortKey, kb = state.sortKey;
    let va = rowValue(a, ka), vb = rowValue(b, kb);
    if (va instanceof Date || vb instanceof Date) { va = va ? +va : 0; vb = vb ? +vb : 0; }
    else if (typeof va === 'number' || typeof vb === 'number') { va = va||0; vb = vb||0; }
    else { va = String(va||'').toLowerCase(); vb = String(vb||'').toLowerCase(); }
    const cmp = va < vb ? -1 : va > vb ? 1 : 0;
    return state.sortDir === 'asc' ? cmp : -cmp;
  });
  const totalPages = Math.max(1, Math.ceil(sorted.length / state.pageSize));
  state.page = Math.min(state.page, totalPages);
  const pageRows = sorted.slice((state.page-1)*state.pageSize, state.page*state.pageSize);

  const cols = tableCols();
  document.getElementById('tableHead').innerHTML = cols.map(c => {
    const active = state.sortKey === (c.sortKey||c.key);
    const arrow = active ? (state.sortDir==='asc'?'▲':'▼') : '';
    return `<th data-sort="${c.sortKey||c.key}">${esc(c.label)} <span class="arrow">${arrow}</span></th>`;
  }).join('');

  document.getElementById('tableBody').innerHTML = pageRows.map(r => {
    const cells = cols.map(c => {
      let v = rowValue(r, c.key);
      if ((c.key === 'horno' || c.key === 'marca' || c.key === 'tono' || c.key === 'calibre') && !String(v || '').trim()) v = '—';
      if (c.key === 'fechaReclamo' || c.key === 'fechaProd') v = fmtDate(v);
      else if (c.key === 'metros') v = fmtNum(v,1);
      else if (c.key === 'finalizado') v = `<span class="pill ${isClosed(r.finalizado) ? 'closed' : 'open'}">${isClosed(r.finalizado) ? 'Cerrado' : 'Abierto'}</span>`;
      else v = esc(v ?? '—');
      const cls = c.key === 'productoDisplay' ? 'desc' : '';
      return `<td class="${cls}">${v}</td>`;
    }).join('');
    return `<tr data-id="${esc(r.nroReclamo)}">${cells}</tr>`;
  }).join('') || `<tr><td colspan="${cols.length}" style="text-align:center;color:var(--text-faint);padding:30px;">Sin resultados.</td></tr>`;

  document.getElementById('tablePager').innerHTML = `
    <button data-page="prev" ${state.page<=1?'disabled':''}>‹ Anterior</button>
    <span>Página ${state.page} de ${totalPages} (${sorted.length} reclamos)</span>
    <button data-page="next" ${state.page>=totalPages?'disabled':''}>Siguiente ›</button>
  `;
}

function rowsForExport(rows){
  const cols = Object.keys(FIELD_LABELS);
  return rows.map(r => {
    const obj = {};
    cols.forEach(c => {
      let v = r[c];
      if (v instanceof Date) v = fmtDate(v);
      obj[FIELD_LABELS[c]] = v ?? '';
    });
    return obj;
  });
}

function exportCsv(rows){
  const cols = Object.keys(FIELD_LABELS);
  const lines = [cols.map(c => FIELD_LABELS[c]).join(';')];
  rows.forEach(r => {
    lines.push(cols.map(c => {
      let v = r[c];
      if (v instanceof Date) v = fmtDate(v);
      return `"${String(v ?? '').replace(/"/g,'""')}"`;
    }).join(';'));
  });
  const blob = new Blob(['﻿' + lines.join('\n')], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'reclamos_alberdi.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

function exportXlsx(rows){
  const ws = XLSX.utils.json_to_sheet(rowsForExport(rows));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Reclamos');
  XLSX.writeFile(wb, 'reclamos_alberdi.xlsx');
}

function buildSpecGroupsHtml(r){
  return DETAIL_GROUPS.map(g => {
    const rows = g.fields.filter(f => {
      const v = r[f];
      return v !== undefined && v !== null && v !== '' && !(typeof v === 'number' && !NUMERIC_FIELDS.includes(f));
    }).map(f => {
      let v = r[f];
      if (v instanceof Date) v = fmtDate(v);
      else if (M2_FIELDS.includes(f)) v = fmtNum(v,1) + ' m²';
      else if (NUMERIC_FIELDS.includes(f)) v = fmtMoney(v);
      else v = esc(v);
      return `<tr><td>${esc(FIELD_LABELS[f]||f)}</td><td>${v}</td></tr>`;
    }).join('');
    if (!rows) return '';
    return `<div class="spec-group-title">${esc(g.title)}</div><table class="spec-table">${rows}</table>`;
  }).join('') || '<p class="admin-p">Sin datos adicionales.</p>';
}

function jcVal(r, f){
  let v = r[f];
  if (v === undefined || v === null || v === '') return '';
  if (v instanceof Date) return fmtDate(v);
  if (M2_FIELDS.includes(f)) return fmtNum(v,1);
  if (NUMERIC_FIELDS.includes(f)) return fmtMoney(v);
  return esc(v);
}
function jcField(r, f, labelOverride){
  const label = labelOverride || FIELD_LABELS[f] || f;
  return `<div class="jc-field"><label>${esc(label)}</label><div class="val">${jcVal(r,f)}</div></div>`;
}

function parseDateInputVal(v){
  if (!v) return null;
  const [y, m, d] = v.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function dateToInputVal(d){
  if (!(d instanceof Date) || isNaN(d)) return '';
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function fieldInputHtml(f, value){
  const id = 'nr_' + f.key;
  const val = f.type === 'date' ? dateToInputVal(value) : (value ?? '');
  let input;
  if (f.type === 'sino') input = `<select class="admin-input" id="${id}"><option value="NO" ${val==='NO'?'selected':''}>No</option><option value="SI" ${val==='SI'?'selected':''}>Sí</option></select>`;
  else if (f.type === 'textarea') input = `<textarea class="admin-input" id="${id}" rows="2">${esc(val)}</textarea>`;
  else input = `<input class="admin-input" id="${id}" type="${f.type==='number'?'number':f.type==='date'?'date':'text'}" ${f.type==='number'?'step="0.01"':''} value="${esc(val)}">`;
  return `<div class="filter-group"><h4>${esc(f.label)}</h4>${input}</div>`;
}

// Asigna el correlativo y guarda el reclamo en una sola transacción, sin pisar nunca uno existente:
// parte del mayor entre el contador y los reclamos cargados (el contador puede quedar atrasado si
// una importación se corta a la mitad) y, si ese número ya está ocupado, prueba con el siguiente.
async function createReclamo(data){
  const counterRef = db.collection('reclamos_sac_meta').doc('counter');
  const maxLoaded = ALL.reduce((m, r) => Math.max(m, parseInt(r.nroReclamo, 10) || 0), 0);
  return db.runTransaction(async tx => {
    const snap = await tx.get(counterRef);
    let nro = Math.max(snap.exists ? (snap.data().last || 0) : 0, maxLoaded) + 1;
    while ((await tx.get(db.collection(COLLECTION).doc(String(nro)))).exists) nro++;
    tx.set(counterRef, { last: nro }, { merge:true });
    tx.set(db.collection(COLLECTION).doc(String(nro)), { ...data, nroReclamo: String(nro) });
    return nro;
  });
}

function parseWorkbook(buf){
  const wb = XLSX.read(buf, { type:'array', cellDates:true });
  const sheetName = wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header:1, defval:'', blankrows:false, raw:true });
  const knownCount = r => r.reduce((n, c) => n + (XLSX_KEY_MAP[normHeaderKey(c)] ? 1 : 0), 0);
  let headerRowIdx = rows.findIndex(r => r.some(c => normHeaderKey(c) === 'NRORECLAMO'));
  if (headerRowIdx === -1) headerRowIdx = rows.findIndex(r => knownCount(r) >= 6);
  if (headerRowIdx === -1) throw new Error('No encontré la fila de encabezados en la primera hoja ("' + sheetName + '"). Revisá que sea la hoja correcta.');
  const rawHeaders = rows[headerRowIdx];
  const headers = rawHeaders.map(normHeaderKey);
  let assumedNro = false;
  if (!headers.includes('NRORECLAMO')) {
    if (headers[0] === '') { headers[0] = 'NRORECLAMO'; assumedNro = true; }
    else throw new Error('No encontré la columna "NroReclamo" ni una primera columna sin título para usarla como N° de reclamo.');
  }
  const ignored = rawHeaders
    .map((h, i) => ({ h: String(h ?? '').replace(/^[\s']+/, '').trim(), k: headers[i] }))
    .filter(x => x.k && !XLSX_KEY_MAP[x.k]).map(x => x.h);
  const dataRows = rows.slice(headerRowIdx + 1);
  const records = [];
  let skipped = 0;
  for (const r of dataRows) {
    const obj = {};
    let hasData = false;
    headers.forEach((hk, i) => {
      const key = XLSX_KEY_MAP[hk];
      if (!key) return;
      let raw = r[i];
      if (raw === undefined) raw = '';
      if (raw !== '') hasData = true;
      if (NUMERIC_FIELDS.includes(key)) obj[key] = parseNumber(raw);
      else if (DATE_FIELDS.includes(key)) obj[key] = parseDateVal(raw);
      else if (key === 'hora') obj[key] = normHora(raw);
      else obj[key] = String(raw).trim();
    });
    if (!hasData) continue;
    if (/^\d+$/.test(obj.nroReclamo || '')) records.push(obj); else skipped++;
  }
  if (!records.length) throw new Error('No encontré filas de reclamos con datos debajo del encabezado.');
  parseWorkbook.lastInfo = { sheetName, headerRow: headerRowIdx + 1, assumedNro, ignored, skipped };
  return records;
}

function isEmptyVal(f, v){
  if (v === undefined || v === null || v === '') return true;
  if (v instanceof Date) return isNaN(v);
  if (NUMERIC_FIELDS.includes(f) && v === 0) return true;
  return false;
}
function sameVal(a, b){
  if (a instanceof Date || b instanceof Date) {
    return a instanceof Date && b instanceof Date && a.toDateString() === b.toDateString();
  }
  if (typeof a === 'number' && typeof b === 'number') return Math.abs(a - b) < 0.005;
  return String(a ?? '').trim() === String(b ?? '').trim();
}

// La lista en pantalla puede estar atrasada (se cargó un reclamo desde otra PC): los números que
// parecen nuevos se confirman contra la base, para no tomar como nuevo uno que ya existe.
async function claimsOnServer(ids){
  const found = [];
  for (let i = 0; i < ids.length; i += 20) {
    const snaps = await Promise.all(ids.slice(i, i + 20).map(id => db.collection(COLLECTION).doc(id).get({ source:'server' })));
    snaps.forEach(s => { if (s.exists) found.push(claimFromDoc(s)); });
  }
  return found;
}

// Mismo N° pero con otro cliente Y otro producto: no es una actualización, son dos reclamos distintos.
function isOtherClaim(row, old){
  const norm = v => stripAccents(v).toLowerCase().replace(/[^a-z0-9]/g, '');
  const differ = (a, b) => !!norm(a) && !!norm(b) && norm(a) !== norm(b);
  const otherClient = differ(row.nombreCliente || row.nombreUsuario, old.nombreCliente || old.nombreUsuario);
  const otherProduct = row.articulo && old.articulo ? differ(row.articulo, old.articulo) : differ(row.nombre, old.nombre);
  return otherClient && otherProduct;
}

// Un reclamo que ya existe se actualiza solo con los campos que la planilla trae con valor:
// lo que la planilla deja vacío (o lo que se cargó/editó en la app y no está en la planilla) no se pisa.
function buildDiff(rows, existing){
  const byId = new Map(existing.map(r => [String(r.nroReclamo), r]));
  const nuevos = [], actualizados = [], sinCambios = [], conflictos = [];
  for (const row of rows) {
    const match = byId.get(String(row.nroReclamo));
    if (!match) { nuevos.push(row); continue; }
    if (isOtherClaim(row, match)) { conflictos.push({ row, match }); continue; }
    const merged = { ...match };
    let changed = false;
    XLSX_FIELDS.forEach(f => {
      const v = row[f];
      if (isEmptyVal(f, v)) return;
      if (!sameVal(v, match[f])) { merged[f] = v; changed = true; }
    });
    (changed ? actualizados : sinCambios).push(merged);
  }
  return { nuevos, actualizados, sinCambios, conflictos };
}

async function confirmUpdate(){
  const d = admin.diff;
  const statusEl = document.getElementById('adminConfirmStatus');
  const btn = document.querySelector('[data-action="confirm-update"]');
  btn.disabled = true;
  const toWrite = [...d.nuevos, ...d.actualizados];
  const CHUNK = 400;
  try {
    for (let i = 0; i < toWrite.length; i += CHUNK) {
      const batch = db.batch();
      toWrite.slice(i, i + CHUNK).forEach(r => {
        const docId = String(r.nroReclamo).replace(/[\/\s]+/g, '-');
        batch.set(db.collection(COLLECTION).doc(docId), r);
      });
      await batch.commit();
      statusEl.innerHTML = `<p class="admin-note">Subidos ${Math.min(i+CHUNK, toWrite.length)} / ${toWrite.length}…</p>`;
    }
    const maxNro = Math.max(0, ...toWrite.map(r => parseInt(r.nroReclamo, 10) || 0), ...ALL.map(r => parseInt(r.nroReclamo, 10) || 0));
    const counterRef = db.collection('reclamos_sac_meta').doc('counter');
    await db.runTransaction(async tx => {
      const snap = await tx.get(counterRef);
      const cur = snap.exists ? (snap.data().last || 0) : 0;
      if (maxNro > cur) tx.set(counterRef, { last: maxNro }, { merge:true });
    });
    const idx = new Map(ALL.map((r, i) => [String(r.nroReclamo), i]));
    toWrite.forEach(r => {
      const i = idx.get(String(r.nroReclamo));
      if (i === undefined) ALL.push(r); else ALL[i] = r;
    });
    renderFilterSheetOptions();
    document.getElementById('adminBody').innerHTML = `
      <p class="admin-p"><b>¡Listo!</b> Se actualizaron ${toWrite.length} reclamos (${d.nuevos.length} nuevos, ${d.actualizados.length} modificados). El panel ya se actualizó solo.</p>
      <button class="btn-primary" data-action="close-admin">Cerrar</button>
    `;
    renderAll();
  } catch (e) {
    console.error(e);
    statusEl.innerHTML = `<p class="admin-error">Hubo un error subiendo los cambios: ${esc(e.message)}</p>`;
    btn.disabled = false;
  }
}
